              <span class="hint">${t.rows.length}행 × ${t.columns.length}열 · 숫자 열 ${nums.size}개${t.removed ? ` · 평균·규격 등 요약 행 ${t.removed}개 제외` : ''}</span></div>
            <div class="grid-3" style="grid-template-columns: 2fr 1fr 1fr;">
              <div class="field"><label>데이터 이름</label><input class="input" value="${escapeHtml(imp.name)}" onchange="setImp('name', this.value)"></div>
              <div class="field"><label>시험 종류</label><select class="select" onchange="setImp('testType', this.value)">${typeOpts}</select></div>
              <div class="field"><label>머리글 행 ${p.ai ? '' : '(표 첫 줄)'}</label>
                <div class="row" style="flex-wrap:nowrap; gap:4px;">
                  <button class="btn sm" onclick="setImp('hdr', ${imp.hdr - 1})" ${imp.hdr <= 0 ? 'disabled' : ''}>−</button>
                  <input class="input mono" style="text-align:center;" value="${imp.hdr + 1}" onchange="setImp('hdr', Number(this.value) - 1)">
                  <button class="btn sm" onclick="setImp('hdr', ${imp.hdr + 1})">+</button>
                </div>
              </div>
            </div>
            ${p.sheets.length > 1 ? `<div class="field"><label>시트</label><div class="seg">${p.sheets.map((s, i) => `<button class="${i === imp.sheet ? 'on' : ''}" onclick="setImp('sheet', ${i})">${escapeHtml(s.name)}</button>`).join('')}</div></div>` : ''}
            ${meta.material || meta.standard || meta.testDate ? `<p class="hint">AI가 읽은 정보: ${[meta.material && `소재 ${meta.material}`, meta.standard && `규격 ${meta.standard}`, meta.testDate && `시험일 ${meta.testDate}`].filter(Boolean).map(escapeHtml).join(' · ')}</p>` : ''}
            ${meta.notes ? `<p class="hint">성적서 비고: ${escapeHtml(meta.notes)}</p>` : ''}
            ${t.rows.length ? `
            <div class="tbl-wrap" style="max-height:300px;">
              <table class="tbl"><thead><tr>${t.columns.map((c, i) => `<th class="${nums.has(i) ? 'num' : ''}">${escapeHtml(c)}${nums.has(i) ? '<span class="tag">숫자</span>' : ''}</th>`).join('')}</tr></thead>
              <tbody>${t.rows.slice(0, LIM).map(r => `<tr>${r.map((v, i) => `<td class="${nums.has(i) ? 'num' : ''}">${escapeHtml(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>
            </div>
            ${t.rows.length > LIM ? `<p class="hint">외 ${t.rows.length - LIM}행</p>` : ''}` : `<div class="empty">이 위치에서 데이터 행을 찾지 못했습니다. 머리글 행을 조정해 보세요.</div>`}
            <p class="hint">${p.ai ? 'AI 추출 결과는 원본 성적서와 숫자를 대조해 주세요.' : '머리글이 맞지 않으면 위에서 머리글 행을 바꾸세요. 빈 줄을 뺀 순서 기준입니다.'}</p>
            <div class="row">
              <button class="btn primary" onclick="confirmImport()" ${t.rows.length ? '' : 'disabled'}><i class="fa-solid fa-check"></i> ${target === 'report' ? '이 표를 보고서에 넣기' : '이 표로 불러오기'}</button>
              <button class="btn" onclick="closeImp()">취소</button>
            </div>
          </div>
        </section>`;
    }

    // ================= 14. AI 상담 (먼저 의견 → 질문·답변) =================
    // 기록.chat: [{ role: 'ai'|'user'|'err', text, ts, model }]
    const CHAT_QUICK = {
      fracto: ['왜 파손됐을까?', '파단 기점은 어디로 보여?', '피로 파괴가 맞아? 근거는?', '재발 방지 대책은?', '원인 확정에 필요한 추가 분석은?'],
      micro: ['이 조직은 정상 범위야?', '조대립·이상 조직의 원인은?', '열처리 조건은 적절해 보여?', '강도·피로에 어떤 영향이 있어?', '추가로 어떤 분석이 필요해?'],
      tests: ['결과를 어떻게 해석해야 해?', '목표 미달 원인은?', '조건 간 차이가 의미 있는 수준이야?', '개선하려면 무엇을 바꿔야 해?', '추가로 어떤 시험이 필요해?']
    };
    const CHAT_SYSTEM = `당신은 금속 소재 시험·파손 분석(fractography)·미세조직 분석 전문가로서 연구원과 상담합니다.
- 한국어로 답하고 핵심부터 간결하게 씁니다. 목록은 '- '로 시작하고, 소제목은 **굵게** 씁니다.
- 이미지나 입력값으로 확인되는 내용은 [관찰], 해석·추정은 [추정]으로 구분하고, 추정에는 확신도(상/중/하)를 붙입니다.
- 이미지 해상도·배율·자료 부족으로 판단할 수 없는 것은 그렇다고 말하고, 필요한 추가 자료를 요청합니다.
- 불확실한 내용을 사실처럼 단정하지 않습니다. 최종 판정은 분석자의 확인이 필요하다는 전제로 말합니다.
- 분석자가 이미지에 표시한 주석을 참고합니다: 노란 선 = 길이 측정, 청록 영역 = 면적 영역, 분홍 원 = 주석(번호·종류), 연두 점선 = 절편법 시험선, 주황 X = 교차점, 청록 점 = 점 계수 표시, 흰 점선 = 스케일 보정선.
- 답변은 보통 15줄 이내로 합니다.`;
    const CHAT_FIRST = {
      fracto: `질문을 받기 전에, 먼저 이 파단면에 대한 당신의 의견을 제시하세요. 아래 순서로 씁니다.
**종합 의견** (2~3줄)
**파괴 양상** — 판단과 근거
**파단 기점** — 추정 위치와 근거
**추정 파손 원인** — 가능성 높은 순 2~3개, 각각 근거와 확신도
**추가 확인 권장** — 원인을 확정하려면 필요한 분석·자료
마지막 줄에 원인 판단을 좁히기 위해 분석자에게 묻고 싶은 질문 1개를 남기세요.`,
      micro: `질문을 받기 전에, 먼저 이 미세조직에 대한 당신의 의견을 제시하세요. 아래 순서로 씁니다.
**종합 의견** (2~3줄)
**조직 특징** — 결정립 형태·크기 분포, 제2상·석출물·기공·개재물
**측정값 해석** — 결정립도·상분율·면적률이 있으면 그 의미와 신뢰도
**공정 · 열처리와의 연관** — 입력된 조건으로 설명되는 점과 이상 징후
**특성 영향** — 강도·인성·피로에 미칠 영향
**추가 확인 권장**
마지막 줄에 해석을 좁히기 위해 분석자에게 묻고 싶은 질문 1개를 남기세요.`,
      tests: `질문을 받기 전에, 먼저 이 시험 결과에 대한 당신의 의견을 제시하세요. 아래 순서로 씁니다.
**종합 의견** (2~3줄)
**조건별 결과 해석** — 평균·편차의 의미
**목표 대비 평가** — 미달·이탈 항목과 그 정도
**차이의 원인 추정** — 가능성 높은 순 2~3개, 확신도
**개선 방향 · 추가 시험 권장**
마지막 줄에 해석을 좁히기 위해 분석자에게 묻고 싶은 질문 1개를 남기세요.`
    };
    const chatState = { busy: null, auto: new Set() };

    function chatRecord(kind) {
      return kind === 'tests' ? activeMaterial() : moduleRec(kind);
    }

    function chatReady(kind, rec) {
      if (!rec) return false;
      return kind === 'tests' ? rec.rows.length > 0 && matNumericCols(rec).length > 0 : rec.images.length > 0;
    }

    function chatContextText(kind, rec) {
      if (kind === 'fracto') return fractoText(rec);
      if (kind === 'micro') return microText(rec);
      const rep = matBuildReport(rec).text;
      const lim = 80;
      const data = [rec.columns, ...rec.rows.slice(0, lim)].map(r => r.join('\t')).join('\n');
      const specs = Object.entries(rec.specs).map(([k, v]) => `${k}: ${matSpecLabel(v, '')}`).join(', ');
      return `${rep}\n\n[목표 규격] ${specs || '미입력'}\n\n[원시 데이터${rec.rows.length > lim ? ` 앞 ${lim}행 / 전체 ${rec.rows.length}행` : ''}]\n${data}`;
    }

    async function chatImageParts(rec) {
      const parts = [];
      for (const [i, im] of rec.images.slice(0, 3).entries()) {
        try {
          const c = await renderAnnotatedCanvas(im, 1400);
          if (!c) continue;
          const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
          parts.push({ text: `[이미지 ${i + 1}: ${im.name} · ${im.w}×${im.h}px · ${im.calib ? `1 ${im.calib.unit} = ${fmtSig(im.calib.pxPerUnit)} px` : '스케일 미보정'}]` });
          parts.push(await blobPart(blob, 'image/jpeg'));
        } catch (e) {
          console.warn('AI용 이미지 준비 실패', e);
        }
      }
      if (rec.images.length > 3) parts.push({ text: `(이미지는 총 ${rec.images.length}장이며 앞 3장만 첨부함)` });
      return parts;
    }

    function buildChatContents(kind, rec, ctxText, imgParts) {
      const msgs = rec.chat.filter(m => m.role === 'ai' || m.role === 'user');
      const first = [{ text: `[분석 정보 — 현재 입력값]\n${ctxText}` }, ...imgParts];
      const contents = [];
      let i = 0;
      if (msgs.length && msgs[0].role === 'user') {
        first.push({ text: msgs[0].text });
        i = 1;
      } else {
        first.push({ text: CHAT_FIRST[kind] });
      }
      contents.push({ role: 'user', parts: first });
      for (; i < msgs.length; i++) {
        const role = msgs[i].role === 'ai' ? 'model' : 'user';
        const last = contents[contents.length - 1];
        if (last.role === role) last.parts.push({ text: msgs[i].text });
        else contents.push({ role, parts: [{ text: msgs[i].text }] });
      }
      return contents;
    }

    async function chatSend(kind, question) {
      const rec = chatRecord(kind);
      if (!rec || chatState.busy) return;
      if (!getAiKey()) {
        showToast('설정에서 Gemini API 키를 먼저 저장해 주세요.');
        return;
      }
      if (question !== null && question !== undefined) {
        const q = String(question).trim();
        if (!q) return;
        rec.chat.push({ role: 'user', text: q, ts: Date.now() });
      }
      chatState.busy = rec.id;
      touch(rec);
      saveData();
      render();
      scrollChat();
      try {
        const ctx = chatContextText(kind, rec);
        const imgs = kind === 'tests' ? [] : await chatImageParts(rec);
        const out = await callGeminiContents(buildChatContents(kind, rec, ctx, imgs), { system: CHAT_SYSTEM });
        rec.chat.push({ role: 'ai', text: out.text, ts: Date.now(), model: out.model });
      } catch (err) {
        rec.chat.push({ role: 'err', text: 'AI 응답 실패: ' + (err.message || err), ts: Date.now() });
      } finally {
        chatState.busy = null;
        touch(rec);
        saveData();
        if (chatRecord(kind) === rec && view === kind) {
          render();
          scrollChat();
        }
      }
    }

    function chatAsk(kind) {
      const ta = document.getElementById('chatInput');
      if (!ta) return;
      const q = ta.value;
      ta.value = '';
      chatSend(kind, q);
    }

    function chatQuick(kind, idx) {
      chatSend(kind, CHAT_QUICK[kind][idx]);
    }

    function chatRefresh(kind) {
      const rec = chatRecord(kind);
      if (!rec) return;
      if (!rec.chat.length) chatSend(kind, null);
      else chatSend(kind, '지금까지의 대화와 현재 입력값(측정·주석·소견)을 반영해서 의견을 다시 정리해 주세요. 처음 의견과 달라진 점이 있으면 표시해 주세요.');
    }

    function chatClear(kind) {
      const rec = chatRecord(kind);
      if (!rec || !rec.chat.length) return;
      askConfirm('이 기록의 AI 상담 내용을 모두 지우시겠습니까?', () => {
        rec.chat = [];
        chatState.auto.add(rec.id);
        touch(rec);
        saveData();
        render();
      }, { okLabel: '지우기', danger: true });
    }

    function chatToNote(kind, idx) {
      const rec = chatRecord(kind);
      const msg = rec && rec.chat[idx];
      if (!msg) return;
      const clean = msg.text.replace(/\*\*/g, '').replace(/^#+\s*/gm, '').trim();
      if (kind === 'tests') {
        rec.memo = (rec.memo.trim() ? rec.memo.trim() + '\n' : '') + clean;
        touchMaterial(rec);
      } else {
        rec.observation = (rec.observation.trim() ? rec.observation.trim() + '\n' : '') + clean;
        touch(rec);
      }
      saveData();
      render();
      showToast(kind === 'tests' ? 'AI 답변을 시험 메모에 넣었습니다. 보고서 비고로 나갑니다.' : 'AI 답변을 관찰 소견에 넣었습니다. 사실과 다른 부분은 고쳐 주세요.');
    }

    function chatCopy(kind, idx) {
      const rec = chatRecord(kind);
      const msg = rec && rec.chat[idx];
      if (msg) copyText(msg.text.replace(/\*\*/g, '')).then(ok => showToast(ok ? '답변을 복사했습니다.' : '복사에 실패했습니다.'));
    }

    function scrollChat() {
      const log = document.getElementById('chatLog');
      if (log) log.scrollTop = log.scrollHeight;
    }

    function chatMd(text) {
      return escapeHtml(text)
        .replace(/^#{1,4}\s*(.+)$/gm, '<b>$1</b>')
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/^\s*\*\s+/gm, '- ')
        .replace(/\[관찰\]/g, '<span class="tg obs">관찰</span>')
        .replace(/\[추정\]/g, '<span class="tg est">추정</span>');
    }

    function chatPanelHtml(kind, rec, opts) {
      const o = opts || {};
      const hasKey = !!getAiKey();
      const ready = chatReady(kind, rec);
      const busy = chatState.busy === rec.id;
      const what = { fracto: '파단면 이미지를 올리면', micro: '미세조직 이미지를 올리면', tests: '시험 데이터를 넣으면' }[kind];
      let body;
      if (!hasKey) {
        body = `<div class="empty">AI 상담은 Gemini API 키가 필요합니다.<br>키를 저장하면 ${what} AI가 먼저 의견을 드리고, 이어서 질문할 수 있습니다.<br><br><button class="btn primary sm" onclick="go('settings')"><i class="fa-solid fa-gear"></i> AI 설정</button></div>`;
      } else if (!ready && !rec.chat.length) {
        body = `<div class="empty">${what} AI가 먼저 ${kind === 'fracto' ? '파손 원인에 대한' : '해석'} 의견을 드립니다.</div>`;
      } else {
        const msgs = rec.chat.map((m, i) => {
          if (m.role === 'user') return `<div class="msg user"><div class="msg-text">${escapeHtml(m.text)}</div></div>`;
          if (m.role === 'err') return `<div class="msg err"><i class="fa-solid fa-circle-exclamation"></i> ${escapeHtml(m.text)}</div>`;
          return `<div class="msg ai"><div class="msg-who"><span class="ai-dot">AI</span>${i === 0 ? '먼저 드리는 의견' : '답변'}</div><div class="msg-text">${chatMd(m.text)}</div>` +
            `<div class="msg-meta"><span title="${escapeHtml(m.model || '')}">${fmtDate(m.ts)}</span><span class="spacer"></span>` +
            `<button onclick="chatToNote('${kind}', ${i})"><i class="fa-solid fa-arrow-down"></i> ${kind === 'tests' ? '메모에' : '소견에'} 넣기</button>` +
            `<button onclick="chatCopy('${kind}', ${i})"><i class="fa-regular fa-copy"></i> 복사</button></div></div>`;
        }).join('');
        body = `
          <div class="chat-log" id="chatLog" style="${o.maxH ? `max-height:${o.maxH};` : ''}">
            ${msgs || ''}
            ${busy ? `<div class="msg ai"><div class="msg-who"><span class="ai-dot">AI</span>${rec.chat.length ? '답변 작성 중' : '이미지와 입력값을 보고 의견을 정리하는 중'}</div><div class="thinking"><span></span><span></span><span></span></div></div>` : ''}
          </div>
          <div class="quick">${CHAT_QUICK[kind].map((q, i) => `<button onclick="chatQuick('${kind}', ${i})" ${busy ? 'disabled' : ''}>${q}</button>`).join('')}</div>
          <div class="chat-input">
            <textarea class="textarea" id="chatInput" rows="2" placeholder="AI에게 질문하기 (Enter 전송 · Shift+Enter 줄바꿈)" onkeydown="if(event.key==='Enter' && !event.shiftKey && !event.isComposing){event.preventDefault(); chatAsk('${kind}');}" ${busy ? 'disabled' : ''}></textarea>
            <button class="btn primary" onclick="chatAsk('${kind}')" ${busy ? 'disabled' : ''} title="보내기"><i class="fa-solid fa-paper-plane"></i></button>
          </div>`;
      }
      return `
        <section class="panel chat">
          <div class="panel-head">
            <h2><i class="fa-solid fa-comments"></i> AI 상담 ${rec.chat.length ? `<span class="mono">${rec.chat.filter(m => m.role !== 'err').length}</span>` : ''}</h2>
            <div class="row" style="gap:2px;">
              ${hasKey && ready ? `<button class="btn sm ghost" onclick="chatRefresh('${kind}')" ${busy ? 'disabled' : ''} title="현재 입력값으로 의견 다시 받기"><i class="fa-solid fa-rotate"></i> ${rec.chat.length ? '다시 정리' : '의견 받기'}</button>` : ''}
              ${rec.chat.length ? `<button class="btn sm ghost" onclick="chatClear('${kind}')" title="대화 지우기"><i class="fa-regular fa-trash-can"></i></button>` : ''}
            </div>
          </div>
          <div class="panel-body" style="display:flex; flex-direction:column; gap:10px;">
            ${body}
            ${hasKey ? `<p class="hint" style="font-size:10.5px;">AI 의견은 참고용입니다. 이미지·측정값·입력 정보를 함께 보내며, 결론은 직접 확인 후 사용하세요.</p>` : ''}
          </div>
        </section>`;
    }

    // 상담 화면이 열려 있고 대화가 없으면 AI가 먼저 의견을 낸다 (기록당 1회 자동)
    function maybeAutoChat(kind) {
      const rec = chatRecord(kind);
      if (!rec || rec.chat.length || chatState.busy || !getAiKey() || !chatReady(kind, rec)) return;
      const visible = kind === 'tests' ? matTab === 'ai' : sideTab(kind) === 'ai';
      if (!visible || chatState.auto.has(rec.id)) return;
      chatState.auto.add(rec.id);
      setTimeout(() => chatSend(kind, null), 30);
    }

    // ================= 12. REPORT BUILDER =================
    // Report: { id, title, docNo, date, author, org, purpose, sampleInfo, conclusion,
    //           include: { tests: [], fracto: [], micro: [] }, opts: { charts, images, maxImages }, createdAt, updatedAt }
    const HANGUL_SEQ = ['가', '나', '다', '라', '마', '바', '사', '아', '자', '차', '카', '타', '파', '하'];

    function normalizeReport(r) {
      return {
        title: '시험 · 분석 결과 보고서',
        docNo: '',
        date: toDateStr(new Date()),
        author: '',
        org: '',
        purpose: '',
        sampleInfo: '',
        conclusion: '',
        createdAt: Date.now(),
        updatedAt: Date.now(),
        ...r,
        id: r.id || genId('rpt'),
        include: { tests: [], fracto: [], micro: [], ...(r.include || {}) },
        opts: { charts: true, images: true, maxImages: 4, ...(r.opts || {}) }
      };
    }

    function activeReport() {
      return DB.reports.find(r => r.id === active.report) || null;
    }

    function createReport(preset) {
      const r = normalizeReport({ author: settings.author, org: settings.org, ...(preset || {}) });
      DB.reports.unshift(r);
      active.report = r.id;
      saveData();
      return r;
    }

    async function addToReport(kind, id) {
      let target;
      if (!DB.reports.length) {
        target = createReport();
      } else {
        const sorted = [...DB.reports].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        const out = await askForm('보고서에 넣기', [
          { id: 'rid', label: '넣을 보고서', type: 'select', value: sorted[0].id, options: [...sorted.map(r => [r.id, r.title]), ['__new', '+ 새 보고서 만들기']] }
        ], '넣기');
        if (!out) return;
        target = out.rid === '__new' ? createReport() : DB.reports.find(r => r.id === out.rid);
      }
      if (!target.include[kind].includes(id)) target.include[kind].push(id);
      touch(target);
      saveData();
      showToast(`'${target.title}'에 넣었습니다. 보고서 메뉴에서 미리보기·인쇄할 수 있습니다.`);
    }

    function renderReport() {
      const main = document.getElementById('main');
      if (active.report && !DB.reports.some(r => r.id === active.report)) active.report = null;
      if (!active.report && DB.reports.length) active.report = [...DB.reports].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0].id;
      const r = activeReport();
      const list = recordListHtml('report', DB.reports.map(x => ({ ...x, name: x.title })),
        x => `${x.date || ''} · 포함 ${x.include.tests.length + x.include.fracto.length + x.include.micro.length}건`,
        `<button class="btn sm primary" onclick="createReport(); render();"><i class="fa-solid fa-plus"></i> 새로</button>`);
      if (!r) {
        main.innerHTML = `<div class="bench">${list}<section class="panel"><div class="panel-body"><div class="empty" style="padding:44px 20px;">
          <i class="fa-solid fa-file-lines" style="font-size:26px; color:var(--accent); margin-bottom:10px; display:block;"></i>
          <strong style="color:var(--ink); font-size:14px;">시험·분석 기록을 묶어 보고서를 만드세요</strong><br>
          시험 데이터, 파단면, 미세조직 기록을 골라 넣으면 개조식 본문·결과표·차트·주석 이미지가 들어간 보고서가 만들어집니다.<br>시험성적서 파일(엑셀·CSV·PDF)을 바로 올려 표로 넣을 수도 있습니다.<br><br>
          <button class="btn primary" onclick="createReport(); render();"><i class="fa-solid fa-plus"></i> 새 보고서</button>
          <div style="max-width:420px; margin:14px auto 0;">${dropZoneHtml('report')}</div>
          ${importPreviewHtml('report') ? `<div style="text-align:left; margin-top:12px;">${importPreviewHtml('report')}</div>` : ''}
        </div></div></section></div>`;
        return;
      }
      const pick = (kind, arr, sub) => `
        <div class="sec-title">${{ tests: '시험 데이터', fracto: '파단면', micro: '미세조직' }[kind]} <span class="mono">${r.include[kind].length}/${arr.length}</span></div>
        ${arr.length === 0 ? '<p class="hint" style="margin-bottom:10px;">기록 없음</p>' : `<div style="display:flex; flex-direction:column; gap:2px; margin-bottom:12px;">${arr.map(x => `
          <label class="row" style="gap:8px; cursor:pointer; padding:4px 2px; flex-wrap:nowrap;">
            <input type="checkbox" ${r.include[kind].includes(x.id) ? 'checked' : ''} onchange="toggleInclude('${kind}', '${x.id}', this.checked)" style="accent-color:var(--accent);">
            <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(x.name)}</span>
            <span class="hint mono" style="font-size:10.5px;">${escapeHtml(sub(x))}</span>
          </label>`).join('')}</div>`}`;
      main.innerHTML = `
        <div class="bench" style="grid-template-columns: 220px minmax(0, 1fr);">
          ${list}
          <div style="display:grid; grid-template-columns: 340px minmax(0, 1fr); gap:16px; align-items:start;" class="rep-grid">
            <section class="panel no-print" style="position:sticky; top:72px; max-height:calc(100vh - 94px); overflow-y:auto;">
              <div class="panel-head"><h2><i class="fa-solid fa-pen-to-square"></i> 보고서 구성</h2>
                <button class="btn sm danger" onclick="deleteReport('${r.id}')" title="보고서 삭제"><i class="fa-regular fa-trash-can"></i></button>
              </div>
              <div class="panel-body" style="display:flex; flex-direction:column; gap:10px;">
                ${dropZoneHtml('report')}
                <div class="field"><label>제목</label><input class="input" style="font-weight:700;" value="${escapeHtml(r.title)}" onchange="updateReportField('title', this.value)"></div>
                <div class="grid-2">
                  <div class="field"><label>문서 번호</label><input class="input mono" value="${escapeHtml(r.docNo)}" placeholder="선택" onchange="updateReportField('docNo', this.value)"></div>
                  <div class="field"><label>작성일</label><input class="input mono" type="date" value="${escapeHtml(r.date)}" onchange="updateReportField('date', this.value)"></div>
                  <div class="field"><label>작성자</label><input class="input" value="${escapeHtml(r.author)}" onchange="updateReportField('author', this.value)"></div>
                  <div class="field"><label>소속</label><input class="input" value="${escapeHtml(r.org)}" onchange="updateReportField('org', this.value)"></div>
                </div>
                <div class="field"><label>1. 목적</label><textarea class="textarea" rows="3" placeholder="- 시험·분석 목적을 개조식으로" onchange="updateReportField('purpose', this.value)">${escapeHtml(r.purpose)}</textarea></div>
                <div class="field"><label>시료 · 시험 개요 (선택)</label><textarea class="textarea" rows="2" placeholder="- 비우면 넣은 기록 목록으로 자동 작성" onchange="updateReportField('sampleInfo', this.value)">${escapeHtml(r.sampleInfo)}</textarea></div>
                <div style="border-top:1px solid var(--line-2); padding-top:10px;">
                  ${pick('tests', DB.tests, x => `${x.rows.length}행`)}
                  ${pick('fracto', DB.fracto, x => x.fields.mode || '판정 전')}
                  ${pick('micro', DB.micro, x => `${x.images.length}장`)}
                </div>
                <div class="field"><label>결론</label><textarea class="textarea" rows="4" placeholder="- 종합 결론과 후속 조치를 개조식으로" onchange="updateReportField('conclusion', this.value)">${escapeHtml(r.conclusion)}</textarea></div>
                <div class="row" style="gap:12px;">
                  <label class="row hint" style="gap:5px; cursor:pointer;"><input type="checkbox" ${r.opts.charts ? 'checked' : ''} onchange="updateReportOpt('charts', this.checked)" style="accent-color:var(--accent);"> 차트</label>
                  <label class="row hint" style="gap:5px; cursor:pointer;"><input type="checkbox" ${r.opts.images ? 'checked' : ''} onchange="updateReportOpt('images', this.checked)" style="accent-color:var(--accent);"> 이미지</label>
                  <label class="row hint" style="gap:5px;">기록당 최대
                    <select class="select" style="width:auto; padding:3px 6px;" onchange="updateReportOpt('maxImages', Number(this.value))">${[2, 4, 6, 8].map(n => `<option value="${n}" ${r.opts.maxImages === n ? 'selected' : ''}>${n}장</option>`).join('')}</select>
                  </label>
                </div>
              </div>
            </section>
            <section style="min-width:0;">
              <div class="row no-print" style="margin-bottom:10px;">
                <button class="btn primary" onclick="printReport()"><i class="fa-solid fa-print"></i> 인쇄 · PDF 저장</button>
                <button class="btn" onclick="copyReportText()"><i class="fa-regular fa-copy"></i> 본문 복사 (개조식)</button>
                <button class="btn" onclick="saveReportHtml()"><i class="fa-solid fa-code"></i> HTML 저장</button>
                <span class="spacer"></span>
                <span class="hint">A4 미리보기 · 인쇄 창에서 'PDF로 저장' 선택</span>
              </div>
              ${importPreviewHtml('report')}
              <div class="paper-wrap"><article class="paper" id="paper"><p class="hint" style="text-align:center;">보고서를 만드는 중...</p></article></div>
            </section>
          </div>
        </div>`;
      buildPaper(r).then(html => {
        const p = document.getElementById('paper');
        if (p && active.report === r.id) p.innerHTML = html;
      });
    }

    function deleteReport(id) {
      const r = DB.reports.find(x => x.id === id);
      if (!r) return;
      askConfirm(`'${r.title}' 보고서를 삭제하시겠습니까? (넣은 분석 기록은 지워지지 않습니다)`, () => {
        DB.reports = DB.reports.filter(x => x.id !== id);
        active.report = null;
        saveData();
        render();
      }, { okLabel: '삭제', danger: true });
    }

    function updateReportField(k, v) {
      const r = activeReport();
      if (!r) return;
      r[k] = typeof v === 'string' && k !== 'purpose' && k !== 'conclusion' && k !== 'sampleInfo' ? v.trim() : v;
      if (k === 'title' && !r.title) r.title = '시험 · 분석 결과 보고서';
      touch(r);
      saveData();
      render();
    }

    function updateReportOpt(k, v) {
      const r = activeReport();
      if (!r) return;
      r.opts[k] = v;
      touch(r);
      saveData();
      render();
    }

    function toggleInclude(kind, id, on) {
      const r = activeReport();
      if (!r) return;
      r.include[kind] = on ? [...new Set([...r.include[kind], id])] : r.include[kind].filter(x => x !== id);
      touch(r);
      saveData();
      render();
    }

    function reportItems(r) {
      return {
        tests: r.include.tests.map(id => DB.tests.find(x => x.id === id)).filter(Boolean),
        fracto: r.include.fracto.map(id => DB.fracto.find(x => x.id === id)).filter(Boolean),
        micro: r.include.micro.map(id => DB.micro.find(x => x.id === id)).filter(Boolean)
      };
    }

    function paperBullets(text) {
      const lines = String(text || '').split('\n').filter(x => x.trim());
      return lines.map(x => {
        const t = x.replace(/\s+$/, '');
        const indent = (t.match(/^\s*/)[0].length >= 4) ? 2 : (/^\s*-/.test(t) ? 1 : (/^\s*•/.test(t) ? 0 : 1));
        const body = t.trim().replace(/^[-•·]\s*/, '');
        const mark = indent === 0 ? '•' : indent === 1 ? '-' : '·';
        return `<div style="padding-left:${indent * 14}px; text-indent:-10px; margin-left:10px;">${mark} ${escapeHtml(body)}</div>`;
      }).join('');
    }

    // 보고서용 결과표: 항목마다 '평균 ± 표준편차' 한 칸 + 판정 (A4 폭에 맞춤)
    function paperTestTable(m, rep, no) {
      const cap = `<caption style="caption-side:top; text-align:left; font-size:11px; color:#4b5563; padding-bottom:4px;">표 ${no}. ${escapeHtml(m.name)} 결과${matGroups(m).length > 1 ? ' (평균 ± 표준편차)' : ''}</caption>`;
      const isFatigue = m.testType === 'fatigue';
      const cols = matNumericCols(m).map(ci => m.columns[ci]).filter(c => !isFatigue || (c !== m.fatigue.stressCol && c !== m.fatigue.cyclesCol));
      if (isFatigue && !cols.length) {
        return `<table>${cap}<thead><tr>${rep.table[0].map(x => `<th>${escapeHtml(x)}</th>`).join('')}</tr></thead><tbody>${rep.table.slice(1).map(row => `<tr>${row.map(v => `<td>${escapeHtml(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      }
      const groups = matGroups(m);
      const head = `<tr><th>${groups.length > 1 ? '조건' : '구분'}</th><th>n</th>${cols.map(c => {
        const u = matUnit(c);
        const sp = matSpecRange(m.specs[c]).has ? `<small>목표 ${escapeHtml(matSpecLabel(m.specs[c], ''))}</small>` : '';
        return `<th>${escapeHtml(matBase(c))}${u ? ` (${escapeHtml(u)})` : ''}${sp}</th>`;
      }).join('')}</tr>`;
      const body = groups.map(g => `<tr><td>${escapeHtml(g.name)}</td><td>${g.rows.length}</td>${cols.map(c => {
        const ci = m.columns.indexOf(c);
        const st = matStats(g.rows.map(r => matNum(r[ci])));
        if (!st.n) return '<td>-</td>';
        const j = matJudge(m.specs[c], st);
        const jl = j ? `<small class="${j.level === 'pass' ? '' : 'bad'}">${{ pass: '충족', partial: `일부 이탈 ${j.fails}`, fail: '미달' }[j.level]}</small>` : '';
        return `<td>${matFmt(st.mean)}${st.n > 1 ? ' ± ' + matFmt(st.sd, st.mean) : ''}${jl}</td>`;
      }).join('')}</tr>`).join('');
      return `<table>${cap}<thead>${head}</thead><tbody>${body}</tbody></table>`;
    }

    function testBodyText(m) {
      // 첫 줄(제목)을 뺀 개조식 본문
      return matBuildReport(m).text.split('\n').slice(1).join('\n');
    }

    async function buildPaper(r) {
      const it = reportItems(r);
      let fig = 0, tbl = 0, sec = 1;
      const h = [];
      h.push(`<h1>${escapeHtml(r.title)}</h1>`);
      h.push(`<div class="p-sub">${[r.docNo, r.date, [r.org, r.author].filter(Boolean).join(' ')].filter(Boolean).map(escapeHtml).join(' · ')}</div>`);

      h.push(`<h2>${sec++}. 개요</h2>`);
      if (r.purpose.trim()) {
        h.push('<h3>가. 목적</h3>');
        h.push(`<div class="bul">${paperBullets(r.purpose)}</div>`);
      }
      h.push(`<h3>${r.purpose.trim() ? '나. ' : ''}시료 및 시험 항목</h3>`);
      if (r.sampleInfo.trim()) h.push(`<div class="bul">${paperBullets(r.sampleInfo)}</div>`);
      else {
        const auto = [];
        it.tests.forEach(m => auto.push(`${(MAT_TEST_TYPES[m.testType] || MAT_TEST_TYPES.custom).label}: ${m.name}${m.alloy ? ` (${m.alloy})` : ''}${m.standard ? ` — ${m.standard}` : ''}, 시편 ${m.rows.length}개`));
        it.fracto.forEach(x => auto.push(`파단면 분석: ${x.name}${x.fields.sample ? ` (${x.fields.sample})` : ''}${x.fields.equipment ? ` — ${x.fields.equipment}` : ''}`));
        it.micro.forEach(x => auto.push(`미세조직 분석: ${x.name}${x.fields.sample ? ` (${x.fields.sample})` : ''}${x.fields.equipment ? ` — ${x.fields.equipment}` : ''}`));
        h.push(auto.length ? `<div class="bul">${paperBullets(auto.map(a => '- ' + a).join('\n'))}</div>` : `<p class="no-print hint">왼쪽에서 보고서에 넣을 기록을 고르세요.</p>`);
      }

      if (it.tests.length) {
        h.push(`<h2>${sec++}. 시험 결과</h2>`);
        it.tests.forEach((m, i) => {
          h.push(`<h3>${HANGUL_SEQ[i % HANGUL_SEQ.length]}. ${escapeHtml(m.name)}</h3>`);
          if (!m.rows.length || !matNumericCols(m).length) {
            h.push('<p>데이터 없음</p>');
            return;
          }
          const rep = matBuildReport(m);
          h.push(`<div class="bul">${paperBullets(testBodyText(m))}</div>`);
          tbl++;
          h.push(paperTestTable(m, rep, tbl));
          if (r.opts.charts) {
            if (m.testType === 'fatigue' && matFatiguePoints(m)) {
              fig++;
              h.push(`<figure>${matSNChartSvg(m, `rp_sn_${m.id}`)}<figcaption>그림 ${fig}. ${escapeHtml(m.name)} S-N 선도</figcaption></figure>`);
            }
            const nums = matNumericCols(m).map(ci => m.columns[ci]).filter(c => m.testType !== 'fatigue' || (c !== m.fatigue.stressCol && c !== m.fatigue.cyclesCol));
            const chartCols = (nums.filter(c => matSpecRange(m.specs[c]).has).length ? nums.filter(c => matSpecRange(m.specs[c]).has) : nums.slice(0, 1)).slice(0, 2);
            if (matGroups(m).length > 1 || chartCols.length) {
              const charts = chartCols.map((c, k) => {
                fig++;
                return `<figure>${matBarChartSvg(m, c, `rp_bar_${m.id}_${k}`)}<figcaption>그림 ${fig}. ${escapeHtml(matBase(c))} 조건별 평균 (±1σ, 점선: 목표)</figcaption></figure>`;
              });
              h.push(charts.length === 2 ? `<div class="fig-row">${charts.join('')}</div>` : charts.join(''));
            }
          }
        });
      }

      const imgSection = async (arr, title, textFn) => {
        if (!arr.length) return;
        h.push(`<h2>${sec++}. ${title}</h2>`);
        for (let i = 0; i < arr.length; i++) {
          const x = arr[i];
          h.push(`<h3>${HANGUL_SEQ[i % HANGUL_SEQ.length]}. ${escapeHtml(x.name)}</h3>`);
          h.push(`<div class="bul">${paperBullets(textFn(x, false))}</div>`);
          if (r.opts.images && x.images.length) {
            const figs = [];
            for (const im of x.images.slice(0, r.opts.maxImages)) {
              try {
                const c = await renderAnnotatedCanvas(im, 1400);
                if (!c) continue;
                fig++;
                figs.push(`<figure><img src="${c.toDataURL('image/jpeg', 0.9)}" alt=""><figcaption>그림 ${fig}. ${escapeHtml(x.name)} — ${escapeHtml(im.name)}</figcaption></figure>`);
              } catch (e) {
                console.warn('보고서 이미지 생성 실패', e);
              }
            }
            if (figs.length) h.push(figs.length > 1 ? `<div class="fig-row">${figs.join('')}</div>` : figs.join(''));
            if (x.images.length > r.opts.maxImages) h.push(`<p class="no-print hint">이미지 ${x.images.length - r.opts.maxImages}장은 '기록당 최대' 설정으로 제외됨</p>`);
          }
        }
      };
      await imgSection(it.fracto, '파단면 분석', fractoText);
      await imgSection(it.micro, '미세조직 분석', microText);

      h.push(`<h2>${sec++}. 결론</h2>`);
      h.push(r.conclusion.trim() ? `<div class="bul">${paperBullets(r.conclusion)}</div>` : `<p class="no-print hint">왼쪽 '결론' 칸에 종합 결론을 입력하세요.</p>`);
      h.push(`<div class="note">※ 목표 대비 판정은 입력한 목표값과의 단순 비교이며, 공식 판정은 시험성적서와 해당 규격 절차를 따름. 이미지 측정값은 스케일 보정 정확도에 따라 달라질 수 있음.</div>`);
      return h.join('\n');
    }

    function reportPlainText(r) {
      const it = reportItems(r);
      const L = [];
      L.push(r.title);
      L.push([r.docNo, r.date, [r.org, r.author].filter(Boolean).join(' ')].filter(Boolean).join(' · '));
      L.push('');
      let sec = 1;
      L.push(`${sec++}. 개요`);
      if (r.purpose.trim()) {
        L.push('• 목적');
        bulletLines(r.purpose).forEach(x => L.push(x));
      }
      L.push('• 시료 및 시험 항목');
      if (r.sampleInfo.trim()) bulletLines(r.sampleInfo).forEach(x => L.push(x));
      else {
        it.tests.forEach(m => L.push(`  - ${(MAT_TEST_TYPES[m.testType] || MAT_TEST_TYPES.custom).label}: ${m.name}, 시편 ${m.rows.length}개`));
        it.fracto.forEach(x => L.push(`  - 파단면 분석: ${x.name}`));
        it.micro.forEach(x => L.push(`  - 미세조직 분석: ${x.name}`));
      }
      if (it.tests.length) {
        L.push('', `${sec++}. 시험 결과`);
        it.tests.forEach(m => {
          L.push(`[${m.name}]`);
          L.push(testBodyText(m));
        });
      }
      if (it.fracto.length) {
        L.push('', `${sec++}. 파단면 분석`);
        it.fracto.forEach(x => { L.push(`[${x.name}]`); L.push(fractoText(x, false)); });
      }
      if (it.micro.length) {
        L.push('', `${sec++}. 미세조직 분석`);
        it.micro.forEach(x => { L.push(`[${x.name}]`); L.push(microText(x, false)); });
      }
      L.push('', `${sec++}. 결론`);
      if (r.conclusion.trim()) bulletLines(r.conclusion).forEach(x => L.push(x));
      return L.join('\n');
    }

    function copyReportText() {
      const r = activeReport();
      if (!r) return;
      copyText(reportPlainText(r)).then(ok => showToast(ok ? '보고서 본문을 개조식 텍스트로 복사했습니다. 한글·워드에 붙여넣으세요.' : '복사에 실패했습니다.'));
    }

    function printReport() {
      const p = document.getElementById('paper');
      if (!p || /보고서를 만드는 중/.test(p.textContent)) {
        showToast('미리보기를 만드는 중입니다. 잠시 후 다시 눌러 주세요.');
        return;
      }
      window.print();
    }

    function saveReportHtml() {
      const r = activeReport();
      const p = document.getElementById('paper');
      if (!r || !p) return;
      const css = [...document.styleSheets].map(ss => {
        try { return [...ss.cssRules].map(x => x.cssText).filter(t => t.includes('.paper')).join('\n'); } catch (e) { return ''; }
      }).join('\n');
      const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>${escapeHtml(r.title)}</title>
<style>body{margin:0;background:#e5e8ec;font-family:'Malgun Gothic',sans-serif;} .paper{margin:24px auto;} .no-print{display:none;} @media print{body{background:#fff;} .paper{margin:0;box-shadow:none;padding:0;}} :root{--mono:Consolas,monospace;}
${css}</style></head><body><article class="paper">${p.innerHTML}</article></body></html>`;
      downloadBlob(new Blob([html], { type: 'text/html;charset=utf-8' }), safeFileName(`${r.title}_${r.date}.html`));
      showToast('보고서를 HTML 파일로 저장했습니다. 브라우저로 열어 인쇄하거나 워드에서 열 수 있습니다.');
    }
  </script>
</body></html>
