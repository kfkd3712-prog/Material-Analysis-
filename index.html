<!DOCTYPE html>
<!-- Material Analysis Studio v1.1 · 2026-11-20 · 시험성적서 파일→표 읽기(엑셀·CSV·PDF), AI 상담(먼저 의견 + 질문·답변) -->
<html lang="ko"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Analysis Studio · 소재 분석</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ================= TOKENS ================= */
    :root {
      --rail: #0f141a;
      --rail-ink: #94a3b8;
      --bg: #f2f4f6;
      --panel: #ffffff;
      --panel-2: #f8fafb;
      --line: #e3e7ec;
      --line-2: #eef1f4;
      --ink: #0f172a;
      --ink-2: #334155;
      --muted: #64748b;
      --faint: #94a3b8;
      --accent: #0e7490;
      --accent-2: #0891b2;
      --accent-soft: #ecfeff;
      --accent-line: #a5e4f0;
      --pass: #15803d; --pass-bg: #dcfce7;
      --warn: #b45309; --warn-bg: #fef3c7;
      --fail: #b91c1c; --fail-bg: #fee2e2;
      --viewer: #0b0f14;
      --font: 'Pretendard', 'Pretendard Variable', 'Malgun Gothic', '맑은 고딕', -apple-system, sans-serif;
      --mono: 'IBM Plex Mono', 'Consolas', 'D2Coding', monospace;
      --r: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 13px; display: flex; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ================= RAIL ================= */
    .rail { width: 76px; background: var(--rail); display: flex; flex-direction: column; align-items: stretch; padding: 12px 8px; gap: 4px; flex-shrink: 0; height: 100vh; position: sticky; top: 0; z-index: 40; }
    .rail-logo { height: 40px; margin: 0 6px 14px; border-radius: 8px; background: linear-gradient(135deg, #0e7490, #155e75); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: 0.04em; cursor: pointer; }
    .rail-btn { background: none; border: none; color: var(--rail-ink); border-radius: 8px; padding: 9px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; font-size: 10.5px; font-weight: 600; transition: background 0.15s, color 0.15s; position: relative; }
    .rail-btn i { font-size: 16px; }
    .rail-btn:hover { background: #1b232d; color: #e2e8f0; }
    .rail-btn.active { background: #1e2a36; color: #ffffff; }
    .rail-btn.active::before { content: ''; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: #22d3ee; }
    .rail-sep { flex: 1; }

    /* ================= TOPBAR ================= */
    .app { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
    .topbar { height: 50px; flex-shrink: 0; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; position: sticky; top: 0; z-index: 30; }
    .crumb { display: flex; align-items: center; gap: 10px; font-size: 13px; min-width: 0; }
    .crumb .eyebrow { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; white-space: nowrap; }
    .crumb .sep { color: var(--line); }
    .crumb strong { font-weight: 700; white-space: nowrap; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .chip { font-family: var(--mono); font-size: 11px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel-2); white-space: nowrap; cursor: pointer; }
    .chip.warn { color: var(--warn); background: var(--warn-bg); border-color: #fde68a; }
    .menu-btn { display: none; }

    main#main { padding: 22px; flex: 1; min-width: 0; }

    /* ================= COMMON ================= */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 0.12s, border-color 0.12s; color: var(--ink-2); }
    .btn:hover { background: var(--panel-2); border-color: #cfd6de; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #155e75; }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.ghost:hover { background: var(--line-2); }
    .btn.sm { padding: 5px 9px; font-size: 11.5px; }
    .btn.danger { color: var(--fail); }
    .btn.danger:hover { background: var(--fail-bg); border-color: #fecaca; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .icon-btn { background: none; border: none; color: var(--faint); cursor: pointer; padding: 4px 6px; border-radius: 4px; }
    .icon-btn:hover { color: var(--fail); background: var(--fail-bg); }
    .input, .select, .textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); font-size: 12.5px; outline: none; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px #cffafe; }
    .textarea { resize: vertical; line-height: 1.55; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field > label { font-size: 11px; font-weight: 600; color: var(--muted); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .hint { font-size: 11.5px; color: var(--muted); line-height: 1.55; }
    .empty { border: 1px dashed #cfd6de; border-radius: var(--r); padding: 22px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.7; background: var(--panel-2); }
    .empty a { color: var(--accent); font-weight: 700; text-decoration: none; cursor: pointer; }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
    .panel-head h2 { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .panel-head h2 .mono { font-size: 11px; color: var(--muted); font-weight: 500; }
    .panel-body { padding: 14px; }
    .sec-title { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin: 2px 0 8px; display: flex; align-items: center; gap: 8px; }
    .sec-title::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }

    /* Workbench: list | work area */
    .bench { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
    .bench.three { grid-template-columns: 220px minmax(0, 1fr) 370px; }
    .list { position: sticky; top: 72px; max-height: calc(100vh - 94px); display: flex; flex-direction: column; }
    .list .panel-body { padding: 8px; overflow-y: auto; }
    .list-search { padding: 8px 8px 0; }
    .list-item { padding: 9px 10px; border-radius: var(--r); cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; }
    .list-item:hover { background: var(--panel-2); }
    .list-item.active { background: var(--accent-soft); border-color: var(--accent-line); }
    .list-item h4 { font-size: 12.5px; font-weight: 700; line-height: 1.35; word-break: break-word; }
    .list-item p { font-size: 10.5px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }

    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
    .tab { background: none; border: none; padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab .count { font-family: var(--mono); font-size: 10.5px; background: var(--line-2); color: var(--muted); padding: 1px 6px; border-radius: 999px; }

    .tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); max-height: 420px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tbl th { position: sticky; top: 0; z-index: 1; background: var(--panel-2); font-size: 10.5px; font-weight: 700; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; letter-spacing: 0.02em; }
    .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11.5px; }
    .tbl td.bad { color: var(--fail); font-weight: 700; }
    .tbl tr.sum td { background: var(--panel-2); font-weight: 700; }
    .tbl tr.sel td { background: var(--accent-soft); }
    .tbl tr.clickable { cursor: pointer; }
    .tag { font-size: 9.5px; padding: 1px 5px; border-radius: 3px; background: #e0f2fe; color: #075985; margin-left: 4px; font-weight: 700; font-family: var(--font); }
    .tag.grp { background: #ede9fe; color: #5b21b6; }
    .judge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
    .judge.pass { background: var(--pass-bg); color: var(--pass); }
    .judge.partial { background: var(--warn-bg); color: var(--warn); }
    .judge.fail { background: var(--fail-bg); color: var(--fail); }
    .block { margin-bottom: 20px; }
    .block h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .block h3 small { font-size: 11px; color: var(--muted); font-weight: 500; }
    .spec-input { width: 84px; padding: 4px 6px; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; text-align: right; font-family: var(--mono); }
    .spec-input:focus { outline: none; border-color: var(--accent-2); }
    .chart { position: relative; border: 1px solid var(--line); border-radius: var(--r); padding: 8px; background: #fff; }
    .chart svg { width: 100%; height: auto; display: block; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); font-weight: 600; margin-bottom: 6px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .swatch.hollow { background: #fff; border: 2px solid var(--ink-2); width: 9px; height: 9px; }
    .paste { font-family: var(--mono); font-size: 12px; }

    /* Stat tiles */
    .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
    .tile .k { font-size: 11px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .tile .v { font-family: var(--mono); font-size: 26px; font-weight: 600; margin-top: 6px; letter-spacing: -0.02em; }
    .tile .v small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 3px; }
    .tile .s { font-size: 11px; color: var(--faint); margin-top: 2px; }

    /* Home */
    .home-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .home-hero h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .home-hero p { color: var(--muted); margin-top: 4px; font-size: 13px; }
    .modules { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .module { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; cursor: pointer; transition: border-color 0.15s, transform 0.15s; display: flex; flex-direction: column; gap: 8px; }
    .module:hover { border-color: var(--accent-line); transform: translateY(-1px); }
    .module .ic { width: 34px; height: 34px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .module h3 { font-size: 14px; font-weight: 700; }
    .module p { font-size: 12px; color: var(--muted); line-height: 1.55; flex: 1; }
    .module .meta { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 600; }

    /* Meta form strip */
    .meta-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }

    /* ================= IMAGE VIEWER ================= */
    .img-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
    .thumb { width: 84px; flex-shrink: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; background: var(--viewer); position: relative; }
    .thumb img { width: 100%; height: 60px; object-fit: cover; display: block; opacity: 0.85; }
    .thumb.active { border-color: var(--accent-2); }
    .thumb.active img { opacity: 1; }
    .thumb span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 9.5px; color: #fff; background: rgba(0,0,0,0.55); padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thumb.add { display: flex; align-items: center; justify-content: center; height: 64px; color: var(--muted); background: var(--panel-2); border: 1px dashed #cfd6de; font-size: 11px; flex-direction: column; gap: 3px; }
    .thumb.add:hover { color: var(--accent); border-color: var(--accent-line); }

    .viewer-box { border-radius: 8px; overflow: hidden; border: 1px solid #1f2933; background: var(--viewer); }
    .vtools { display: flex; gap: 2px; padding: 6px; background: #151b22; border-bottom: 1px solid #222b35; flex-wrap: wrap; align-items: center; }
    .vtool { background: none; border: 1px solid transparent; color: #9aa7b6; border-radius: 5px; padding: 5px 8px; font-size: 11.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .vtool:hover { background: #222b35; color: #e2e8f0; }
    .vtool.active { background: #0e7490; color: #fff; }
    .vtool-sep { width: 1px; height: 18px; background: #2a3440; margin: 0 4px; }
    .vzoom { font-family: var(--mono); font-size: 11px; color: #9aa7b6; min-width: 42px; text-align: center; }
    .viewer { height: min(64vh, 620px); overflow: auto; position: relative; background-image: radial-gradient(#1a222b 1px, transparent 1px); background-size: 14px 14px; }
    .viewer-stage { margin: 0 auto; position: relative; }
    .viewer svg { display: block; width: 100%; height: auto; user-select: none; }
    .viewer.tool-on svg { cursor: crosshair; }
    .vstatus { display: flex; gap: 14px; padding: 6px 10px; background: #151b22; border-top: 1px solid #222b35; font-family: var(--mono); font-size: 10.5px; color: #8796a8; flex-wrap: wrap; }
    .vstatus b { color: #e2e8f0; font-weight: 500; }
    .vstatus .guide { color: #67e8f9; font-family: var(--font); }

    .side-stack { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 72px; max-height: calc(100vh - 94px); overflow-y: auto; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12px; align-items: baseline; }
    .kv dt { color: var(--muted); font-weight: 500; }
    .kv dd { font-family: var(--mono); text-align: right; font-weight: 500; }
    .kv dd.big { font-size: 18px; font-weight: 600; color: var(--accent); }
    .meas-list { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
    .meas { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 6px; align-items: center; padding: 5px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .meas:hover { background: var(--panel-2); }
    .meas.sel { background: var(--accent-soft); }
    .meas .no { font-family: var(--mono); font-size: 10.5px; color: #fff; background: var(--ink-2); border-radius: 3px; text-align: center; padding: 1px 0; }
    .meas .val { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
    .meas .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-check { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; cursor: pointer; background: var(--panel); user-select: none; }
    .chip-check input { display: none; }
    .chip-check.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: 600; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
    .seg button { background: var(--panel); border: none; border-right: 1px solid var(--line); padding: 6px 11px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
    .seg button:last-child { border-right: none; }
    .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; accent-color: var(--accent); }
    .ai-box { border: 1px solid #c7d2fe; background: #f5f7ff; border-radius: var(--r); padding: 10px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; max-height: 260px; overflow-y: auto; }

    /* ================= v1.1 AI 상담 · 파일 읽기 ================= */
    .side-tabs { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; flex-shrink: 0; }
    .side-tabs button { flex: 1; background: none; border: none; border-radius: 6px; padding: 7px 4px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .side-tabs button:hover { color: var(--ink); background: var(--panel-2); }
    .side-tabs button.on { background: var(--accent); color: #fff; }
    .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #22d3ee; display: inline-block; animation: pulse 1s infinite; }
    .chat-log { display: flex; flex-direction: column; gap: 10px; min-height: 160px; max-height: 60vh; overflow-y: auto; padding: 2px; }
    .msg { max-width: 94%; border-radius: 10px; padding: 9px 11px; font-size: 12.5px; line-height: 1.65; word-break: break-word; }
    .msg-text { white-space: pre-wrap; }
    .msg.ai { background: var(--panel-2); border: 1px solid var(--line); align-self: flex-start; color: var(--ink); }
    .msg.ai b { color: var(--ink); }
    .msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
    .msg.err { background: var(--fail-bg); color: var(--fail); align-self: stretch; font-size: 12px; }
    .msg-who { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 4px; white-space: normal; }
    .ai-dot { font-family: var(--mono); font-size: 9.5px; background: linear-gradient(135deg, #0e7490, #6d28d9); color: #fff; border-radius: 4px; padding: 1px 5px; }
    .msg-meta { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-size: 10.5px; color: var(--faint); font-family: var(--mono); white-space: nowrap; }
    .msg-meta button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 11px; font-weight: 600; padding: 0; font-family: var(--font); white-space: nowrap; }
    .msg-meta button:hover { text-decoration: underline; }
    .tg { font-size: 10px; font-weight: 700; padding: 0 4px; border-radius: 3px; margin-right: 2px; }
    .tg.obs { background: #e0f2fe; color: #075985; }
    .tg.est { background: #fef3c7; color: #92400e; }
    .quick { display: flex; flex-wrap: wrap; gap: 5px; }
    .quick button { border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; font-weight: 600; }
    .quick button:hover { background: #cffafe; }
    .quick button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-input { display: flex; gap: 6px; align-items: stretch; }
    .chat-input .btn { padding: 0 14px; }
    .thinking { display: flex; gap: 5px; justify-content: center; padding: 8px 0; }
    .thinking span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); animation: pulse 1.2s infinite ease-in-out; }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
    .drop { border: 1.5px dashed var(--accent-line); background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; cursor: pointer; color: var(--accent); display: flex; align-items: center; gap: 12px; text-align: left; transition: background 0.15s; }
    .drop:hover, .drop.over { background: #cffafe; border-color: var(--accent-2); }
    .drop i { font-size: 22px; }
    .drop b { display: block; font-size: 13px; }
    .drop span { display: block; font-size: 11px; color: var(--ink-2); margin-top: 2px; line-height: 1.45; }
    .panel.imp { margin-bottom: 12px; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* ================= REPORT ================= */
    .paper-wrap { background: #e5e8ec; border-radius: 8px; padding: 22px; overflow: auto; max-height: calc(100vh - 140px); }
    .paper { background: #fff; width: 100%; max-width: 794px; margin: 0 auto; padding: 56px 60px; box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08); font-size: 12.5px; line-height: 1.7; color: #111827; }
    .paper h1 { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 4px; letter-spacing: -0.01em; }
    .paper .p-sub { text-align: center; color: #6b7280; font-size: 11.5px; margin-bottom: 22px; font-family: var(--mono); }
    .paper h2 { font-size: 14.5px; font-weight: 800; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #111827; }
    .paper h3 { font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
    .paper .bul { white-space: pre-wrap; }
    .paper table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 11.5px; }
    .paper th, .paper td { border: 1px solid #9ca3af; padding: 5px 7px; text-align: center; }
    .paper th { background: #f3f4f6; font-weight: 700; }
    .paper td small { display: block; font-size: 10px; color: #4b5563; }
    .paper td small.bad { color: #b91c1c; font-weight: 700; }
    .paper figure { margin: 10px 0 14px; text-align: center; break-inside: avoid; }
    .paper figure img, .paper figure svg { max-width: 100%; border: 1px solid #d1d5db; }
    .paper figcaption { font-size: 11px; color: #4b5563; margin-top: 4px; }
    .paper .fig-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .paper .note { font-size: 10.5px; color: #6b7280; margin-top: 18px; border-top: 1px solid #e5e7eb; padding-top: 8px; }

    /* ================= DIALOG / TOAST / TIP ================= */
    dialog { border: none; border-radius: 10px; box-shadow: 0 24px 48px rgba(0,0,0,0.25); width: 92%; max-width: 440px; padding: 0; margin: auto; background: var(--panel); }
    dialog::backdrop { background: rgba(15, 20, 26, 0.5); backdrop-filter: blur(2px); }
    .dlg-head { padding: 14px 18px; border-bottom: 1px solid var(--line-2); font-size: 14.5px; font-weight: 700; }
    .dlg-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.6; }
    .dlg-foot { padding: 12px 18px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 8px; background: var(--panel-2); border-radius: 0 0 10px 10px; }
    #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--rail); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 300; max-width: 90vw; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #tip { position: fixed; z-index: 250; pointer-events: none; background: var(--rail); color: #fff; font-size: 11.5px; line-height: 1.55; padding: 7px 10px; border-radius: 6px; white-space: pre-line; opacity: 0; transition: opacity 0.1s; max-width: 260px; left: 0; top: 0; }
    #tip.show { opacity: 1; }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 1280px) {
      .bench.three { grid-template-columns: 210px minmax(0, 1fr); }
      .bench.three .side-stack { grid-column: 2; position: static; max-height: none; }
      .bench.three { grid-template-columns: 200px minmax(0, 1fr); }
    }
    @media (max-width: 1024px) {
      .bench, .bench.three { grid-template-columns: 1fr; }
      .bench.three .side-stack { grid-column: auto; }
      .list { position: static; max-height: 280px; }
      .tiles, .modules { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .meta-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 768px) {
      body { display: block; }
      .rail { position: fixed; left: 0; bottom: 0; top: auto; height: 60px; width: 100%; flex-direction: row; padding: 4px; gap: 0; justify-content: space-around; }
      .rail-logo, .rail-sep { display: none; }
      .rail-btn { flex: 1; padding: 6px 0; font-size: 10px; }
      .rail-btn.active::before { left: 20%; right: 20%; top: -4px; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }
      .app { height: auto; min-height: 100vh; padding-bottom: 64px; overflow: visible; }
      .topbar { padding: 0 12px; }
      .crumb .eyebrow, .crumb .sep, .top-actions .btn-label { display: none; }
      main#main { padding: 12px; }
      .tiles, .modules, .meta-strip, .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .viewer { height: auto; max-height: 62vh; }
      .paper { padding: 28px 20px; }
      .paper-wrap { padding: 8px; max-height: none; }
      .paper .fig-row { grid-template-columns: 1fr; }
    }

    /* ================= PRINT (보고서만) ================= */
    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; display: block; }
      .rail, .topbar, #toast, #tip, .no-print { display: none !important; }
      .bench > .list { display: none !important; }
      .rep-grid { display: block !important; }
      .paper table { font-size: 10.5px; }
      .app { height: auto; overflow: visible; }
      main#main { padding: 0; }
      .bench { display: block; }
      .paper-wrap { background: none; padding: 0; max-height: none; overflow: visible; border-radius: 0; }
      .paper { box-shadow: none; padding: 0; max-width: none; }
    }
  </style>
</head>
<body>
  <nav class="rail" id="rail">
    <div class="rail-logo" onclick="go('home')" title="Material Analysis Studio">MAS</div>
    <button class="rail-btn" data-view="home" onclick="go('home')"><i class="fa-solid fa-gauge-high"></i>개요</button>
    <button class="rail-btn" data-view="tests" onclick="go('tests')"><i class="fa-solid fa-chart-column"></i>시험 데이터</button>
    <button class="rail-btn" data-view="fracto" onclick="go('fracto')"><i class="fa-solid fa-burst"></i>파단면</button>
    <button class="rail-btn" data-view="micro" onclick="go('micro')"><i class="fa-solid fa-microscope"></i>미세조직</button>
    <button class="rail-btn" data-view="report" onclick="go('report')"><i class="fa-solid fa-file-lines"></i>보고서</button>
    <div class="rail-sep"></div>
    <button class="rail-btn" data-view="settings" onclick="go('settings')"><i class="fa-solid fa-gear"></i>설정</button>
  </nav>

  <div class="app">
    <header class="topbar">
      <div class="crumb">
        <span class="eyebrow">MATERIAL ANALYSIS STUDIO</span>
        <span class="sep">/</span>
        <strong id="viewTitle">개요</strong>
      </div>
      <div class="top-actions">
        <span class="chip" id="backupChip" onclick="exportBackup()" title="클릭하면 바로 백업합니다">백업 없음</span>
        <button class="btn sm" onclick="document.getElementById('importInput').click()" title="백업 파일(.json)에서 복원"><i class="fa-solid fa-file-import"></i><span class="btn-label">가져오기</span></button>
        <button class="btn sm primary" onclick="exportBackup()" title="모든 기록과 이미지를 백업 파일로 저장"><i class="fa-solid fa-floppy-disk"></i><span class="btn-label">백업</span></button>
        <input type="file" id="importInput" accept=".json,application/json" style="display:none;" onchange="handleImport(event)">
      </div>
    </header>
    <main id="main"></main>
  </div>

  <input type="file" id="csvInput" accept=".csv,.tsv,.txt,text/csv" style="display:none;" onchange="handleMatCsv(event)">
  <input type="file" id="imageInput" accept="image/*" multiple style="display:none;" onchange="handleImageFiles(event)">
  <input type="file" id="resultFileInput" accept=".xlsx,.xlsm,.xls,.ods,.csv,.tsv,.txt,.pdf,image/*" multiple style="display:none;" onchange="handleResultFiles(event)">

  <dialog id="confirmDlg">
    <div class="dlg-head" id="confirmTitle">확인</div>
    <div class="dlg-body"><p id="confirmMsg"></p></div>
    <div class="dlg-foot">
      <button class="btn" onclick="closeConfirm()">취소</button>
      <button class="btn primary" id="confirmOk">확인</button>
    </div>
  </dialog>

  <dialog id="formDlg">
    <div class="dlg-head" id="formTitle">입력</div>
    <div class="dlg-body" id="formBody"></div>
    <div class="dlg-foot">
      <button class="btn" onclick="closeForm(null)">취소</button>
      <button class="btn primary" id="formOk">확인</button>
    </div>
  </dialog>

  <div id="toast"></div>
  <div id="tip"></div>
  <script>
    // ================= 1. STATE =================
    const APP_ID = 'material-analysis-studio';
    const FORMAT_VERSION = 1;
    const KEYS = {
      tests: 'mas_tests', fracto: 'mas_fracto', micro: 'mas_micro', reports: 'mas_reports',
      settings: 'mas_settings', aiKey: 'mas_ai_key', lastBackup: 'mas_last_backup', preImport: 'mas_pre_import_snapshot'
    };
    const VIEW_TITLES = { home: '개요', tests: '시험 데이터 분석', fracto: '파단면 분석', micro: '미세조직 분석', report: '보고서 작성', settings: '설정 · 백업' };
    const DB = { tests: [], fracto: [], micro: [], reports: [] };
    let settings = { author: '', org: '', model: 'gemini-3.8-flash', fallbackModel: '' };
    let view = 'home';
    const active = { tests: null, fracto: null, micro: null, report: null };

    // ================= 2. INIT =================
    window.addEventListener('DOMContentLoaded', () => {
      initData();
      go('home');
      document.addEventListener('keydown', onGlobalKey);
    });

    function loadArr(key) {
      try {
        const v = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(v) ? v : [];
      } catch (e) {
        return [];
      }
    }

    function initData() {
      DB.tests = loadArr(KEYS.tests).map(normalizeMaterialSet);
      DB.fracto = loadArr(KEYS.fracto).map(normalizeImageRecord);
      DB.micro = loadArr(KEYS.micro).map(normalizeImageRecord);
      DB.reports = loadArr(KEYS.reports).map(normalizeReport);
      try {
        settings = { ...settings, ...(JSON.parse(localStorage.getItem(KEYS.settings) || '{}') || {}) };
      } catch (e) {}
      saveData();
    }

    function saveData() {
      try {
        localStorage.setItem(KEYS.tests, JSON.stringify(DB.tests));
        localStorage.setItem(KEYS.fracto, JSON.stringify(DB.fracto));
        localStorage.setItem(KEYS.micro, JSON.stringify(DB.micro));
        localStorage.setItem(KEYS.reports, JSON.stringify(DB.reports));
        localStorage.setItem(KEYS.settings, JSON.stringify(settings));
      } catch (e) {
        console.warn('localStorage 저장 실패:', e);
        showToast('브라우저 저장 공간이 부족합니다. 백업 후 오래된 기록을 정리해 주세요.');
      }
    }

    function genId(prefix) {
      return `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
    }

    function touch(rec) {
      if (rec) rec.updatedAt = Date.now();
    }

    // ================= 3. NAVIGATION =================
    function go(v) {
      view = v;
      tipHide();
      document.querySelectorAll('.rail-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
      document.getElementById('viewTitle').textContent = VIEW_TITLES[v] || '';
      document.title = `${VIEW_TITLES[v] || ''} · Material Analysis Studio`;
      render();
      document.querySelector('.app').scrollTop = 0;
      window.scrollTo(0, 0);
    }

    function render() {
      renderBackupChip();
      const main = document.getElementById('main');
      if (view === 'tests') renderMaterial();
      else if (view === 'fracto' || view === 'micro') renderImageModule(view);
      else if (view === 'report') renderReport();
      else if (view === 'settings') main.innerHTML = settingsHtml();
      else main.innerHTML = homeHtml();
    }

    function onGlobalKey(e) {
      const tag = (e.target && e.target.tagName) || '';
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || document.querySelector('dialog[open]')) return;
      if ((view === 'fracto' || view === 'micro') && typeof viewerKey === 'function') viewerKey(e);
    }

    // ================= 4. DIALOGS · TOAST · TIP =================
    let confirmCb = null;
    function askConfirm(message, onOk, opts) {
      const o = opts || {};
      confirmCb = onOk;
      document.getElementById('confirmTitle').textContent = o.title || '확인';
      document.getElementById('confirmMsg').textContent = message;
      const ok = document.getElementById('confirmOk');
      ok.textContent = o.okLabel || '확인';
      ok.className = 'btn ' + (o.danger ? 'danger' : 'primary');
      ok.onclick = () => {
        const cb = confirmCb;
        closeConfirm();
        if (cb) cb();
      };
      document.getElementById('confirmDlg').showModal();
    }

    function closeConfirm() {
      confirmCb = null;
      document.getElementById('confirmDlg').close();
    }

    // 간단한 입력 대화상자: fields = [{ id, label, type: 'text'|'number'|'select'|'textarea', value, options: [[v, label]], placeholder }]
    let formResolve = null;
    function askForm(title, fields, okLabel) {
      return new Promise(resolve => {
        formResolve = resolve;
        document.getElementById('formTitle').textContent = title;
        document.getElementById('formBody').innerHTML = fields.map(f => {
          const v = f.value == null ? '' : f.value;
          let ctl;
          if (f.type === 'select') {
            ctl = `<select class="select" id="ff_${f.id}">${f.options.map(([ov, ol]) => `<option value="${escapeHtml(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${escapeHtml(ol)}</option>`).join('')}</select>`;
          } else if (f.type === 'textarea') {
            ctl = `<textarea class="textarea" id="ff_${f.id}" rows="3" placeholder="${escapeHtml(f.placeholder || '')}">${escapeHtml(v)}</textarea>`;
          } else {
            ctl = `<input class="input ${f.type === 'number' ? 'mono' : ''}" id="ff_${f.id}" type="${f.type === 'number' ? 'text' : 'text'}" ${f.type === 'number' ? 'inputmode="decimal"' : ''} value="${escapeHtml(v)}" placeholder="${escapeHtml(f.placeholder || '')}">`;
          }
          return `<div class="field"><label>${escapeHtml(f.label)}</label>${ctl}${f.hint ? `<span class="hint">${escapeHtml(f.hint)}</span>` : ''}</div>`;
        }).join('');
        const ok = document.getElementById('formOk');
        ok.textContent = okLabel || '확인';
        ok.onclick = () => {
          const out = {};
          fields.forEach(f => { out[f.id] = document.getElementById('ff_' + f.id).value; });
          closeForm(out);
        };
        const dlg = document.getElementById('formDlg');
        dlg.showModal();
        const first = document.querySelector('#formBody input, #formBody select, #formBody textarea');
        if (first) {
          first.focus();
          if (first.select) first.select();
        }
        dlg.onkeydown = (e) => {
          if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            ok.click();
          }
        };
      });
    }

    function closeForm(result) {
      const dlg = document.getElementById('formDlg');
      if (dlg.open) dlg.close();
      const r = formResolve;
      formResolve = null;
      if (r) r(result);
    }
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('formDlg').addEventListener('cancel', () => closeForm(null));
    });

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
    }

    function tipMove(e) {
      const tip = document.getElementById('tip');
      const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
      if (!t) {
        tip.classList.remove('show');
        return;
      }
      tip.textContent = t.getAttribute('data-tip');
      tip.classList.add('show');
      tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
      tip.style.top = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8) + 'px';
    }

    function tipHide() {
      const tip = document.getElementById('tip');
      if (tip) tip.classList.remove('show');
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    function safeFileName(s) {
      return String(s || '파일').replace(/[\\/:*?"<>|]/g, '_').slice(0, 80);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function toDateStr(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function fmtDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // ================= 5. IMAGE STORAGE (IndexedDB) =================
    const IDB_NAME = 'MASImagesDB';
    const IDB_STORE = 'images';
    const imgUrlCache = new Map();

    function openImgDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB 미지원'));
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function putImageBlob(id, blob, name) {
      const db = await openImgDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put({ id, blob, name: name || '', mime: blob.type || 'image/png' });
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getImageRec(id) {
      const db = await openImgDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function getAllImageRecs() {
      try {
        const db = await openImgDB();
        return await new Promise((resolve, reject) => {
          const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        return [];
      }
    }

    async function deleteImageBlob(id) {
      try {
        const db = await openImgDB();
        db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).delete(id);
      } catch (e) {}
      if (imgUrlCache.has(id)) {
        URL.revokeObjectURL(imgUrlCache.get(id));
        imgUrlCache.delete(id);
      }
    }

    async function imageUrl(id) {
      if (imgUrlCache.has(id)) return imgUrlCache.get(id);
      try {
        const rec = await getImageRec(id);
        if (!rec || !rec.blob) return '';
        const url = URL.createObjectURL(rec.blob);
        imgUrlCache.set(id, url);
        return url;
      } catch (e) {
        return '';
      }
    }

    function loadImageEl(src) {
      return new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = reject;
        im.src = src;
      });
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.readAsDataURL(blob);
      });
    }

    async function dataUrlToBlob(dataUrl) {
      return await (await fetch(dataUrl)).blob();
    }

    // 업로드 이미지는 긴 변 4000px 이하로 줄여 저장 (측정은 저장된 픽셀 기준)
    async function prepareImageBlob(file) {
      const url = URL.createObjectURL(file);
      try {
        const im = await loadImageEl(url);
        const MAX = 4000;
        const w = im.naturalWidth, h = im.naturalHeight;
        if (Math.max(w, h) <= MAX && /image\/(png|jpeg|webp)/.test(file.type)) {
          return { blob: file, w, h };
        }
        const k = Math.min(1, MAX / Math.max(w, h));
        const c = document.createElement('canvas');
        c.width = Math.round(w * k);
        c.height = Math.round(h * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        const blob = await new Promise(r => c.toBlob(r, 'image/png'));
        return { blob, w: c.width, h: c.height, resized: k < 1 };
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    // ================= 6. BACKUP =================
    async function exportBackup() {
      saveData();
      showToast('백업 파일을 만드는 중입니다...');
      const usedIds = new Set();
      [...DB.fracto, ...DB.micro].forEach(r => r.images.forEach(im => usedIds.add(im.id)));
      const images = [];
      for (const rec of (await getAllImageRecs()).filter(r => usedIds.has(r.id))) {
        try {
          if (rec.blob) images.push({ id: rec.id, name: rec.name, mime: rec.mime, dataUrl: await blobToDataUrl(rec.blob) });
        } catch (e) {
          console.warn('이미지 백업 건너뜀', rec.id, e);
        }
      }
      const payload = {
        app: APP_ID,
        formatVersion: FORMAT_VERSION,
        exportedAt: new Date().toISOString(),
        counts: { tests: DB.tests.length, fracto: DB.fracto.length, micro: DB.micro.length, reports: DB.reports.length, images: images.length },
        tests: DB.tests, fracto: DB.fracto, micro: DB.micro, reports: DB.reports,
        settings: { author: settings.author, org: settings.org, model: settings.model, fallbackModel: settings.fallbackModel },
        images
      };
      const blob = new Blob([JSON.stringify(payload)], { type: 'application/json;charset=utf-8' });
      const now = new Date();
      const stamp = `${toDateStr(now).replace(/-/g, '')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
      downloadBlob(blob, `material-analysis-backup_${stamp}.json`);
      try { localStorage.setItem(KEYS.lastBackup, String(Date.now())); } catch (e) {}
      renderBackupChip();
      showToast(`백업 완료: 시험 ${DB.tests.length} · 파단면 ${DB.fracto.length} · 미세조직 ${DB.micro.length} · 보고서 ${DB.reports.length} · 이미지 ${images.length}장 (${(blob.size / 1048576).toFixed(1)} MB)`);
    }

    async function handleImport(e) {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      let data;
      try {
        data = JSON.parse(await file.text());
      } catch (err) {
        showToast('백업 파일을 읽을 수 없습니다. (JSON 형식이 아님)');
        return;
      }
      if (!data || data.app !== APP_ID) {
        showToast('Material Analysis Studio 백업 파일이 아닙니다.');
        return;
      }
      const c = data.counts || {};
      const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString('ko-KR') : '알 수 없음';
      askConfirm(`${when}에 만든 백업(시험 ${c.tests ?? 0} · 파단면 ${c.fracto ?? 0} · 미세조직 ${c.micro ?? 0} · 보고서 ${c.reports ?? 0} · 이미지 ${c.images ?? 0}장)으로 현재 데이터를 덮어씁니다. 계속하시겠습니까?`,
        () => applyImport(data), { okLabel: '가져오기', title: '백업 가져오기' });
    }

    async function applyImport(data) {
      try {
        localStorage.setItem(KEYS.preImport, JSON.stringify({ savedAt: new Date().toISOString(), tests: DB.tests, fracto: DB.fracto, micro: DB.micro, reports: DB.reports }));
      } catch (e) {}
      DB.tests = (data.tests || []).map(normalizeMaterialSet);
      DB.fracto = (data.fracto || []).map(normalizeImageRecord);
      DB.micro = (data.micro || []).map(normalizeImageRecord);
      DB.reports = (data.reports || []).map(normalizeReport);
      if (data.settings) settings = { ...settings, ...data.settings };
      saveData();
      let restored = 0;
      for (const im of (data.images || [])) {
        try {
          await putImageBlob(im.id, await dataUrlToBlob(im.dataUrl), im.name);
          if (imgUrlCache.has(im.id)) {
            URL.revokeObjectURL(imgUrlCache.get(im.id));
            imgUrlCache.delete(im.id);
          }
          restored++;
        } catch (err) {
          console.warn('이미지 복원 실패', im.id, err);
        }
      }
      Object.keys(active).forEach(k => { active[k] = null; });
      render();
      showToast(`가져오기 완료: 시험 ${DB.tests.length} · 파단면 ${DB.fracto.length} · 미세조직 ${DB.micro.length} · 보고서 ${DB.reports.length} · 이미지 ${restored}장`);
    }

    function renderBackupChip() {
      const chip = document.getElementById('backupChip');

      try { last = Number(localStorage.getItem(KEYS.lastBackup)) || 0; } catch (e) {}

    // ================= 9. GEMINI (선택 기능) =================
    async function blobPart(blob, mime) {
      const dataUrl = await blobToDataUrl(blob);
      return { inline_data: { mime_type: mime || blob.type || 'image/jpeg', data: dataUrl.split(',')[1] } };
    }

    function stripFence(t) {
      return String(t || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
    }

    // contents: [{ role: 'user'|'model', parts: [...] }], opts: { system, json }
    async function callGeminiContents(contents, opts) {
      const o = opts || {};
      const key = getAiKey();
      if (!key) throw new Error('설정에서 Gemini API 키를 먼저 저장해 주세요.');
      const models = [settings.model, settings.fallbackModel].filter(Boolean);
      if (!models.length) throw new Error('설정에서 AI 모델 이름을 입력해 주세요.');
      const body = { contents, generationConfig: { temperature: o.json ? 0.1 : 0.4 } };
      if (o.json) body.generationConfig.responseMimeType = 'application/json';
      if (o.system) body.systemInstruction = { parts: [{ text: o.system }] };
      let lastErr = null;
      for (const model of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
            body: JSON.stringify(body)
          });
          const json = await res.json().catch(() => ({}));
          if (!res.ok) {
            lastErr = new Error((json.error && json.error.message) || `HTTP ${res.status}`);
            if ([429, 500, 503].includes(res.status)) continue;
            throw lastErr;
          }
          const text = ((json.candidates || [])[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
          if (!text) throw new Error('응답이 비어 있습니다.');
          return { text, model };
        } catch (err) {
          lastErr = err;
          if (err instanceof TypeError) lastErr = new Error('AI 서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.');
        }
      }
      throw lastErr || new Error('AI 호출 실패');
    }

    async function callGemini(prompt, imageBlob) {
      const parts = [{ text: prompt }];
      if (imageBlob) parts.push(await blobPart(imageBlob));
      return callGeminiContents([{ role: 'user', parts }]);
    }

    // ---- 파싱 · 계산 ----
    function parseDelimited(text) {
      const src = String(text || '').replace(/^﻿/, '').replace(/\r\n?/g, '\n');
      const firstLine = src.split('\n').find(l => l.trim()) || '';
      const delim = firstLine.includes('\t')
        ? '\t'
        : ((firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',');
      const rows = [];
      let row = [];
      let cell = '';
      let inQuote = false;
      for (let i = 0; i < src.length; i++) {
        const ch = src[i];
        if (inQuote) {
          if (ch === '"') {
            if (src[i + 1] === '"') { cell += '"'; i++; } else inQuote = false;
          } else cell += ch;
        } else if (ch === '"' && cell === '') {
          inQuote = true;
        } else if (ch === delim) {
          row.push(cell); cell = '';
        } else if (ch === '\n') {
          row.push(cell); rows.push(row); row = []; cell = '';
        } else cell += ch;
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c !== ''));
    }

    function matNum(v) {
      if (v === null || v === undefined) return NaN;
      const s = String(v).trim().replace(/,/g, '').replace(/\s+/g, '');
      if (!s) return NaN;
      return /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(s) ? Number(s) : NaN;
    }

    function matUnit(name) {
      const m = String(name || '').match(/[\(\[]([^\)\]]+)[\)\]]\s*$/);
      return m ? m[1].trim() : '';
    }

    function matBase(name) {
      return String(name || '').replace(/\s*[\(\[][^\)\]]*[\)\]]\s*$/, '').trim() || String(name || '');
    }

    function matNumericCols(m) {
      return m.columns.map((c, i) => i).filter(i => {
        const vals = m.rows.map(r => r[i]).filter(v => v !== '' && v != null);
        if (!vals.length) return false;
        return vals.filter(v => !isNaN(matNum(v))).length / vals.length >= 0.8;
      });
    }

    function matGuessGroupCol(m) {
      const nums = new Set(matNumericCols(m));
      const cand = m.columns.filter((c, i) => !nums.has(i));
      const byName = cand.find(c => /조건|열처리|공정|그룹|group|condition|temper|lot|로트|소재|합금/i.test(c));
      if (byName) return byName;
      // 시편 번호처럼 값이 모두 다른 열은 제외하고, 반복되는 값이 있는 첫 문자열 열
      return cand.find(c => {
        const ci = m.columns.indexOf(c);
        const vals = new Set(m.rows.map(r => r[ci]));
        return vals.size > 1 && vals.size < m.rows.length;
      }) || '';
    }

    function matGuessFatigue(m) {
      const nums = matNumericCols(m).map(i => m.columns[i]);
      const f = m.fatigue;
      if (!m.columns.includes(f.stressCol)) f.stressCol = nums.find(c => /응력|stress|진폭|amplitude|σ|하중/i.test(c)) || '';
      if (!m.columns.includes(f.cyclesCol)) f.cyclesCol = nums.find(c => /수명|cycle|사이클|횟수|nf|^n\b/i.test(c)) || '';
      if (f.runoutCol && !m.columns.includes(f.runoutCol)) f.runoutCol = '';
      if (!f.runoutCol) f.runoutCol = m.columns.find(c => /런아웃|run-?out|미파단|파단\s*여부/i.test(c)) || '';
    }

    function matIsRunout(v) {
      const s = String(v || '').trim().toLowerCase();
      if (!s) return false;
      return /^(y|yes|o|예|1|true|ro|●|v|✓|✔)$/.test(s) || /런아웃|run-?out|미파단/.test(s);
    }

    function matGroups(m) {
      const gi = m.groupCol ? m.columns.indexOf(m.groupCol) : -1;
      if (gi < 0) return [{ name: '전체', rows: m.rows }];
      const map = new Map();
      m.rows.forEach(r => {
        const k = r[gi] || '(미지정)';
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(r);
      });
      return [...map.entries()].map(([name, rows]) => ({ name, rows }));
    }

    function matStats(vals) {
      const v = vals.filter(x => isFinite(x));
      const n = v.length;
      if (!n) return { n: 0, values: [] };
      const mean = v.reduce((a, b) => a + b, 0) / n;
      const sd = n > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : 0;
      return { n, mean, sd, min: Math.min(...v), max: Math.max(...v), cv: mean ? sd / Math.abs(mean) * 100 : 0, values: v };
    }

    function matSpecRange(spec) {
      const lo = matNum(spec && spec.min);
      const hi = matNum(spec && spec.max);
      return { lo, hi, has: !isNaN(lo) || !isNaN(hi) };
    }

    function matInSpec(spec, x) {
      const { lo, hi } = matSpecRange(spec);
      return (isNaN(lo) || x >= lo) && (isNaN(hi) || x <= hi);
    }

    function matJudge(spec, st) {
      if (!st || !st.n || !matSpecRange(spec).has) return null;
      const fails = st.values.filter(x => !matInSpec(spec, x)).length;
      const meanOk = matInSpec(spec, st.mean);
      return { meanOk, fails, level: fails === 0 ? 'pass' : (meanOk ? 'partial' : 'fail') };
    }

    function matSpecLabel(spec, unit) {
      const { lo, hi } = matSpecRange(spec);
      const u = unit ? ' ' + unit : '';
      if (!isNaN(lo) && !isNaN(hi)) return `${lo} ~ ${hi}${u}`;
      if (!isNaN(lo)) return `≥ ${lo}${u}`;
      if (!isNaN(hi)) return `≤ ${hi}${u}`;
      return '';
    }

    // ref 값의 크기에 맞춰 소수 자리를 정한다 (표준편차를 평균과 같은 자리로 표시)
    function matFmt(x, ref) {
      if (x === undefined || x === null || !isFinite(x)) return '-';
      const a = Math.abs(ref !== undefined && isFinite(ref) ? ref : x);
      if (a >= 1e5) return Number(x).toExponential(2).replace('e+', 'E+').replace('e-', 'E-');
      const d = a >= 100 ? 1 : a >= 10 ? 2 : 3;
      return Number(x).toFixed(d);
    }

    function matSup(n) {
      const map = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
      return String(n).split('').map(c => map[c] || c).join('');
    }

    function matNiceTicks(lo, hi, count) {
      if (!(hi > lo)) hi = lo + 1;
      const raw = (hi - lo) / (count || 5);
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || 10 * mag;
      const start = Math.floor(lo / step) * step;
      const end = Math.ceil(hi / step) * step;
      const ticks = [];
      for (let v = start; v <= end + step * 1e-9; v += step) ticks.push(+v.toFixed(10));
      return { ticks, min: start, max: end };
    }

    // Basquin 근사 σa = A·N^b. ASTM E739처럼 log N을 종속변수로 회귀한 뒤 식을 바꿔 쓴다.
    function matBasquin(pts) {
      if (pts.length < 3) return null;
      const xs = pts.map(p => Math.log10(p.S));
      const ys = pts.map(p => Math.log10(p.N));
      const n = xs.length;
      const mx = xs.reduce((a, b) => a + b, 0) / n;
      const my = ys.reduce((a, b) => a + b, 0) / n;
      let sxx = 0, sxy = 0, syy = 0;
      for (let i = 0; i < n; i++) {
        sxx += (xs[i] - mx) ** 2;
        sxy += (xs[i] - mx) * (ys[i] - my);
        syy += (ys[i] - my) ** 2;
      }
      if (!sxx || !sxy || !syy) return null;
      const d = sxy / sxx;
      const c = my - d * mx;
      const b = 1 / d;
      const logA = -c / d;
      const Ns = pts.map(p => p.N);
      return {
        A: Math.pow(10, logA), b, r2: (sxy * sxy) / (sxx * syy), n,
        minN: Math.min(...Ns), maxN: Math.max(...Ns),
        S: N => Math.pow(10, logA + b * Math.log10(N))
      };
    }

    function matFatiguePoints(m) {
      const f = m.fatigue;
      const si = m.columns.indexOf(f.stressCol);
      const ni = m.columns.indexOf(f.cyclesCol);
      const ri = f.runoutCol ? m.columns.indexOf(f.runoutCol) : -1;
      if (si < 0 || ni < 0 || si === ni) return null;
      const numSet = new Set(matNumericCols(m));
      const idCol = m.columns.findIndex((c, i) => !numSet.has(i) && i !== ri && c !== m.groupCol);
      return matGroups(m).map((g, gi) => {
        const pts = g.rows
          .map(r => ({ S: matNum(r[si]), N: matNum(r[ni]), ro: ri >= 0 && matIsRunout(r[ri]), id: idCol >= 0 ? r[idCol] : '' }))
          .filter(p => p.S > 0 && p.N > 0);
        return { name: g.name, idx: gi, pts, fit: matBasquin(pts.filter(p => !p.ro)) };
      }).filter(g => g.pts.length);
    }

    function matSeriesColor(idx) {
      return idx < MAT_SERIES_COLORS.length ? MAT_SERIES_COLORS[idx] : MAT_OTHER_COLOR;
    }


    // ---- 화면 ----

          <div class="field"><label>시험 규격</label><input class="input" value="${escapeHtml(m.standard)}" placeholder="예: ASTM E8/E8M" onchange="updateMatField('standard', this.value)"></div>

        <div class="tabs">
          ${tabs.map(([k, ic, label, cnt]) => `<button class="tab ${matTab === k ? 'active' : ''}" onclick="setMatTab('${k}')"><i class="fa-solid ${ic}"></i> ${label}${cnt !== null ? ` <span class="count">${cnt}</span>` : ''}</button>`).join('')}
          <span class="spacer"></span>

      return `

          </p>
          <textarea id="matPasteInput" class="textarea paste" rows="6" spellcheck="false" placeholder="${escapeHtml(type.headers.join('\t'))}&#10;S-01&#9;T6&#9;...&#10;(탭 · 쉼표 · 세미콜론 구분 모두 인식)"></textarea>
          <div class="inline-row" style="margin-top:8px;">
            <button class="btn primary sm" onclick="applyMatPaste('replace')"><i class="fa-solid fa-paste"></i> 붙여넣은 내용으로 바꾸기</button>

            <button class="btn sm" onclick="pickResultFile('tests')"><i class="fa-solid fa-file-arrow-up"></i> 파일 불러오기 (엑셀·CSV·PDF)</button>
            ${m.rows.length ? `<button class="btn sm" onclick="copyMatDataTsv()" style="margin-left:auto;"><i class="fa-regular fa-copy"></i> 현재 데이터 복사</button>` : ''}
          </div>
        </div>
        ${m.columns.length ? `
        <div class="inline-row" style="margin-bottom:10px;">
          <span class="hint" style="font-weight:600;">조건(비교 그룹) 열</span>

    function matJudgeBadge(j) {
      if (!j) return '<span style="color:#cbd5e1;">-</span>';
      if (j.level === 'pass') return '<span class="judge pass"><i class="fa-solid fa-check"></i> 전수 충족</span>';

      return `<span class="judge fail"><i class="fa-solid fa-xmark"></i> 평균 미달${j.fails ? ` · ${j.fails}개 이탈` : ''}</span>`;
    }

    function matNeedDataHtml() {
      return `<p class="empty">먼저 '데이터 입력' 탭에서 숫자가 들어 있는 시험 데이터를 붙여넣어 주세요.<br><a href="javascript:void(0)" onclick="setMatTab('data')" style="color:var(--primary); font-weight:800; text-decoration:none;">데이터 입력으로 →</a></p>`;
    }

    function matStatsTabHtml(m) {
      const nums = matNumericCols(m);
      if (!m.rows.length || !nums.length) return matNeedDataHtml();
      const groups = matGroups(m);
      const multi = groups.length > 1;
      const fatigueCols = m.testType === 'fatigue' ? [m.fatigue.stressCol, m.fatigue.cyclesCol] : [];

      // 목표 규격 입력
      const specRows = nums.map(ci => {
        const name = m.columns[ci];
        const spec = m.specs[name] || {};
        const js = groups.map(g => matJudge(spec, matStats(g.rows.map(r => matNum(r[ci]))))).filter(Boolean);
        let summary = '<span class="hint">목표 미입력</span>';
        if (js.length) {
          const c = { pass: 0, partial: 0, fail: 0 };
          js.forEach(j => c[j.level]++);
          const worst = c.fail ? 'fail' : c.partial ? 'partial' : 'pass';
          const icon = { pass: 'fa-check', partial: 'fa-triangle-exclamation', fail: 'fa-xmark' }[worst];
          const label = multi
            ? [c.pass ? `충족 ${c.pass}` : '', c.partial ? `일부 이탈 ${c.partial}` : '', c.fail ? `미달 ${c.fail}` : ''].filter(Boolean).join(' · ') + ` / 조건 ${js.length}개`
            : { pass: '전수 충족', partial: '평균 충족 · 일부 이탈', fail: '평균 미달' }[worst];
          summary = `<span class="judge ${worst}"><i class="fa-solid ${icon}"></i> ${label}</span>`;

          <tr>

            <td class="num"><input type="text" inputmode="decimal" class="spec-input" value="${escapeHtml(spec.max || '')}" placeholder="최대" onchange="setMatSpec(${ci}, 'max', this.value)"></td>
