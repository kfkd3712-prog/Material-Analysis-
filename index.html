      let html = `
        <div class="block">
          <h3>목표 규격 <small>최소·최대 중 필요한 값만 입력 · 평균과 전체 시편을 각각 판정</small></h3>
          <div class="tbl-wrap" style="max-height:none;">
            <table class="tbl">
              <thead><tr><th>항목</th><th>단위</th><th class="num">목표 최소</th><th class="num">목표 최대</th><th>판정</th></tr></thead>
              <tbody>${specRows}</tbody>
            </table>
          </div>
        </div>`;

      // 항목별 조건 통계
      nums.filter(ci => !fatigueCols.includes(m.columns[ci])).forEach(ci => {
        const name = m.columns[ci];
        const spec = m.specs[name] || {};
        const unit = matUnit(name);
        const lines = groups.map(g => ({ name: g.name, st: matStats(g.rows.map(r => matNum(r[ci]))) }));
        if (multi) lines.push({ name: '전체', st: matStats(m.rows.map(r => matNum(r[ci]))), sum: true });
        html += `
          <div class="block">
            <h3>${escapeHtml(matBase(name))} <small>${unit ? '단위 ' + escapeHtml(unit) : ''}${matSpecRange(spec).has ? ' · 목표 ' + escapeHtml(matSpecLabel(spec, unit)) : ''}</small></h3>
            <div class="tbl-wrap" style="max-height:none;">
              <table class="tbl">
                <thead><tr><th>${multi ? '조건' : '구분'}</th><th class="num">n</th><th class="num">평균</th><th class="num">표준편차</th><th class="num">최소</th><th class="num">최대</th><th class="num">CV(%)</th><th>판정</th></tr></thead>
                <tbody>
                  ${lines.map(l => {
                    const st = l.st;
                    const j = matJudge(spec, st);
                    const meanBad = j && !j.meanOk;
                    const minBad = st.n && !matInSpec(spec, st.min);
                    const maxBad = st.n && !matInSpec(spec, st.max);
                    return `<tr class="${l.sum ? 'sum' : ''}">
                      <td>${escapeHtml(l.name)}</td>
                      <td class="num">${st.n}</td>
                      <td class="num ${meanBad ? 'bad' : ''}">${matFmt(st.mean)}</td>
                      <td class="num">${st.n > 1 ? matFmt(st.sd, st.mean) : '-'}</td>
                      <td class="num ${minBad ? 'bad' : ''}">${matFmt(st.min, st.mean)}</td>
                      <td class="num ${maxBad ? 'bad' : ''}">${matFmt(st.max, st.mean)}</td>
                      <td class="num">${st.n > 1 ? st.cv.toFixed(1) : '-'}</td>
                      <td>${l.sum ? '' : matJudgeBadge(j)}</td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>`;
      });

      // 목표 이탈 시편 목록
      const numSet = new Set(nums);
      const idCol = m.columns.findIndex((c, i) => !numSet.has(i) && c !== m.groupCol);
      const gi = m.groupCol ? m.columns.indexOf(m.groupCol) : -1;
      const outs = [];
      m.rows.forEach((r, ri) => nums.forEach(ci => {
        const name = m.columns[ci];
        const spec = m.specs[name];
        const v = matNum(r[ci]);
        if (!spec || !matSpecRange(spec).has || isNaN(v) || fatigueCols.includes(name)) return;
        if (!matInSpec(spec, v)) outs.push({ id: idCol >= 0 ? r[idCol] : `${ri + 1}행`, g: gi >= 0 ? r[gi] : '', item: matBase(name), v: r[ci], target: matSpecLabel(spec, matUnit(name)) });
      }));
      if (outs.length) {
        html += `
          <div class="block">
            <h3>목표 이탈 시편 <small>${outs.length}건</small></h3>
            <div class="tbl-wrap" style="max-height:260px;">
              <table class="tbl">
                <thead><tr><th>시편</th>${gi >= 0 ? '<th>조건</th>' : ''}<th>항목</th><th class="num">측정값</th><th>목표</th></tr></thead>
                <tbody>${outs.slice(0, 100).map(o => `<tr><td>${escapeHtml(o.id)}</td>${gi >= 0 ? `<td>${escapeHtml(o.g)}</td>` : ''}<td>${escapeHtml(o.item)}</td><td class="num bad">${escapeHtml(o.v)}</td><td>${escapeHtml(o.target)}</td></tr>`).join('')}</tbody>
              </table>
            </div>
          </div>`;
      }

      if (m.testType === 'fatigue') html += matFatigueTableHtml(m);
      return html;
    }

    function matFatigueTableHtml(m) {
      const groups = matFatiguePoints(m);
      if (!groups) return `<div class="block"><h3>피로 특성 (S-N)</h3><p class="empty">'차트' 탭에서 응력 열과 수명 열을 선택하면 Basquin 회귀 결과가 여기에 표시됩니다.</p></div>`;
      const unit = matUnit(m.fatigue.stressCol) || 'MPa';
      const lines = groups.map(g => ({ name: g.name, pts: g.pts, fit: g.fit }));
      if (groups.length > 1) {
        const all = groups.flatMap(g => g.pts);
        lines.push({ name: '전체', pts: all, fit: matBasquin(all.filter(p => !p.ro)), sum: true });
      }
      return `
        <div class="block">
          <h3>피로 특성 (S-N, Basquin 근사) <small>σa = A·N^b · log N을 종속변수로 회귀(ASTM E739 방식) · 런아웃 제외</small></h3>
          <div class="tbl-wrap" style="max-height:none;">
            <table class="tbl">
              <thead><tr><th>조건</th><th class="num">파단</th><th class="num">런아웃</th><th class="num">A (${escapeHtml(unit)})</th><th class="num">b</th><th class="num">R²</th><th class="num">10⁷ cycle 추정 강도</th></tr></thead>
              <tbody>
                ${lines.map(l => {
                  const ro = l.pts.filter(p => p.ro).length;
                  const f = l.fit;
                  const s7 = f ? f.S(1e7) : NaN;
                  return `<tr class="${l.sum ? 'sum' : ''}">
                    <td>${escapeHtml(l.name)}</td>
                    <td class="num">${l.pts.length - ro}</td>
                    <td class="num">${ro}</td>
                    <td class="num">${f ? matFmt(f.A) : '-'}</td>
                    <td class="num">${f ? f.b.toFixed(4) : '-'}</td>
                    <td class="num">${f ? f.r2.toFixed(3) : '-'}</td>
                    <td class="num">${f ? `${matFmt(s7)} ${escapeHtml(unit)}${1e7 > f.maxN ? ' <span class="hint">(외삽)</span>' : ''}` : '<span class="hint">파단 3점 미만</span>'}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
          <p class="hint" style="margin-top:6px;">(외삽)은 파단 데이터의 최대 수명보다 긴 구간을 회귀식으로 연장한 값이라 참고용입니다. 피로한도 판정은 규격 절차(계단법 등)를 따르세요.</p>
        </div>`;
    }

    function matChartTabHtml(m) {
      const nums = matNumericCols(m);
      if (!m.rows.length || !nums.length) return matNeedDataHtml();
      const numNames = nums.map(i => m.columns[i]);
      const optHtml = (list, sel, emptyLabel) =>
        (emptyLabel ? `<option value="">${emptyLabel}</option>` : '') +
        list.map(c => `<option value="${escapeHtml(c)}" ${c === sel ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
      let html = '';

      if (m.testType === 'fatigue') {
        const groups = matFatiguePoints(m) || [];
        const anyRo = groups.some(g => g.pts.some(p => p.ro));
        const legend = (groups.length > 1 || anyRo) ? `
          <div class="legend">
            ${groups.length > 1 ? groups.map(g => `<span><i class="swatch" style="background:${matSeriesColor(g.idx)};"></i>${escapeHtml(g.name)}</span>`).join('') : ''}
            ${anyRo ? '<span><i class="swatch hollow"></i>→ 런아웃(미파단)</span>' : ''}
          </div>` : '';
        html += `
          <div class="block">
            <h3>S-N 선도 <small>Basquin 회귀선 · 런아웃 제외 후 회귀 · 회귀선은 데이터 범위 안에서만 표시</small></h3>
            <div class="inline-row" style="margin-bottom:10px;">
              <span class="hint" style="font-weight:600;">응력</span>
              <select class="select" style="width:auto; min-width:150px;" onchange="setMatFatigueCol('stressCol', this.value)">${optHtml(numNames, m.fatigue.stressCol, '(선택)')}</select>
              <span class="hint" style="font-weight:600;">수명</span>
              <select class="select" style="width:auto; min-width:150px;" onchange="setMatFatigueCol('cyclesCol', this.value)">${optHtml(numNames, m.fatigue.cyclesCol, '(선택)')}</select>
              <span class="hint" style="font-weight:600;">런아웃 표시 열</span>
              <select class="select" style="width:auto; min-width:150px;" onchange="setMatFatigueCol('runoutCol', this.value)">${optHtml(m.columns, m.fatigue.runoutCol, '(없음)')}</select>
              ${groups.length ? `<button class="btn sm" style="margin-left:auto;" onclick="downloadMatChart('matSnSvg')"><i class="fa-solid fa-image"></i> 그림 저장 (PNG)</button>` : ''}
            </div>
            ${legend}
            <div class="chart" onmousemove="tipMove(event)" onmouseleave="tipHide()">${matSNChartSvg(m, 'matSnSvg')}</div>
            <p class="hint" style="margin-top:6px;">런아웃 열에는 Y · O · 예 · 1 · 런아웃 · 미파단 중 하나로 적으면 인식합니다. 점에 마우스를 올리면 시편 정보가 보입니다.</p>
          </div>`;
      }

      const barCols = numNames.filter(c => m.testType !== 'fatigue' || (c !== m.fatigue.stressCol && c !== m.fatigue.cyclesCol));
      if (barCols.length) {
        const col = barCols.includes(matChartCol)
          ? matChartCol
          : (barCols.find(c => matSpecRange(m.specs[c]).has) || barCols[0]);
        html += `
          <div class="block">
            <h3>조건별 평균 비교 <small>막대 = 평균 · 세로선 = ±1 표준편차 · 점 = 개별 시편</small></h3>
            <div class="inline-row" style="margin-bottom:10px;">
              <span class="hint" style="font-weight:600;">항목</span>
              <select class="select" style="width:auto; min-width:150px;" onchange="setMatChartCol(this.value)">${optHtml(barCols, col)}</select>
              <button class="btn sm" style="margin-left:auto;" onclick="downloadMatChart('matBarSvg')"><i class="fa-solid fa-image"></i> 그림 저장 (PNG)</button>
            </div>
            <div class="chart" onmousemove="tipMove(event)" onmouseleave="tipHide()">${matBarChartSvg(m, col, 'matBarSvg')}</div>
            <p class="hint" style="margin-top:6px;">점선은 목표값이고, 빨간 점은 목표를 벗어난 시편입니다. 막대에 마우스를 올리면 통계가 보입니다.</p>
          </div>`;
      }
      return html;
    }

    function matRoundTopPath(x0, x1, top, bot, r) {
      const rr = Math.max(0, Math.min(r, (x1 - x0) / 2, bot - top));
      return `M${x0},${bot} L${x0},${top + rr} Q${x0},${top} ${x0 + rr},${top} L${x1 - rr},${top} Q${x1},${top} ${x1},${top + rr} L${x1},${bot} Z`;
    }

    function matSvgOpen(id, W, H, label) {
      return `<svg id="${id}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${escapeHtml(label)}" font-family="'Malgun Gothic','맑은 고딕',sans-serif">` +
        `<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`;
    }

    function matBarChartSvg(m, colName, svgId) {
      const ci = m.columns.indexOf(colName);
      const groups = matGroups(m)
        .map(g => ({ name: g.name, st: matStats(g.rows.map(r => matNum(r[ci]))) }))
        .filter(g => g.st.n);
      if (!groups.length) return '<p class="empty">이 항목에는 숫자 데이터가 없습니다.</p>';
      const unit = matUnit(colName);
      const spec = m.specs[colName] || {};
      const { lo, hi } = matSpecRange(spec);
      const vals = [0];
      groups.forEach(g => vals.push(g.st.max, g.st.min, g.st.mean + g.st.sd, g.st.mean - g.st.sd));
      if (!isNaN(lo)) vals.push(lo);
      if (!isNaN(hi)) vals.push(hi);
      const vMax = Math.max(...vals);
      const sc = matNiceTicks(Math.min(...vals), vMax + Math.abs(vMax) * 0.06, 5);
      const W = 700, H = 330, pl = 62, pr = 96, pt = 26, pb = 50;
      const iw = W - pl - pr, ih = H - pt - pb;
      const y = v => pt + ih - (v - sc.min) / (sc.max - sc.min) * ih;
      const bw = iw / groups.length;
      const barW = Math.min(64, bw * 0.46);
      const u = unit ? ' ' + unit : '';
      let s = matSvgOpen(svgId, W, H, `${matBase(colName)} 조건별 평균 막대 차트`);

      sc.ticks.forEach(t => {
        s += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="#eef2f7" stroke-width="1"/>`;
        s += `<text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#64748b">${+t.toFixed(6)}</text>`;
      });
      const y0 = y(Math.max(0, sc.min));
      s += `<line x1="${pl}" x2="${W - pr}" y1="${y0}" y2="${y0}" stroke="#cbd5e1" stroke-width="1"/>`;
      s += `<text transform="translate(16 ${pt + ih / 2}) rotate(-90)" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">${escapeHtml(matBase(colName) + (unit ? ` (${unit})` : ''))}</text>`;

      groups.forEach((g, i) => {
        const st = g.st;
        const cx = pl + bw * i + bw / 2;
        const x0 = cx - barW / 2, x1 = cx + barW / 2;
        const ym = y(st.mean);
        const j = matJudge(spec, st);
        const tip = [
          g.name,
          `평균 ${matFmt(st.mean)}${u}`,
          st.n > 1 ? `표준편차 ${matFmt(st.sd, st.mean)}${u}` : '',
          `최소 ${matFmt(st.min, st.mean)} · 최대 ${matFmt(st.max, st.mean)}`,
          `n = ${st.n}`,
          j ? `판정: ${{ pass: '전수 충족', partial: `평균 충족 · ${j.fails}개 이탈`, fail: '평균 미달' }[j.level]}` : ''
        ].filter(Boolean).join('\n');
        s += `<g data-tip="${escapeHtml(tip)}">`;
        s += `<rect x="${cx - bw / 2}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/>`;
        if (st.mean >= 0) s += `<path d="${matRoundTopPath(x0, x1, Math.min(ym, y0), y0, 4)}" fill="#0891b2"/>`;
        else s += `<rect x="${x0}" y="${y0}" width="${barW}" height="${Math.max(0, ym - y0)}" fill="#0891b2"/>`;
        if (st.n > 1 && st.sd > 0) {
          const ya = y(st.mean + st.sd), yb = y(st.mean - st.sd);
          s += `<line x1="${cx}" x2="${cx}" y1="${ya}" y2="${yb}" stroke="#1e293b" stroke-width="1.5"/>`;
          s += `<line x1="${cx - 6}" x2="${cx + 6}" y1="${ya}" y2="${ya}" stroke="#1e293b" stroke-width="1.5"/>`;
          s += `<line x1="${cx - 6}" x2="${cx + 6}" y1="${yb}" y2="${yb}" stroke="#1e293b" stroke-width="1.5"/>`;
        }
        st.values.forEach((v, k) => {
          const off = ((k % 5) - 2) * Math.min(7, barW / 9) + (k >= 5 ? 3 : 0);
          const bad = !matInSpec(spec, v);
          s += `<circle cx="${cx + barW / 2 + 10 + off}" cy="${y(v)}" r="3.2" fill="${bad ? '#dc2626' : '#ffffff'}" stroke="${bad ? '#ffffff' : '#1e3a8a'}" stroke-width="1.5"/>`;
        });
        if (groups.length <= 8) {
          const topY = y(Math.max(st.mean + st.sd, st.max)) - 8;
          s += `<text x="${cx}" y="${Math.max(pt - 6, topY)}" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" paint-order="stroke" stroke="#ffffff" stroke-width="3">${matFmt(st.mean)}</text>`;
        }
        const label = g.name.length > 12 ? g.name.slice(0, 11) + '…' : g.name;
        s += `<text x="${cx}" y="${H - pb + 18}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">${escapeHtml(label)}</text>`;
        s += `<text x="${cx}" y="${H - pb + 33}" text-anchor="middle" font-size="10" fill="#94a3b8">n=${st.n}</text>`;
        s += `</g>`;
      });

      [[lo, '≥'], [hi, '≤']].forEach(([v, sym]) => {
        if (isNaN(v)) return;
        s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="5 4"/>`;
        s += `<text x="${W - pr + 6}" y="${y(v) + 4}" text-anchor="start" font-size="11" font-weight="700" fill="#0f172a">목표 ${sym} ${v}${escapeHtml(u)}</text>`;
      });
      return s + '</svg>';
    }

    function matSNChartSvg(m, svgId) {
      const groups = matFatiguePoints(m);
      if (!groups) return '<p class="empty">위에서 응력 열과 수명 열을 선택하면 S-N 선도를 그립니다.</p>';
      if (!groups.length) return '<p class="empty">응력과 수명이 모두 0보다 큰 행이 없습니다.</p>';
      const all = groups.flatMap(g => g.pts);
      const lnMin = Math.floor(Math.log10(Math.min(...all.map(p => p.N))));
      const lnMax = Math.max(lnMin + 1, Math.ceil(Math.log10(Math.max(...all.map(p => p.N)) * 1.6)));
      const sMin = Math.min(...all.map(p => p.S)), sMax = Math.max(...all.map(p => p.S));
      const pad = (sMax - sMin) * 0.12 || sMax * 0.1;
      const sc = matNiceTicks(Math.max(0, sMin - pad), sMax + pad, 5);
      const unit = matUnit(m.fatigue.stressCol);
      const W = 680, H = 350, pl = 62, pr = 24, pt = 20, pb = 50;
      const iw = W - pl - pr, ih = H - pt - pb;
      const x = N => pl + (Math.log10(N) - lnMin) / (lnMax - lnMin) * iw;
      const y = S => pt + ih - (S - sc.min) / (sc.max - sc.min) * ih;
      let s = matSvgOpen(svgId, W, H, 'S-N 선도');

      for (let k = lnMin; k <= lnMax; k++) {
        if (k < lnMax) {
          for (let mm = 2; mm <= 9; mm++) {
            const xx = x(mm * Math.pow(10, k));
            s += `<line x1="${xx}" x2="${xx}" y1="${pt}" y2="${pt + ih}" stroke="#f5f7fa" stroke-width="1"/>`;
          }
        }
        s += `<line x1="${x(Math.pow(10, k))}" x2="${x(Math.pow(10, k))}" y1="${pt}" y2="${pt + ih}" stroke="#e2e8f0" stroke-width="1"/>`;
        s += `<text x="${x(Math.pow(10, k))}" y="${pt + ih + 18}" text-anchor="middle" font-size="11.5" fill="#64748b">10${matSup(k)}</text>`;
      }
      sc.ticks.forEach(t => {
        s += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="#eef2f7" stroke-width="1"/>`;
        s += `<text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#64748b">${+t.toFixed(6)}</text>`;
      });
      s += `<line x1="${pl}" x2="${W - pr}" y1="${pt + ih}" y2="${pt + ih}" stroke="#cbd5e1" stroke-width="1"/>`;
      s += `<text x="${pl + iw / 2}" y="${H - 8}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">${escapeHtml(matBase(m.fatigue.cyclesCol))} N (cycles, 로그 눈금)</text>`;
      s += `<text transform="translate(16 ${pt + ih / 2}) rotate(-90)" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">${escapeHtml(matBase(m.fatigue.stressCol) + (unit ? ` (${unit})` : ''))}</text>`;

      groups.forEach(g => {
        if (!g.fit) return;
        const col = matSeriesColor(g.idx);
        const a = Math.log10(g.fit.minN), b = Math.log10(g.fit.maxN);
        const ptsStr = Array.from({ length: 25 }, (_, i) => {
          const N = Math.pow(10, a + (b - a) * i / 24);
          return `${x(N).toFixed(1)},${y(g.fit.S(N)).toFixed(1)}`;
        }).join(' ');
        s += `<polyline points="${ptsStr}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
      });
      groups.forEach(g => {
        const col = matSeriesColor(g.idx);
        g.pts.forEach(p => {
          const cx = x(p.N), cy = y(p.S);
          const tip = [`${g.name}${p.id ? ' · ' + p.id : ''}`, `응력 ${matFmt(p.S)}${unit ? ' ' + unit : ''}`, `수명 ${p.N.toLocaleString('ko-KR')} cycles`, p.ro ? '런아웃 (미파단)' : '파단'].join('\n');
          s += `<g data-tip="${escapeHtml(tip)}">`;
          s += `<circle cx="${cx}" cy="${cy}" r="11" fill="transparent"/>`;
          if (p.ro) {
            s += `<line x1="${cx + 6}" x2="${cx + 17}" y1="${cy}" y2="${cy}" stroke="${col}" stroke-width="1.5"/>`;
            s += `<polyline points="${cx + 13},${cy - 3.5} ${cx + 17},${cy} ${cx + 13},${cy + 3.5}" fill="none" stroke="${col}" stroke-width="1.5"/>`;
            s += `<circle cx="${cx}" cy="${cy}" r="5" fill="#ffffff" stroke="${col}" stroke-width="2"/>`;
          } else {
            s += `<circle cx="${cx}" cy="${cy}" r="5" fill="${col}" stroke="#ffffff" stroke-width="2"/>`;
          }
          s += `</g>`;
        });
      });
      return s + '</svg>';
    }

    function matTipMove(e) {
      const tip = document.getElementById('matTip');
      if (!tip) return;
      const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
      if (!t) {
        tip.classList.remove('show');
        return;
      }
      tip.textContent = t.getAttribute('data-tip');
      tip.classList.add('show');
      const xPos = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
      const yPos = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
      tip.style.left = xPos + 'px';
      tip.style.top = yPos + 'px';
    }

    function tipHide() {
      const tip = document.getElementById('matTip');
      if (tip) tip.classList.remove('show');
    }

    // ---- 보고서 ----
    function matBuildReport(m) {
      const nums = matNumericCols(m);
      const groups = matGroups(m);
      const multi = groups.length > 1;
      const type = MAT_TEST_TYPES[m.testType] || MAT_TEST_TYPES.custom;
      const isFatigue = m.testType === 'fatigue';
      const L = [];
      L.push(`[시험 결과 요약] ${m.name}`);
      L.push('• 시험 개요');
      L.push(`  - 시험 종류: ${type.label}${m.standard ? ` / 규격: ${m.standard}` : ''}`);
      if (m.testDate) L.push(`  - 시험 일자: ${m.testDate}`);
      if (m.alloy) L.push(`  - 소재: ${m.alloy}`);
      L.push(`  - 시편 수: ${m.rows.length}개${multi ? ` / 비교 조건: ${groups.length}개 (${groups.map(g => g.name).join(', ')})` : ''}`);

      const cols = nums.map(ci => {
        const name = m.columns[ci];
        return {
          name, base: matBase(name), unit: matUnit(name), spec: m.specs[name] || {},
          per: groups.map(g => ({ g: g.name, st: matStats(g.rows.map(r => matNum(r[ci]))) }))
        };
      }).filter(c => !isFatigue || (c.name !== m.fatigue.stressCol && c.name !== m.fatigue.cyclesCol));

      if (cols.length) {
        L.push(`• ${multi ? '조건별 결과' : '시험 결과'} (평균 ± 표준편차)`);
        groups.forEach((g, gi) => {
          const parts = cols.map(c => {
            const st = c.per[gi].st;
            if (!st.n) return null;
            return `${c.base} ${matFmt(st.mean)}${st.n > 1 ? ' ± ' + matFmt(st.sd, st.mean) : ''}${c.unit ? ' ' + c.unit : ''}`;
          }).filter(Boolean);
          if (parts.length) L.push(`  - ${multi ? g.name + ': ' : ''}${parts.join(', ')} (n=${g.rows.length})`);
        });
      }

      const specCols = cols.filter(c => matSpecRange(c.spec).has);
      if (specCols.length) {
        L.push('• 목표 대비 판정');
        specCols.forEach(c => {
          const js = c.per.map(p => ({ g: p.g, st: p.st, j: matJudge(c.spec, p.st) })).filter(x => x.j);
          const pre = (g) => multi ? g + ' ' : '';
          const segs = [];
          const pass = js.filter(x => x.j.level === 'pass');
          if (pass.length) segs.push(`${multi ? pass.map(x => x.g).join('·') + ' ' : ''}전수 충족`);
          js.filter(x => x.j.level === 'partial').forEach(x => segs.push(`${pre(x.g)}평균 충족이나 ${x.j.fails}개 시편 이탈`));
          js.filter(x => x.j.level === 'fail').forEach(x => segs.push(`${pre(x.g)}평균 미달(${matFmt(x.st.mean)}${c.unit ? ' ' + c.unit : ''})`));
          L.push(`  - ${c.base} (목표 ${matSpecLabel(c.spec, c.unit)}): ${segs.join(', ')}`);
        });
      }

      if (multi && cols.length) {
        const cmp = [];
        cols.slice(0, 5).forEach(c => {
          const valid = c.per.filter(p => p.st.n);
          if (valid.length < 2) return;
          const best = valid.reduce((a, b) => b.st.mean > a.st.mean ? b : a);
          const worst = valid.reduce((a, b) => b.st.mean < a.st.mean ? b : a);
          const diff = best.st.mean - worst.st.mean;
          const du = c.unit === '%' ? ' %p' : (c.unit ? ' ' + c.unit : '');
          const pct = worst.st.mean ? ` (+${(diff / Math.abs(worst.st.mean) * 100).toFixed(1)}%)` : '';
          cmp.push(`  - ${c.base}: 최고 ${best.g} ${matFmt(best.st.mean)}${c.unit ? ' ' + c.unit : ''}, 최저 ${worst.g} 대비 +${matFmt(diff, best.st.mean)}${du}${pct}`);
        });
        if (cmp.length) {
          L.push('• 조건 비교');
          cmp.forEach(x => L.push(x));
        }
      }

      const fg = isFatigue ? matFatiguePoints(m) : null;
      if (fg && fg.length) {
        const unit = matUnit(m.fatigue.stressCol) || 'MPa';
        L.push('• 피로 특성 (S-N, Basquin 근사 σa = A·N^b)');
        fg.forEach(g => {
          const ro = g.pts.filter(p => p.ro).length;
          const head = multi ? g.name + ': ' : '';
          if (!g.fit) {
            L.push(`  - ${head}파단 데이터 3점 미만으로 회귀 생략 (파단 ${g.pts.length - ro}점, 런아웃 ${ro}점)`);
            return;
          }
          L.push(`  - ${head}A = ${matFmt(g.fit.A)} ${unit}, b = ${g.fit.b.toFixed(4)}, R² = ${g.fit.r2.toFixed(3)} (파단 ${g.fit.n}점, 런아웃 ${ro}점)`);
          L.push(`    · 10⁷ cycle 추정 피로강도 약 ${matFmt(g.fit.S(1e7))} ${unit}${1e7 > g.fit.maxN ? ' (데이터 범위 밖 외삽값, 참고용)' : ''}`);
        });
      }

      if (m.memo && m.memo.trim()) {
        L.push('• 비고');
        m.memo.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => L.push(`  - ${x}`));
      }

      // 결과표 (탭 구분: 엑셀·한글에 표로 붙여넣기)
      let table;
      if (fg && fg.length && !cols.length) {
        const unit = matUnit(m.fatigue.stressCol) || 'MPa';
        table = [['조건', '파단(점)', '런아웃(점)', `A (${unit})`, 'b', 'R²', `10^7 cycle 추정 강도 (${unit})`]];
        fg.forEach(g => {
          const ro = g.pts.filter(p => p.ro).length;
          table.push([g.name, String(g.pts.length - ro), String(ro),
            g.fit ? matFmt(g.fit.A) : '-', g.fit ? g.fit.b.toFixed(4) : '-', g.fit ? g.fit.r2.toFixed(3) : '-',
            g.fit ? matFmt(g.fit.S(1e7)) + (1e7 > g.fit.maxN ? ' (외삽)' : '') : '-']);
        });
      } else {
        const head = [multi ? '조건' : '구분', 'n'];
        cols.forEach(c => {
          head.push(`${c.base} 평균${c.unit ? ` (${c.unit})` : ''}`, `${c.base} 표준편차`);
          if (matSpecRange(c.spec).has) head.push(`${c.base} 판정`);
        });
        table = [head];
        groups.forEach((g, gi) => {
          const row = [g.name, String(g.rows.length)];
          cols.forEach(c => {
            const st = c.per[gi].st;
            row.push(matFmt(st.mean), st.n > 1 ? matFmt(st.sd, st.mean) : '-');
            if (matSpecRange(c.spec).has) {
              const j = matJudge(c.spec, st);
              row.push(j ? { pass: '충족', partial: '일부 이탈', fail: '미달' }[j.level] : '-');
            }
          });
          table.push(row);
        });
      }
      return { text: L.join('\n'), table };
    }

    function matReportTabHtml(m) {
      if (!m.rows.length || !matNumericCols(m).length) return matNeedDataHtml();
      const r = matBuildReport(m);
      return `
        <div class="block">
          <h3>보고서 문구 <small>개조식 · 여기서 바로 고친 뒤 복사 · 보고서 모듈에서는 원본 데이터로 다시 생성</small></h3>
          <textarea id="matReportText" class="textarea paste" rows="16" spellcheck="false">${escapeHtml(r.text)}</textarea>
          <div class="inline-row" style="margin-top:8px;">
            <button class="btn primary sm" onclick="copyMatReport('text')"><i class="fa-regular fa-copy"></i> 문구 복사</button>
            <button class="btn sm" onclick="copyMatReport('table')"><i class="fa-solid fa-table"></i> 결과표 복사 (엑셀·한글용)</button>
            <button class="btn sm" style="margin-left:auto;" onclick="addToReport('tests', '${m.id}')"><i class="fa-solid fa-file-circle-plus"></i> 보고서에 넣기</button>
          </div>
          <p class="hint" style="margin-top:6px;">판정은 입력한 목표값과의 단순 비교입니다. 공식 판정은 시험성적서와 해당 규격의 절차를 따르세요.</p>
        </div>
        <div class="block">
          <h3>결과표 미리보기</h3>
          <div class="tbl-wrap" style="max-height:none;">
            <table class="tbl">
              <thead><tr>${r.table[0].map((h, i) => `<th class="${i ? 'num' : ''}">${escapeHtml(h)}</th>`).join('')}</tr></thead>
              <tbody>${r.table.slice(1).map(row => `<tr>${row.map((v, i) => `<td class="${i ? 'num' : ''}">${escapeHtml(v)}</td>`).join('')}</tr>`).join('')}</tbody>

    function createMaterialSet(preset) {
      const m = normalizeMaterialSet({ name: '새 시험 데이터', testType: 'tensile', standard: MAT_TEST_TYPES.tensile.std, ...(preset || {}) });
      DB.tests.unshift(m);

    function updateMatField(field, value) {
      const m = activeMaterial();
      if (!m) return;
      if (field === 'name') value = String(value || '').trim() || '이름 없는 시험 데이터';
      else if (typeof value === 'string' && field !== 'memo') value = value.trim();
      const prevType = m.testType;
      m[field] = value;
      if (field === 'testType') {
        const prevStd = (MAT_TEST_TYPES[prevType] || {}).std;
        if (!m.standard || m.standard === prevStd) m.standard = (MAT_TEST_TYPES[value] || {}).std || '';
        if (value === 'fatigue') matGuessFatigue(m);
      }
      touchMaterial(m);
      saveData();
      renderMaterial();
    }

    function matUniqueHeaders(headers) {
      const seen = {};
      return headers.map((h, i) => {
        let name = String(h || '').trim() || `열${i + 1}`;
        if (seen[name]) {
          seen[name]++;
          name = `${name}_${seen[name]}`;
        } else seen[name] = 1;
        return name;
      });
    }

    function applyMatText(m, text, mode, sourceLabel) {
      const parsed = parseDelimited(text);
      if (!parsed.length) {
        showToast('붙여넣은 내용이 비어 있습니다.');
        return false;
      }
      if (mode === 'append' && m.columns.length) {
        let rows = parsed;
        const first = rows[0];
        const sameHeader = first.length >= m.columns.length && m.columns.every((c, i) => first[i] === c);
        if (sameHeader) rows = rows.slice(1);
        else if (first.every(c => isNaN(matNum(c))) && matNumericCols(m).length && rows.length > 1 && first.length === m.columns.length) {
          showToast('첫 줄이 기존 머리글과 다릅니다. 같은 열 순서의 데이터만 붙여넣거나 "바꾸기"를 사용해 주세요.');
          return false;
        }
        if (!rows.length) {
          showToast('추가할 데이터 행이 없습니다.');
          return false;
        }
        m.rows = m.rows.concat(rows.map(r => m.columns.map((_, i) => r[i] || '')));
        touchMaterial(m);
        saveData();
        renderMaterial();
        showToast(`${rows.length}행을 추가했습니다. (전체 ${m.rows.length}행)`);
        return true;
      }
      if (parsed.length < 2) {
        showToast('머리글 1줄과 데이터 1줄 이상이 필요합니다.');
        return false;
      }
      const width = Math.max(...parsed.map(r => r.length));
      const headers = matUniqueHeaders(Array.from({ length: width }, (_, i) => parsed[0][i]));
      m.columns = headers;
      m.rows = parsed.slice(1).map(r => headers.map((_, i) => r[i] || ''));
      Object.keys(m.specs).forEach(k => { if (!headers.includes(k)) delete m.specs[k]; });
      m.groupCol = matGuessGroupCol(m);
      matGuessFatigue(m);
      matChartCol = '';
      touchMaterial(m);
      saveData();
      renderMaterial();
      const g = matGroups(m).length;
      showToast(`${sourceLabel || ''}${m.rows.length}행 · 열 ${headers.length}개를 불러왔습니다. 숫자 열 ${matNumericCols(m).length}개${m.groupCol ? ` · 조건 '${m.groupCol}' ${g}개` : ''}`);
      return true;
    }

    function applyMatPaste(mode) {
      const m = activeMaterial();
      const ta = document.getElementById('matPasteInput');
      if (!m || !ta) return;
      const text = ta.value;
      if (!text.trim()) {
        showToast('엑셀에서 복사한 표를 먼저 붙여넣어 주세요.');
        ta.focus();
        return;
      }
      if (mode === 'replace' && m.rows.length) {
        askConfirm(`기존 데이터 ${m.rows.length}행을 붙여넣은 내용으로 바꿉니다. 계속하시겠습니까? (같은 이름 열의 목표값은 유지)`,
          () => applyMatText(m, text, 'replace'), { okLabel: '바꾸기' });
        return;
      }
      applyMatText(m, text, mode);
    }

    async function handleMatCsv(e) {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      let text = '';
      try {
        const buf = await file.arrayBuffer();
        text = new TextDecoder('utf-8').decode(buf);
        // 한글 엑셀에서 저장한 CSV(CP949)는 UTF-8로 읽으면 글자가 깨진다
        if (text.includes('�')) {
          try { text = new TextDecoder('euc-kr').decode(buf); } catch (err) {}
        }
      } catch (err) {
        showToast('파일을 읽지 못했습니다.');
        return;
      }
      let m = activeMaterial();
      const baseName = file.name.replace(/\.[^.]+$/, '');
      if (!m) m = createMaterialSet({ name: baseName });
      const run = () => {
        if (applyMatText(m, text, 'replace', `'${file.name}' `) && m.name === '새 시험 데이터') {
          m.name = baseName;
          saveData();
          renderMaterial();
        }
      };
      if (m.rows.length) askConfirm(`기존 데이터 ${m.rows.length}행을 '${file.name}' 내용으로 바꿉니다. 계속하시겠습니까?`, run, { okLabel: '바꾸기' });
      else run();
    }

    function downloadMatChart(svgId) {
      const svg = document.getElementById(svgId);
      const m = activeMaterial();
      if (!svg) return;
      const vb = svg.viewBox.baseVal;
      const w = vb.width, h = vb.height;
      const clone = svg.cloneNode(true);
      clone.setAttribute('width', w);
      clone.setAttribute('height', h);
      const xml = new XMLSerializer().serializeToString(clone);
      const img = new Image();
      img.onload = () => {
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = w * scale;
        canvas.height = h * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if (!blob) {
            showToast('그림 저장에 실패했습니다.');
            return;
          }
          const base = ((m ? m.name : '차트') + (svgId === 'matSnSvg' ? '_S-N선도' : '_' + matBase(matChartCol || '평균비교')))
            .replace(/[\\/:*?"<>|]/g, '_');
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${base}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          showToast('차트를 PNG 그림으로 저장했습니다. 보고서에 바로 붙일 수 있습니다.');
        }, 'image/png');
      };
      img.onerror = () => showToast('그림 저장에 실패했습니다.');
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    }

    // 예시 데이터 (기능 확인용 가상 수치 · 실제 시험 결과 아님)
    function loadMaterialSample(kind) {
      let preset;
      if (kind === 'fatigue') {
        const rows = [];
        const conds = [['기준 조건', 1000], ['개선 조건', 1090]];
        const stresses = [[300, 280, 260, 240, 220, 205, 190], [315, 295, 275, 255, 235, 220, 210]];
        const scatter = [0.8, 1.25, 0.9, 1.15, 0.85, 1.1, 1.0];
        let no = 1;
        conds.forEach(([cond, A], ci) => {
          stresses[ci].forEach((S, k) => {
            let N = Math.pow(S / A, 1 / -0.1) * scatter[(k + ci * 3) % scatter.length];
            const ro = N > 1e7;
            if (ro) N = 1e7;
            const mag = Math.pow(10, Math.floor(Math.log10(N)) - 2);
            rows.push([`F-${String(no++).padStart(2, '0')}`, cond, String(S), String(Math.round(N / mag) * mag), ro ? 'Y' : '']);
          });
        });
        preset = {
          name: '[예시] 피로시험 — S-N 선도', testType: 'fatigue', alloy: '알루미늄 단조재 (가상 데이터)', standard: MAT_TEST_TYPES.fatigue.std,
          columns: MAT_TEST_TYPES.fatigue.headers.slice(), rows, groupCol: '조건',
          fatigue: { stressCol: '응력진폭(MPa)', cyclesCol: '수명(cycles)', runoutCol: '런아웃' },
          memo: '기능 확인용 가상 데이터임 (실제 시험 결과 아님)\n응력비 R = -1, 상온'
        };
      } else {
        const base = { 'T5': [258, 298, 14.2], 'T6-A': [305, 340, 11.8], 'T6-B': [318, 352, 10.4] };
        const dev = [[-2.1, -3.4, 0.5], [1.4, 2.2, -0.3], [-0.6, 0.8, 0.6], [2.5, 3.1, -0.9], [-1.2, -2.7, 0.1]];
        const rows = [];
        let no = 1;
        const spread = { 'T5': 1.4, 'T6-A': 0.8, 'T6-B': 1.1 };
        Object.keys(base).forEach((cond, ci) => dev.forEach((_, k) => {
          const [ys, uts, el] = base[cond];
          const d = dev[(k + ci * 2) % dev.length].map(x => x * spread[cond]);
          rows.push([`S-${String(no++).padStart(2, '0')}`, cond, (ys + d[0]).toFixed(1), (uts + d[1]).toFixed(1), (el + d[2]).toFixed(1)]);
        }));
        preset = {
          name: '[예시] 인장시험 — 열처리 조건 비교', testType: 'tensile', alloy: '알루미늄 단조재 (가상 데이터)', standard: MAT_TEST_TYPES.tensile.std,
          columns: MAT_TEST_TYPES.tensile.headers.slice(), rows, groupCol: '조건',
          specs: { '항복강도(MPa)': { min: '275', max: '' }, '인장강도(MPa)': { min: '310', max: '' }, '연신율(%)': { min: '10', max: '' } },
          memo: '기능 확인용 가상 데이터임 (실제 시험 결과 아님)'
        };
      }
      createMaterialSet(preset);
      matTab = 'stats';
      renderMaterial();
      showToast('예시 데이터를 불러왔습니다. 통계·차트·보고서 탭을 눌러 확인해 보세요. (가상 수치)');
    }

      };

    function normalizeImg(im) {
      return {
        name: '이미지',
        w: 0, h: 0,
        calib: null,
        ...im,
        id: im.id || genId('img'),

    // ---- 기하 · 단위 ----
    function dist(a, b) {
      return Math.hypot(a[0] - b[0], a[1] - b[1]);
    }

    function polyArea(pts) {
      let s = 0;
      for (let i = 0; i < pts.length; i++) {
        const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
        s += x1 * y2 - x2 * y1;
      }
      return Math.abs(s) / 2;
    }

    function polyPerim(pts) {
      let s = 0;
      for (let i = 0; i < pts.length; i++) s += dist(pts[i], pts[(i + 1) % pts.length]);
      return s;
    }

    function toMm(v, unit) {
      return unit === 'mm' ? v : unit === 'nm' ? v / 1e6 : v / 1000;
    }

    function fmtLen(img, px) {
      if (!img.calib) return `${px.toFixed(0)} px`;
      const v = px / img.calib.pxPerUnit;
      return `${fmtSig(v)} ${img.calib.unit}`;
    }

    function fmtArea(img, px2) {
      if (!img.calib) return `${fmtSig(px2)} px²`;
      const v = px2 / (img.calib.pxPerUnit ** 2);
      return `${fmtSig(v)} ${img.calib.unit}²`;
    }

    function fmtSig(v) {
      if (!isFinite(v)) return '-';
      const a = Math.abs(v);
      if (a >= 1e6) return v.toExponential(2);
      if (a >= 100) return v.toFixed(0);
      if (a >= 10) return v.toFixed(1);
      if (a >= 1) return v.toFixed(2);
      return v.toPrecision(3);
    }

    function annoValue(img, a) {
      if (a.type === 'line' || a.type === 'testline') return fmtLen(img, dist(a.pts[0], a.pts[1]));
      if (a.type === 'poly') return fmtArea(img, polyArea(a.pts));
      return '';
    }

    function annoNumber(img, a) {
      const same = img.annos.filter(x => x.type === a.type);
      return same.indexOf(a) + 1;
    }

    function annoPrefix(type) {
      return { line: 'L', poly: 'A', marker: 'M', testline: 'T', icept: 'P' }[type] || '';
    }

    // ---- 결과 계산 ----
    // 95% 신뢰구간용 t 값 (자유도 1~30)
    const T95 = [12.706, 4.303, 3.182, 2.776, 2.571, 2.447, 2.365, 2.306, 2.262, 2.228, 2.201, 2.179, 2.160, 2.145, 2.131, 2.120, 2.110, 2.101, 2.093, 2.086, 2.080, 2.074, 2.069, 2.064, 2.060, 2.056, 2.052, 2.048, 2.045, 2.042];

    function imgMicroResult(img) {
      const tl = img.annos.filter(a => a.type === 'testline');
      const P = img.annos.filter(a => a.type === 'icept').length;
      const Lpx = tl.reduce((s, a) => s + dist(a.pts[0], a.pts[1]), 0);
      const Lmm = img.calib && Lpx ? toMm(Lpx / img.calib.pxPerUnit, img.calib.unit) : null;
      const ell = Lmm && P ? Lmm / P : null;
      const total = img.grid.n ? img.grid.n * img.grid.n : 0;
      return {
        lines: tl.length, Lpx, Lmm, P, ell,
        G: ell ? grainSizeG(ell) : null,
        gridTotal: total, gridHits: img.grid.hits.length,
        pointFrac: total ? img.grid.hits.length / total * 100 : null,
        thrFrac: img.thr.fraction
      };
    }

    // ASTM E112 절편법: G = -6.643856·log10(ℓ[mm]) - 3.288
    function grainSizeG(ellMm) {
      return -6.643856 * Math.log10(ellMm) - 3.288;
    }

    function recMicroResult(rec) {
      const per = rec.images.map(im => ({ im, r: imgMicroResult(im) }));
      const withL = per.filter(x => x.r.Lmm && x.r.P);
      const sumL = withL.reduce((s, x) => s + x.r.Lmm, 0);
      const sumP = withL.reduce((s, x) => s + x.r.P, 0);
      const ell = sumP ? sumL / sumP : null;
      const pf = per.filter(x => x.r.pointFrac !== null).map(x => x.r.pointFrac);
      const pfMean = pf.length ? pf.reduce((a, b) => a + b, 0) / pf.length : null;
      const pfSd = pf.length > 1 ? Math.sqrt(pf.reduce((a, b) => a + (b - pfMean) ** 2, 0) / (pf.length - 1)) : null;
      const ci = pfSd !== null ? (T95[Math.min(pf.length - 1, T95.length) - 1] || 1.96) * pfSd / Math.sqrt(pf.length) : null;
      const tf = per.filter(x => x.r.thrFrac !== null && x.r.thrFrac !== undefined).map(x => x.r.thrFrac);
      return {
        per, ell, G: ell ? grainSizeG(ell) : null, P: sumP, Lmm: sumL, lineImgs: withL.length,
        uncalibratedLines: per.some(x => x.r.lines && !x.im.calib),
        pf, pfMean, pfSd, ci, ra: ci !== null && pfMean ? ci / pfMean * 100 : null,
        tf, tfMean: tf.length ? tf.reduce((a, b) => a + b, 0) / tf.length : null
      };
    }

    function microSummaryShort(rec) {
      const r = recMicroResult(rec);
      return r.G !== null ? ` · G ${r.G.toFixed(1)}` : (r.pfMean !== null ? ` · 상분율 ${r.pfMean.toFixed(1)}%` : '');
    }

    function fractoAreaResult(rec) {
      const sums = {};
      rec.images.forEach(im => im.annos.filter(a => a.type === 'poly').forEach(a => {
        const k = a.kind || '기타 영역';
        if (!sums[k]) sums[k] = { px: 0, mm2: 0, calibrated: true, count: 0 };
        const px = polyArea(a.pts);
        sums[k].px += px;
        sums[k].count++;
        if (im.calib) sums[k].mm2 += toMm(1, im.calib.unit) ** 2 * px / (im.calib.pxPerUnit ** 2);
        else sums[k].calibrated = false;
      }));
      const fat = sums['피로 진전 영역'], fin = sums['최종 파단 영역'], sh = sums['전단립 영역'];
      let ratio = null;
      if (fat && (fin || sh)) {
        // 같은 이미지 안에서 그린 경우를 전제로 px 면적 비율 사용
        const tot = fat.px + (fin ? fin.px : 0) + (sh ? sh.px : 0);
        ratio = tot ? fat.px / tot * 100 : null;
      }
      return { sums, ratio };
    }

    function markerCounts(rec) {
      const c = {};
      rec.images.forEach(im => im.annos.filter(a => a.type === 'marker').forEach(a => { c[a.kind || '기타'] = (c[a.kind || '기타'] || 0) + 1; }));
