      const sideEl = document.querySelector('.side-stack');
      const keepSide = sideEl ? sideEl.scrollTop : 0;
      main.innerHTML = `
        <div class="bench three">
          ${list}
          <section style="min-width:0; display:flex; flex-direction:column; gap:12px;">
            <div class="panel"><div class="panel-body" style="padding:12px 14px;">
              <div class="row" style="margin-bottom:10px; flex-wrap:nowrap;">
                <input class="input" style="font-weight:700; font-size:14px; flex:1;" value="${escapeHtml(rec.name)}" onchange="updateRec('${kind}', 'name', this.value)">
                <button class="btn sm" onclick="addToReport('${kind}', '${rec.id}')" title="보고서에 넣기"><i class="fa-solid fa-file-circle-plus"></i> 보고서에</button>
                <button class="btn sm danger" onclick="deleteImageRecord('${kind}', '${rec.id}')" title="기록 삭제"><i class="fa-regular fa-trash-can"></i></button>
              </div>
              <div class="grid-3" style="grid-template-columns:repeat(${kind === 'fracto' ? 4 : 3}, minmax(0,1fr));">
                ${M.fields.map(([k, label, type, ph]) => `<div class="field"><label>${label}</label>${type === 'select'
                  ? `<select class="select" onchange="updateRecField('${kind}', '${k}', this.value)">${ph.map(o => `<option value="${escapeHtml(o)}" ${o === (rec.fields[k] || '') ? 'selected' : ''}>${o || '(선택)'}</option>`).join('')}</select>`
                  : `<input class="input" value="${escapeHtml(rec.fields[k] || '')}" placeholder="${escapeHtml(ph)}" onchange="updateRecField('${kind}', '${k}', this.value)">`}</div>`).join('')}
              </div>
            </div></div>
            <div class="panel"><div class="panel-body" style="padding:12px;">
              <div class="img-strip">
                ${rec.images.map(im => `<div class="thumb ${img && im.id === img.id ? 'active' : ''}" onclick="selectImg('${kind}', '${im.id}')" title="${escapeHtml(im.name)}"><img data-img-id="${im.id}" ${imgUrlCache.has(im.id) ? `src="${imgUrlCache.get(im.id)}"` : ''} alt=""><span>${escapeHtml(im.name)}</span></div>`).join('')}
                <div class="thumb add" onclick="pickImages('${kind}')"><i class="fa-solid fa-plus"></i>이미지 추가</div>
              </div>
              ${img ? viewerHtml(kind, img) : `<div class="empty" style="padding:40px 16px;">이미지를 추가하세요. 여러 장(관찰 필드)을 올릴 수 있고, 이미지마다 스케일 보정과 측정이 따로 저장됩니다.<br><br><button class="btn primary" onclick="pickImages('${kind}')"><i class="fa-solid fa-image"></i> 이미지 선택</button></div>`}
            </div></div>
          </section>
          <aside class="side-stack">
            <div class="side-tabs">
              ${[['ai', 'fa-comments', 'AI 상담'], ['measure', 'fa-ruler-combined', '측정'], ['judge', 'fa-clipboard-check', kind === 'fracto' ? '판정·소견' : '특징·소견']].map(([k, ic, lb]) =>
                `<button class="${sideTab(kind) === k ? 'on' : ''}" onclick="setSideTab('${kind}', '${k}')"><i class="fa-solid ${ic}"></i> ${lb}${k === 'ai' && chatState.busy === rec.id ? ' <span class="dot-live"></span>' : ''}</button>`).join('')}
            </div>
            ${sideTab(kind) === 'ai' ? chatPanelHtml(kind, rec, { maxH: 'calc(100vh - 360px)' }) : ''}
            ${sideTab(kind) === 'measure' ? (img ? measurePanelHtml(kind, rec, img) + (kind === 'micro' ? thresholdPanelHtml(img) : '') : '<div class="empty">이미지를 추가하면 측정 결과가 여기에 표시됩니다.</div>') : ''}
            ${sideTab(kind) === 'judge' ? judgePanelHtml(kind, rec) : ''}
          </aside>
        </div>`;
      const v = document.getElementById('viewer');
      if (v && keepScroll) {
        v.scrollLeft = keepScroll[0];
        v.scrollTop = keepScroll[1];
      }
      const side = document.querySelector('.side-stack');
      if (side) side.scrollTop = keepSide;
      scrollChat();
      hydrateImages(kind);
      maybeAutoChat(kind);
    }

    async function hydrateImages(kind) {
      const nodes = document.querySelectorAll('img[data-img-id]');
      for (const n of nodes) {
        if (n.getAttribute('src')) continue;
        const url = await imageUrl(n.getAttribute('data-img-id'));
        if (url) n.src = url;
      }
      const vimg = document.getElementById('vimg');
      if (vimg && !vimg.getAttribute('href')) {
        const url = await imageUrl(vimg.getAttribute('data-id'));
        if (url) vimg.setAttribute('href', url);
        else document.getElementById('vstatusGuide').textContent = '이미지 원본이 이 브라우저에 없습니다. 백업 가져오기로 복원하세요.';
      }
      const rec = moduleRec(kind);
      const img = rec && activeImg(kind, rec);
      if (kind === 'micro' && img && img.thr.on) updateThresholdMask(img, false);
    }

    function viewerHtml(kind, img) {
      const M = IMG_MODULES[kind];
      const tools = M.tools.map(t => `<button class="vtool ${ui.tool === t ? 'active' : ''}" onclick="setTool('${t}')" title="${TOOL_DEF[t][2]}"><i class="fa-solid ${TOOL_DEF[t][0]}"></i> ${TOOL_DEF[t][1]}</button>`).join('');
      const calibText = img.calib ? `1 ${img.calib.unit} = ${fmtSig(img.calib.pxPerUnit)} px` : '미보정 (px 단위)';
      return `
        <div class="viewer-box">
          <div class="vtools">
            ${tools}
            <span class="vtool-sep"></span>
            <button class="vtool" onclick="zoomBy(1/1.4)" title="축소"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            <span class="vzoom" id="vzoom">${Math.round(ui.zoom * 100)}%</span>
            <button class="vtool" onclick="zoomBy(1.4)" title="확대"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
            <button class="vtool" onclick="setZoom(1)" title="화면 맞춤"><i class="fa-solid fa-expand"></i></button>
            <span class="spacer"></span>
            <button class="vtool" onclick="downloadAnnotated('${kind}')" title="주석·스케일 바를 넣은 PNG 저장"><i class="fa-solid fa-download"></i> PNG</button>
            <button class="vtool" onclick="removeImage('${kind}')" title="이 이미지 삭제"><i class="fa-regular fa-trash-can"></i></button>
          </div>
          <div class="viewer ${ui.tool !== 'select' ? 'tool-on' : ''}" id="viewer" data-img-id="${img.id}">
            <div class="viewer-stage" id="vstage" style="width:${ui.zoom * 100}%;">
              <svg id="vsvg" viewBox="0 0 ${img.w} ${img.h}" preserveAspectRatio="xMidYMid meet"
                   onclick="viewerClick(event)" ondblclick="viewerDbl(event)" onmousemove="viewerMove(event)">
                <image id="vimg" data-id="${img.id}" ${imgUrlCache.has(img.id) ? `href="${imgUrlCache.get(img.id)}"` : ''} x="0" y="0" width="${img.w}" height="${img.h}" preserveAspectRatio="none"/>
                <image id="vmask" x="0" y="0" width="${img.w}" height="${img.h}" preserveAspectRatio="none" style="pointer-events:none;"/>
                <g id="vanno">${annoSvg(img, kind)}</g>
                <g id="vtemp" style="pointer-events:none;"></g>
              </svg>
            </div>
          </div>
          <div class="vstatus">
            <span>크기 <b>${img.w}×${img.h}</b></span>
            <span>보정 <b>${calibText}</b></span>
            <span>좌표 <b id="vxy">-</b></span>
            <span class="guide" id="vstatusGuide">${TOOL_DEF[ui.tool][2]}</span>
          </div>
        </div>`;
    }

    function annoUnit(img) {
      return Math.max(img.w, img.h) / 700;
    }

    function annoSvg(img, kind) {
      const u = annoUnit(img);
      const fs = 13 * u;
      const halo = `paint-order="stroke" stroke="#000" stroke-width="${3 * u}" stroke-linejoin="round"`;
      let s = '';
      if (img.calib && img.calib.pts) {
        const [a, b] = img.calib.pts;
        s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${ANNO_COLORS.calib}" stroke-width="${1.5 * u}" stroke-dasharray="${6 * u} ${4 * u}" opacity="0.8"/>`;
      }
      if (img.grid.n) {
        const n = img.grid.n;
        const hits = new Set(img.grid.hits);
        for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
          const idx = j * n + i;
          const x = (i + 0.5) / n * img.w, y = (j + 0.5) / n * img.h;
          const r = 5 * u;
          if (hits.has(idx)) s += `<circle cx="${x}" cy="${y}" r="${r}" fill="#22d3ee" stroke="#000" stroke-width="${1.2 * u}"/>`;
          else s += `<path d="M${x - r},${y} H${x + r} M${x},${y - r} V${y + r}" stroke="#ffffff" stroke-width="${1.3 * u}" opacity="0.85"/>`;
        }
      }
      img.annos.forEach(a => {
        const sel = ui.sel === a.id;
        const col = ANNO_COLORS[a.type] || '#fff';
        const sw = (sel ? 3 : 2) * u;
        const no = `${annoPrefix(a.type)}${annoNumber(img, a)}`;
        s += `<g data-aid="${a.id}" style="cursor:pointer;">`;
        if (a.type === 'line' || a.type === 'testline') {
          const [p, q] = a.pts;
          s += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="transparent" stroke-width="${12 * u}"/>`;
          s += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${sel ? '#fff' : col}" stroke-width="${sw}" ${a.type === 'testline' ? `stroke-dasharray="${8 * u} ${4 * u}"` : ''}/>`;
          [p, q].forEach(pt => { s += `<circle cx="${pt[0]}" cy="${pt[1]}" r="${3 * u}" fill="${col}"/>`; });
          if (a.type === 'line') {
            const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
            s += `<text x="${mx}" y="${my - 6 * u}" text-anchor="middle" font-size="${fs}" font-family="IBM Plex Mono, Consolas, monospace" fill="${col}" ${halo}>${no} ${escapeHtml(annoValue(img, a))}</text>`;
          } else {
            s += `<text x="${q[0] + 6 * u}" y="${q[1] + 4 * u}" font-size="${fs * 0.9}" font-family="IBM Plex Mono, Consolas, monospace" fill="${col}" ${halo}>${no}</text>`;
          }
        } else if (a.type === 'poly') {
          const pts = a.pts.map(p => p.join(',')).join(' ');
          const cx = a.pts.reduce((t, p) => t + p[0], 0) / a.pts.length, cy = a.pts.reduce((t, p) => t + p[1], 0) / a.pts.length;
          s += `<polygon points="${pts}" fill="rgba(34,211,238,${sel ? 0.3 : 0.16})" stroke="${sel ? '#fff' : col}" stroke-width="${sw}"/>`;
          s += `<text x="${cx}" y="${cy}" text-anchor="middle" font-size="${fs}" font-family="Pretendard, Malgun Gothic, sans-serif" font-weight="700" fill="#fff" ${halo}>${no} ${escapeHtml(a.kind || '')}</text>`;
          s += `<text x="${cx}" y="${cy + fs * 1.2}" text-anchor="middle" font-size="${fs * 0.9}" font-family="IBM Plex Mono, Consolas, monospace" fill="${col}" ${halo}>${escapeHtml(annoValue(img, a))}</text>`;
        } else if (a.type === 'marker') {
          const [x, y] = a.pts[0];
          const r = 9 * u;
          s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="${sel ? '#fff' : '#000'}" stroke-width="${(sel ? 2.5 : 1.5) * u}"/>`;
          s += `<text x="${x}" y="${y + 4 * u}" text-anchor="middle" font-size="${fs * 0.85}" font-weight="700" font-family="IBM Plex Mono, Consolas, monospace" fill="#000">${annoNumber(img, a)}</text>`;
          s += `<text x="${x + r + 4 * u}" y="${y + 4 * u}" font-size="${fs}" font-weight="700" font-family="Pretendard, Malgun Gothic, sans-serif" fill="#fff" ${halo}>${escapeHtml(a.kind || '')}${a.label ? ' · ' + escapeHtml(a.label) : ''}</text>`;
        } else if (a.type === 'icept') {
          const [x, y] = a.pts[0];
          const r = 5 * u;
          s += `<circle cx="${x}" cy="${y}" r="${r * 1.8}" fill="transparent"/>`;
          s += `<path d="M${x - r},${y - r} L${x + r},${y + r} M${x + r},${y - r} L${x - r},${y + r}" stroke="${sel ? '#fff' : col}" stroke-width="${2.2 * u}"/>`;
        }
        s += `</g>`;
      });
      return s;
    }

    function measurePanelHtml(kind, rec, img) {
      const list = img.annos.filter(a => a.type !== 'icept');
      const icepts = img.annos.filter(a => a.type === 'icept').length;
      let results = '';
      if (kind === 'micro') {
        const r = imgMicroResult(img);
        const rr = recMicroResult(rec);
        results = `
          <div class="sec-title">이 이미지</div>
          <dl class="kv" style="margin-bottom:12px;">
            <dt>시험선 길이 L</dt><dd>${r.lines ? (r.Lmm ? fmtSig(r.Lmm) + ' mm' : fmtSig(r.Lpx) + ' px') : '-'}</dd>
            <dt>교차점 P</dt><dd>${r.P}</dd>
            <dt>평균 절편 길이 ℓ</dt><dd>${r.ell ? fmtSig(r.ell * 1000) + ' μm' : '-'}</dd>
            <dt>결정립도 G</dt><dd class="big">${r.G !== null ? r.G.toFixed(1) : '-'}</dd>
            <dt>점 계수 상분율</dt><dd>${r.pointFrac !== null ? `${r.pointFrac.toFixed(1)} % (${r.gridHits}/${r.gridTotal})` : '-'}</dd>
            <dt>명암 면적률</dt><dd>${r.thrFrac !== null && r.thrFrac !== undefined ? r.thrFrac.toFixed(2) + ' %' : '-'}</dd>
          </dl>
          ${rec.images.length > 1 ? `
          <div class="sec-title">기록 전체 · ${rec.images.length}장</div>
          <dl class="kv" style="margin-bottom:12px;">
            <dt>ℓ (합산 L/P)</dt><dd>${rr.ell ? fmtSig(rr.ell * 1000) + ' μm' : '-'}</dd>
            <dt>G</dt><dd class="big">${rr.G !== null ? rr.G.toFixed(1) : '-'}</dd>
            <dt>상분율 평균 ± 95% CI</dt><dd>${rr.pfMean !== null ? `${rr.pfMean.toFixed(1)}${rr.ci !== null ? ' ± ' + rr.ci.toFixed(1) : ''} %` : '-'}</dd>
            <dt>상대 정밀도 %RA</dt><dd>${rr.ra !== null ? rr.ra.toFixed(0) + ' %' : '-'}</dd>
          </dl>` : ''}
          ${!img.calib && r.lines ? '<p class="hint" style="color:var(--warn); margin-bottom:8px;"><i class="fa-solid fa-triangle-exclamation"></i> 스케일 보정 전이라 결정립도를 계산할 수 없습니다. 스케일 도구로 먼저 보정하세요.</p>' : ''}
          <div class="row" style="margin-bottom:12px;">
            <span class="hint" style="font-weight:600;">점 계수 격자</span>
            <div class="seg">${[0, 5, 7, 10, 15].map(n => `<button class="${img.grid.n === n ? 'on' : ''}" onclick="setGrid(${n})">${n ? n + '×' + n : '끔'}</button>`).join('')}</div>
            ${icepts ? `<button class="btn sm ghost" onclick="clearType('icept')" title="교차점 모두 지우기">P 초기화</button>` : ''}
          </div>`;
      } else {
        const ar = fractoAreaResult(rec);
        const mc = markerCounts(rec);
        results = `
          ${Object.keys(mc).length ? `<div class="sec-title">주석 집계</div><div class="chips" style="margin-bottom:12px;">${Object.entries(mc).map(([k, n]) => `<span class="chip-check on">${escapeHtml(k)} <b class="mono">${n}</b></span>`).join('')}</div>` : ''}
          ${Object.keys(ar.sums).length ? `<div class="sec-title">영역 면적</div><dl class="kv" style="margin-bottom:12px;">
            ${Object.entries(ar.sums).map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${v.calibrated ? fmtSig(v.mm2) + ' mm²' : fmtSig(v.px) + ' px²'}</dd>`).join('')}
            ${ar.ratio !== null ? `<dt>피로 진전 면적률</dt><dd class="big">${ar.ratio.toFixed(1)} %</dd>` : ''}
          </dl>` : ''}`;
      }
      return `
        <section class="panel">
          <div class="panel-head"><h2><i class="fa-solid fa-ruler-combined"></i> 측정 · 주석 <span class="mono">${img.annos.length}</span></h2>
            ${img.calib ? `<button class="btn sm ghost" onclick="clearCalib()" title="스케일 보정 지우기"><i class="fa-solid fa-ruler-horizontal"></i> 보정 해제</button>` : `<button class="btn sm" onclick="setTool('calib')"><i class="fa-solid fa-ruler-horizontal"></i> 스케일 보정</button>`}
          </div>
          <div class="panel-body">
            ${results}
            ${list.length ? `<div class="meas-list">${list.map(a => `
              <div class="meas ${ui.sel === a.id ? 'sel' : ''}" onclick="selectAnno('${a.id}')">
                <span class="no" style="background:${ANNO_COLORS[a.type]}; color:#000;">${annoPrefix(a.type)}${annoNumber(img, a)}</span>
                <span class="lbl">${escapeHtml(a.kind || a.label || { line: '길이', testline: '시험선', poly: '영역', marker: '주석' }[a.type])}${a.kind && a.label ? ' · ' + escapeHtml(a.label) : ''}</span>
                <span class="val">${escapeHtml(annoValue(img, a))}</span>
                <span style="white-space:nowrap;">
                  <button class="icon-btn" style="color:var(--muted);" onclick="event.stopPropagation(); editAnno('${a.id}')" title="이름 · 메모 수정"><i class="fa-solid fa-pen"></i></button>
                  <button class="icon-btn" onclick="event.stopPropagation(); deleteAnno('${a.id}')" title="삭제"><i class="fa-solid fa-xmark"></i></button>
                </span>
              </div>`).join('')}</div>` : `<p class="hint">위 도구로 길이·면적·주석을 추가하면 여기에 쌓입니다.${kind === 'micro' ? ' 결정립도는 시험선을 긋고 교차점을 찍으면 계산됩니다.' : ''}</p>`}
          </div>
        </section>`;
    }

    function thresholdPanelHtml(img) {
      return `
        <section class="panel">
          <div class="panel-head"><h2><i class="fa-solid fa-circle-half-stroke"></i> 명암 면적률</h2>
            <label class="row hint" style="cursor:pointer; gap:5px;"><input type="checkbox" ${img.thr.on ? 'checked' : ''} onchange="toggleThreshold(this.checked)"> 표시</label>
          </div>
          <div class="panel-body" style="display:flex; flex-direction:column; gap:10px;">
            <div class="seg">
              <button class="${img.thr.dark ? 'on' : ''}" onclick="setThresholdMode(true)">어두운 상</button>
              <button class="${!img.thr.dark ? 'on' : ''}" onclick="setThresholdMode(false)">밝은 상</button>
            </div>
            <div class="range-row">
              <input type="range" min="0" max="255" value="${img.thr.value}" oninput="onThresholdInput(this.value)" onchange="onThresholdChange(this.value)">
              <span class="mono" id="thrVal" style="width:32px; text-align:right;">${img.thr.value}</span>
            </div>
            <dl class="kv"><dt>선택 면적률</dt><dd class="big" id="thrFrac">${img.thr.fraction !== null && img.thr.fraction !== undefined ? img.thr.fraction.toFixed(2) + ' %' : '-'}</dd></dl>
            <p class="hint">기공·2상처럼 명암이 뚜렷한 대상의 면적 비율을 빠르게 봅니다. 결정립계·에칭 얼룩도 함께 잡힐 수 있으니 붉은 표시를 눈으로 확인하세요.</p>
          </div>
        </section>`;
    }

    function judgePanelHtml(kind, rec) {
      const M = IMG_MODULES[kind];
      const hasKey = !!getAiKey();
      const aiText = ui.aiText[kind] && ui.aiText[kind].recId === rec.id ? ui.aiText[kind].text : '';
      return `
        <section class="panel">
          <div class="panel-head"><h2><i class="fa-solid fa-clipboard-check"></i> ${kind === 'fracto' ? '판정 · 소견' : '조직 특징 · 소견'}</h2></div>
          <div class="panel-body" style="display:flex; flex-direction:column; gap:12px;">
            ${kind === 'fracto' ? `
              <div class="field"><label>파괴 양상</label>
                <div class="seg">${M.modes.map(m => `<button class="${rec.fields.mode === m ? 'on' : ''}" onclick="updateRecField('fracto', 'mode', '${m}')">${m}</button>`).join('')}</div>
              </div>
              <div class="field"><label>파단 기점</label>
                <select class="select" onchange="updateRecField('fracto', 'origin', this.value)">${M.origins.map(o => `<option value="${o}" ${o === (rec.fields.origin || '') ? 'selected' : ''}>${o || '(선택)'}</option>`).join('')}</select>
              </div>` : ''}
            <div class="field"><label>${kind === 'fracto' ? '관찰 특징' : '조직 특징'}</label>
              <div class="chips">${M.features.map((f, i) => `<label class="chip-check ${rec.features.includes(f) ? 'on' : ''}"><input type="checkbox" ${rec.features.includes(f) ? 'checked' : ''} onchange="toggleFeature('${kind}', ${i})">${f}</label>`).join('')}</div>
            </div>
            <div class="field"><label>관찰 소견</label><textarea class="textarea" rows="5" placeholder="- 관찰 내용을 개조식으로 기록" onchange="updateRec('${kind}', 'observation', this.value)">${escapeHtml(rec.observation)}</textarea></div>
            <div class="field"><label>${kind === 'fracto' ? '추정 원인 · 결론' : '결론'}</label><textarea class="textarea" rows="3" onchange="updateRec('${kind}', 'conclusion', this.value)">${escapeHtml(rec.conclusion)}</textarea></div>
            <div class="row">
              <button class="btn sm" onclick="runAi('${kind}')" ${hasKey && rec.images.length ? '' : 'disabled'} title="${hasKey ? '현재 이미지와 입력 정보로 소견 초안 생성' : '설정에서 Gemini API 키를 저장하면 사용 가능'}">
                <i class="fa-solid fa-wand-magic-sparkles"></i> ${ui.aiBusy ? '판독 중…' : 'AI 소견 초안'}
              </button>
              <button class="btn sm ghost" onclick="copyRecordText('${kind}')"><i class="fa-regular fa-copy"></i> 요약 복사</button>
              ${!hasKey ? `<a class="hint" style="cursor:pointer; text-decoration:underline;" onclick="go('settings')">AI 설정</a>` : ''}
            </div>
            ${aiText ? `
              <div class="ai-box">${escapeHtml(aiText)}</div>
              <div class="row">
                <button class="btn sm primary" onclick="applyAiText('${kind}')"><i class="fa-solid fa-arrow-down"></i> 소견에 넣기</button>
                <button class="btn sm ghost" onclick="ui.aiText.${kind} = ''; render();">닫기</button>
                <span class="hint">AI 초안 · 참고용, 직접 확인 필요</span>
              </div>` : ''}
          </div>
        </section>`;
    }

    // ---- 기록 조작 ----
    function createImageRecord(kind, preset) {
      const n = DB[kind].length + 1;
      const rec = normalizeImageRecord({ name: `${IMG_MODULES[kind].title} 분석 ${n}`, ...(preset || {}) });
      DB[kind].unshift(rec);
      active[kind] = rec.id;
      ui.img[kind] = null;
      ui.sel = null;
      ui.zoom = 1;
      saveData();
      render();
      return rec;
    }

    function deleteImageRecord(kind, id) {
      const rec = DB[kind].find(r => r.id === id);
      if (!rec) return;
      askConfirm(`'${rec.name}' 기록과 이미지 ${rec.images.length}장을 삭제하시겠습니까?`, async () => {
        for (const im of rec.images) await deleteImageBlob(im.id);
        DB[kind] = DB[kind].filter(r => r.id !== id);
        DB.reports.forEach(rp => { rp.include[kind] = rp.include[kind].filter(x => x !== id); });
        active[kind] = null;
        saveData();
        render();
        showToast('기록을 삭제했습니다.');
      }, { okLabel: '삭제', danger: true });
    }

    function updateRec(kind, field, value) {
      const rec = moduleRec(kind);
      if (!rec) return;
      rec[field] = field === 'name' ? (String(value).trim() || '이름 없는 기록') : value;
      touch(rec);
      saveData();
      if (field === 'name') render();
    }

    function updateRecField(kind, field, value) {
      const rec = moduleRec(kind);
      if (!rec) return;
      rec.fields[field] = String(value || '').trim();
      touch(rec);
      saveData();
      if (field === 'mode' || field === 'condition' || field === 'material') render();
    }

    function toggleFeature(kind, idx) {
      const rec = moduleRec(kind);
      const f = IMG_MODULES[kind].features[idx];
      if (!rec || !f) return;
      rec.features = rec.features.includes(f) ? rec.features.filter(x => x !== f) : [...rec.features, f];
      touch(rec);
      saveData();
      render();
    }

    let pickKind = null;
    function pickImages(kind) {
      pickKind = kind;
      document.getElementById('imageInput').click();
    }

    async function handleImageFiles(e) {
      const files = [...e.target.files];
      e.target.value = '';
      const kind = pickKind;
      const rec = kind && moduleRec(kind);
      if (!rec || !files.length) return;
      showToast(`이미지 ${files.length}장을 불러오는 중...`);
      let added = 0, resized = 0, lastId = null;
      for (const f of files) {
        try {
          const p = await prepareImageBlob(f);
          const id = genId('img');
          await putImageBlob(id, p.blob, f.name);
          rec.images.push(normalizeImg({ id, name: f.name.replace(/\.[^.]+$/, ''), w: p.w, h: p.h }));
          if (p.resized) resized++;
          lastId = id;
          added++;
        } catch (err) {
          console.warn('이미지 불러오기 실패', f.name, err);
        }
      }
      if (lastId) ui.img[kind] = lastId;
      ui.zoom = 1;
      touch(rec);
      saveData();
      render();
      showToast(added ? `이미지 ${added}장을 추가했습니다.${resized ? ` (${resized}장은 긴 변 4000px로 줄여 저장)` : ''} 스케일 보정부터 해 주세요.` : '이미지를 불러오지 못했습니다.');
    }

    function selectImg(kind, id) {
      ui.img[kind] = id;
      ui.sel = null;
      ui.draft = [];
      render();
    }

    function removeImage(kind) {
      const rec = moduleRec(kind);
      const img = activeImg(kind, rec);
      if (!img) return;
      askConfirm(`'${img.name}' 이미지와 측정 ${img.annos.length}개를 삭제하시겠습니까?`, async () => {
        await deleteImageBlob(img.id);
        rec.images = rec.images.filter(i => i.id !== img.id);
        ui.img[kind] = null;
        touch(rec);
        saveData();
        render();
      }, { okLabel: '삭제', danger: true });
    }

    // ---- 뷰어 조작 ----
    function curCtx() {
      const kind = view;
      const rec = moduleRec(kind);
      const img = rec ? activeImg(kind, rec) : null;
      return { kind, rec, img };
    }

    function setTool(t) {
      ui.tool = t;
      ui.draft = [];
      const { img } = curCtx();
      if (t === 'pcount' && img && !img.grid.n) {
        img.grid.n = 10;
        saveData();
        showToast('10×10 점 계수 격자를 켰습니다. 대상 상 위에 놓인 점을 클릭하세요.');
      }
      if ((t === 'testline' || t === 'line' || t === 'poly') && img && !img.calib) showToast('스케일 보정 전에는 px 단위로 측정됩니다.');
      render();
    }

    function setZoom(z) {
      ui.zoom = Math.max(0.5, Math.min(8, z));
      const st = document.getElementById('vstage');
      if (st) st.style.width = (ui.zoom * 100) + '%';
      const lab = document.getElementById('vzoom');
      if (lab) lab.textContent = Math.round(ui.zoom * 100) + '%';
    }

    function zoomBy(k) {
      const v = document.getElementById('viewer');
      const cx = v ? (v.scrollLeft + v.clientWidth / 2) / v.scrollWidth : 0.5;
      const cy = v ? (v.scrollTop + v.clientHeight / 2) / v.scrollHeight : 0.5;
      setZoom(ui.zoom * k);
      if (v) {
        v.scrollLeft = cx * v.scrollWidth - v.clientWidth / 2;
        v.scrollTop = cy * v.scrollHeight - v.clientHeight / 2;
      }
    }

    function evtPt(e) {
      const svg = document.getElementById('vsvg');
      const p = svg.createSVGPoint();
      p.x = e.clientX;
      p.y = e.clientY;
      const q = p.matrixTransform(svg.getScreenCTM().inverse());
      return [Math.round(q.x * 10) / 10, Math.round(q.y * 10) / 10];
    }

    function screenToImg(img, px) {
      const svg = document.getElementById('vsvg');
      return svg ? px * img.w / svg.getBoundingClientRect().width : px;
    }

    function redrawAnno() {
      const { kind, img } = curCtx();
      const g = document.getElementById('vanno');
      if (g && img) g.innerHTML = annoSvg(img, kind);
    }

    function drawTemp(cursor) {
      const { img } = curCtx();
      const g = document.getElementById('vtemp');
      if (!g || !img) return;
      const u = annoUnit(img);
      const pts = cursor ? [...ui.draft, cursor] : ui.draft;
      if (!pts.length) {
        g.innerHTML = '';
        return;
      }
      const col = ui.tool === 'calib' ? '#ffffff' : (ANNO_COLORS[ui.tool] || '#fff');
      let s = `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="${ui.tool === 'poly' ? 'rgba(34,211,238,0.12)' : 'none'}" stroke="${col}" stroke-width="${2 * u}" stroke-dasharray="${5 * u} ${3 * u}"/>`;
      ui.draft.forEach(p => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="${3.5 * u}" fill="${col}"/>`; });
      if (cursor && ui.draft.length === 1 && ['line', 'testline', 'calib'].includes(ui.tool)) {
        const d = dist(ui.draft[0], cursor);
        s += `<text x="${cursor[0] + 10 * u}" y="${cursor[1] - 8 * u}" font-size="${13 * u}" font-family="IBM Plex Mono, Consolas, monospace" fill="${col}" paint-order="stroke" stroke="#000" stroke-width="${3 * u}">${ui.tool === 'calib' ? d.toFixed(0) + ' px' : escapeHtml(fmtLen(img, d))}</text>`;
      }
      g.innerHTML = s;
    }

    function viewerMove(e) {
      const { img } = curCtx();
      if (!img) return;
      const p = evtPt(e);
      const xy = document.getElementById('vxy');
      if (xy) xy.textContent = img.calib ? `${fmtSig(p[0] / img.calib.pxPerUnit)}, ${fmtSig(p[1] / img.calib.pxPerUnit)} ${img.calib.unit}` : `${p[0].toFixed(0)}, ${p[1].toFixed(0)} px`;
      if (ui.draft.length) drawTemp(p);
    }

    function commitAnno(a, msg) {
      const { rec, img } = curCtx();
      img.annos.push({ id: genId('an'), label: '', kind: '', ...a });
      touch(rec);
      saveData();
      ui.draft = [];
      render();
      if (msg) showToast(msg);
    }

    async function viewerClick(e) {
      const { kind, img } = curCtx();
      if (!img || e.detail > 1) return;
      const p = evtPt(e);
      const t = ui.tool;
      if (t === 'select') {
        const g = e.target.closest('[data-aid]');
        ui.sel = g ? g.getAttribute('data-aid') : null;
        render();
        return;
      }
      if (t === 'calib' || t === 'line' || t === 'testline') {
        ui.draft.push(p);
        if (ui.draft.length < 2) {
          drawTemp();
          return;
        }
        const [a, b] = ui.draft;
        if (dist(a, b) < 2) {
          ui.draft = [];
          drawTemp();
          return;
        }
        if (t === 'calib') {
          const pxLen = dist(a, b);
          ui.draft = [];
          const out = await askForm('스케일 보정', [
            { id: 'len', label: `선택한 길이 ${pxLen.toFixed(1)} px의 실제 길이`, type: 'number', value: '', placeholder: '예: 100' },
            { id: 'unit', label: '단위', type: 'select', value: 'μm', options: UNITS.map(x => [x, x]) }
          ], '보정');
          drawTemp();
          if (!out) return;
          const len = Number(String(out.len).replace(/,/g, ''));
          if (!(len > 0)) {
            showToast('0보다 큰 길이를 입력해 주세요.');
            return;
          }
          const { rec } = curCtx();
          img.calib = { pxPerUnit: pxLen / len, unit: out.unit, pts: [a, b] };
          ui.tool = 'select';
          touch(rec);
          saveData();
          render();
          showToast(`보정 완료: 1 ${out.unit} = ${fmtSig(pxLen / len)} px. 이 이미지의 모든 측정값이 실제 단위로 바뀌었습니다.`);
          return;
        }
        commitAnno({ type: t, pts: [a, b] }, t === 'line' ? `길이 ${fmtLen(img, dist(a, b))}` : '시험선을 추가했습니다. 교차점 도구로 결정립계와 만나는 점을 찍으세요.');
        return;
      }
      if (t === 'poly') {
        if (ui.draft.length >= 3) {
          const tol = screenToImg(img, 10);
          if (dist(ui.draft[0], p) <= tol) {
            await closePoly();
            return;
          }
        }
        ui.draft.push(p);
        drawTemp();
        return;
      }
      if (t === 'marker') {
        const M = IMG_MODULES[kind];
        const out = await askForm('주석 추가', [
          { id: 'kind', label: '종류', type: 'select', value: M.markerKinds[0], options: M.markerKinds.map(x => [x, x]) },
          { id: 'label', label: '메모 (선택)', type: 'text', value: '', placeholder: '예: 표면 직하 기공 기점' }
        ], '추가');
        if (!out) return;
        commitAnno({ type: 'marker', pts: [p], kind: out.kind, label: out.label.trim() });
        return;
      }
      if (t === 'icept') {
        commitAnno({ type: 'icept', pts: [p] });
        return;
      }
      if (t === 'pcount') {
        const n = img.grid.n;
        if (!n) return;
        const i = Math.floor(p[0] / img.w * n), j = Math.floor(p[1] / img.h * n);
        if (i < 0 || j < 0 || i >= n || j >= n) return;
        const cx = (i + 0.5) / n * img.w, cy = (j + 0.5) / n * img.h;
        if (dist([cx, cy], p) > Math.min(img.w, img.h) / n * 0.45) return;
        const idx = j * n + i;
        img.grid.hits = img.grid.hits.includes(idx) ? img.grid.hits.filter(x => x !== idx) : [...img.grid.hits, idx];
        const { rec } = curCtx();
        touch(rec);
        saveData();
        render();
      }
    }

    async function viewerDbl(e) {
      if (ui.tool === 'poly' && ui.draft.length >= 3) {
        e.preventDefault();
        await closePoly();
      }
    }

    async function closePoly() {
      const { kind, img } = curCtx();
      const pts = ui.draft.slice();
      // 더블클릭으로 같은 점이 두 번 들어간 경우 정리
      const clean = pts.filter((p, i) => i === 0 || dist(p, pts[i - 1]) > 0.5);
      ui.draft = [];
      if (clean.length < 3) {
        drawTemp();
        return;
      }
      const M = IMG_MODULES[kind];
      const out = await askForm('영역 이름', [
        { id: 'kind', label: '영역 종류', type: 'select', value: M.polyKinds[0], options: M.polyKinds.map(x => [x, x]) },
        { id: 'label', label: '메모 (선택)', type: 'text', value: '' }
      ], '추가');
      if (!out) {
        drawTemp();
        return;
      }
      commitAnno({ type: 'poly', pts: clean, kind: out.kind, label: out.label.trim() }, `면적 ${fmtArea(img, polyArea(clean))}`);
    }

    function viewerKey(e) {
      if (e.key === 'Escape' && ui.draft.length) {
        ui.draft = [];
        drawTemp();
      } else if (e.key === 'Enter' && ui.tool === 'poly' && ui.draft.length >= 3) {
        closePoly();
      } else if ((e.key === 'Delete' || e.key === 'Backspace') && ui.sel) {
        e.preventDefault();
        deleteAnno(ui.sel);
      } else if (e.key === '+' || e.key === '=') zoomBy(1.4);
      else if (e.key === '-') zoomBy(1 / 1.4);
    }

    function selectAnno(id) {
      ui.sel = ui.sel === id ? null : id;
      render();
    }

    function deleteAnno(id) {
      const { rec, img } = curCtx();
      if (!img) return;
      img.annos = img.annos.filter(a => a.id !== id);
      if (ui.sel === id) ui.sel = null;
      touch(rec);
      saveData();
      render();
    }

    async function editAnno(id) {
      const { kind, rec, img } = curCtx();
      const a = img && img.annos.find(x => x.id === id);
      if (!a) return;
      const M = IMG_MODULES[kind];
      const fields = [];
      if (a.type === 'marker') fields.push({ id: 'kind', label: '종류', type: 'select', value: a.kind, options: M.markerKinds.map(x => [x, x]) });
      if (a.type === 'poly') fields.push({ id: 'kind', label: '영역 종류', type: 'select', value: a.kind, options: M.polyKinds.map(x => [x, x]) });
      fields.push({ id: 'label', label: a.type === 'line' ? '이름 (예: 비치마크 간격)' : '메모', type: 'text', value: a.label });
      const out = await askForm('주석 수정', fields, '저장');
      if (!out) return;
      if (out.kind !== undefined) a.kind = out.kind;
      a.label = out.label.trim();
      touch(rec);
      saveData();
      render();
    }

    function clearType(type) {
      const { rec, img } = curCtx();
      if (!img) return;
      const n = img.annos.filter(a => a.type === type).length;
      askConfirm(`교차점 ${n}개를 모두 지우시겠습니까?`, () => {
        img.annos = img.annos.filter(a => a.type !== type);
        touch(rec);
        saveData();
        render();
      }, { okLabel: '지우기', danger: true });
    }

    function clearCalib() {
      const { rec, img } = curCtx();
      if (!img) return;
      askConfirm('스케일 보정을 지우면 측정값이 px 단위로 표시됩니다. 계속하시겠습니까?', () => {
        img.calib = null;
        touch(rec);
        saveData();
        render();
      }, { okLabel: '보정 해제' });
    }

    function setGrid(n) {
      const { rec, img } = curCtx();
      if (!img) return;
      const apply = () => {
        img.grid = { n, hits: [] };
        if (n && ui.tool !== 'pcount') ui.tool = 'pcount';
        if (!n && ui.tool === 'pcount') ui.tool = 'select';
        touch(rec);
        saveData();
        render();
      };
      if (img.grid.hits.length && n !== img.grid.n) askConfirm(`격자를 바꾸면 표시한 점 ${img.grid.hits.length}개가 초기화됩니다. 계속하시겠습니까?`, apply, { okLabel: '변경' });
      else apply();
    }

    // ---- 명암 임계값 ----
    async function getGray(img) {
      if (grayCache.has(img.id)) return grayCache.get(img.id);
      const url = await imageUrl(img.id);
      if (!url) return null;
      const el = await loadImageEl(url);
      const k = Math.min(1, 1200 / Math.max(img.w, img.h));
      const w = Math.max(1, Math.round(img.w * k)), h = Math.max(1, Math.round(img.h * k));
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(el, 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h).data;
      const g = new Uint8ClampedArray(w * h);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const out = { w, h, g };
      grayCache.set(img.id, out);
      return out;
    }

    let thrRaf = null;
    const maskCache = new Map();
    async function updateThresholdMask(img, save) {
      const mkey = `${img.id}|${img.thr.value}|${img.thr.dark}`;
      if (!save && maskCache.has(img.id) && maskCache.get(img.id).key === mkey) {
        const mask = document.getElementById('vmask');
        if (mask) mask.setAttribute('href', img.thr.on ? maskCache.get(img.id).url : '');
        return;
      }
      const gr = await getGray(img);
      if (!gr) return;
      const { w, h, g } = gr;
      const v = img.thr.value;
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      const id = ctx.createImageData(w, h);
      let cnt = 0;
      for (let i = 0; i < g.length; i++) {
        const hit = img.thr.dark ? g[i] <= v : g[i] >= v;
        if (hit) {
          cnt++;
          id.data[i * 4] = 244;
          id.data[i * 4 + 1] = 63;
          id.data[i * 4 + 2] = 94;
          id.data[i * 4 + 3] = 150;
        }
      }
      ctx.putImageData(id, 0, 0);
      img.thr.fraction = cnt / g.length * 100;
      const murl = c.toDataURL();
      maskCache.set(img.id, { key: mkey, url: murl });
      const mask = document.getElementById('vmask');
      if (mask) mask.setAttribute('href', img.thr.on ? murl : '');
      const fr = document.getElementById('thrFrac');
      if (fr) fr.textContent = img.thr.fraction.toFixed(2) + ' %';
      if (save) {
        const { rec } = curCtx();
        touch(rec);
        saveData();
      }
    }

    function onThresholdInput(v) {
      const { img } = curCtx();
      if (!img) return;
      img.thr.value = Number(v);
      if (!img.thr.on) img.thr.on = true;
      document.getElementById('thrVal').textContent = v;
      cancelAnimationFrame(thrRaf);
      thrRaf = requestAnimationFrame(() => updateThresholdMask(img, false));
    }

    function onThresholdChange(v) {
      const { img } = curCtx();
      if (!img) return;
      img.thr.value = Number(v);
      img.thr.on = true;
      updateThresholdMask(img, true).then(() => render());
    }

    function toggleThreshold(on) {
      const { rec, img } = curCtx();
      if (!img) return;
      img.thr.on = on;
      touch(rec);
      saveData();
      if (on) updateThresholdMask(img, true).then(() => render());
      else {
        const mask = document.getElementById('vmask');
        if (mask) mask.setAttribute('href', '');
        saveData();
      }
    }

    function setThresholdMode(dark) {
      const { img } = curCtx();
      if (!img) return;
      img.thr.dark = dark;
      img.thr.on = true;
      updateThresholdMask(img, true).then(() => render());
    }

    // ---- 주석 포함 이미지 (PNG 저장 · 보고서용) ----
    function niceScaleLen(img) {
      const unitsWidth = img.w / img.calib.pxPerUnit;
      const target = unitsWidth * 0.2;
      const mag = Math.pow(10, Math.floor(Math.log10(target)));
      const step = [1, 2, 5, 10].map(s => s * mag).filter(s => s <= target).pop() || mag;
      return step;
    }

    async function renderAnnotatedCanvas(img, maxW) {
      const url = await imageUrl(img.id);
      if (!url) return null;
      const el = await loadImageEl(url);
      const k = maxW ? Math.min(1, maxW / img.w) : 1;
      const c = document.createElement('canvas');
      c.width = Math.round(img.w * k);
      c.height = Math.round(img.h * k);
      const ctx = c.getContext('2d');
      ctx.scale(k, k);
      ctx.drawImage(el, 0, 0, img.w, img.h);
      const u = annoUnit(img);
      const mono = `${13 * u}px "IBM Plex Mono", Consolas, monospace`;
      const sans = `bold ${13 * u}px Pretendard, "Malgun Gothic", sans-serif`;
      const label = (txt, x, y, color, font, align) => {
        ctx.font = font;
        ctx.textAlign = align || 'left';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3 * u;
        ctx.strokeStyle = '#000';
        ctx.strokeText(txt, x, y);
        ctx.fillStyle = color;
        ctx.fillText(txt, x, y);
      };
      if (img.grid.n) {
        const n = img.grid.n, hits = new Set(img.grid.hits), r = 5 * u;
        for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
          const x = (i + 0.5) / n * img.w, y = (j + 0.5) / n * img.h;
          if (hits.has(j * n + i)) {
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = '#22d3ee'; ctx.fill();
            ctx.lineWidth = 1.2 * u; ctx.strokeStyle = '#000'; ctx.stroke();
          } else {
            ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
            ctx.lineWidth = 1.3 * u; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
          }
        }
      }
      img.annos.forEach(a => {
        const col = ANNO_COLORS[a.type];
        const no = `${annoPrefix(a.type)}${annoNumber(img, a)}`;
        ctx.setLineDash([]);
        if (a.type === 'line' || a.type === 'testline') {
          const [p, q] = a.pts;
          ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
          if (a.type === 'testline') ctx.setLineDash([8 * u, 4 * u]);
          ctx.lineWidth = 2 * u; ctx.strokeStyle = col; ctx.stroke(); ctx.setLineDash([]);
          [p, q].forEach(pt => { ctx.beginPath(); ctx.arc(pt[0], pt[1], 3 * u, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); });
          if (a.type === 'line') label(`${no} ${annoValue(img, a)}`, (p[0] + q[0]) / 2, (p[1] + q[1]) / 2 - 6 * u, col, mono, 'center');
          else label(no, q[0] + 6 * u, q[1] + 4 * u, col, mono);
        } else if (a.type === 'poly') {
          ctx.beginPath();
          a.pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
          ctx.closePath();
          ctx.fillStyle = 'rgba(34,211,238,0.16)'; ctx.fill();
          ctx.lineWidth = 2 * u; ctx.strokeStyle = col; ctx.stroke();
          const cx = a.pts.reduce((t, p) => t + p[0], 0) / a.pts.length, cy = a.pts.reduce((t, p) => t + p[1], 0) / a.pts.length;
          label(`${no} ${a.kind || ''}`, cx, cy, '#fff', sans, 'center');
          label(annoValue(img, a), cx, cy + 15 * u, col, mono, 'center');
        } else if (a.type === 'marker') {
          const [x, y] = a.pts[0], r = 9 * u;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
          ctx.lineWidth = 1.5 * u; ctx.strokeStyle = '#000'; ctx.stroke();
          ctx.font = `bold ${11 * u}px Consolas, monospace`; ctx.textAlign = 'center'; ctx.fillStyle = '#000';
          ctx.fillText(String(annoNumber(img, a)), x, y + 4 * u);
          label(`${a.kind || ''}${a.label ? ' · ' + a.label : ''}`, x + r + 4 * u, y + 4 * u, '#fff', sans);
        } else if (a.type === 'icept') {
          const [x, y] = a.pts[0], r = 5 * u;
          ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r);
          ctx.lineWidth = 2.2 * u; ctx.strokeStyle = col; ctx.stroke();
        }
      });
      if (img.calib) {
        const len = niceScaleLen(img);
        const px = len * img.calib.pxPerUnit;
        const pad = 14 * u, bh = 6 * u;
        const txt = `${fmtSig(len)} ${img.calib.unit}`;
        ctx.font = `bold ${14 * u}px "IBM Plex Mono", Consolas, monospace`;
        const tw = ctx.measureText(txt).width;
        const boxW = Math.max(px, tw) + pad * 2, boxH = bh + 24 * u + pad;
        const bx = img.w - boxW - pad, by = img.h - boxH - pad;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(bx, by, boxW, boxH);
        ctx.fillStyle = '#fff';
        ctx.fillRect(bx + (boxW - px) / 2, by + boxH - pad - bh, px, bh);
        ctx.textAlign = 'center';
        ctx.fillText(txt, bx + boxW / 2, by + pad + 8 * u);
      }
      return c;
    }

    // ---- 합성 미세조직 예시 ----
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    async function loadMicroSample() {
      showToast('합성 미세조직 이미지를 만드는 중...');
      const W = 1200, H = 900, s = 2, w = W / s, h = H / s;
      const rnd = mulberry32(20261120);
      const seeds = Array.from({ length: 140 }, () => [rnd() * w, rnd() * h, 150 + rnd() * 70]);
      // 격자 버킷으로 가까운 씨앗만 비교
      const B = 40, cols = Math.ceil(w / B), rows = Math.ceil(h / B);
      const buckets = Array.from({ length: cols * rows }, () => []);
      seeds.forEach((p, i) => buckets[Math.min(rows - 1, Math.floor(p[1] / B)) * cols + Math.min(cols - 1, Math.floor(p[0] / B))].push(i));
      const owner = new Int16Array(w * h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const bx = Math.floor(x / B), by = Math.floor(y / B);
        let best = -1, bd = Infinity;
        for (let r = 1; best < 0 || r <= 2; r++) {
          for (let yy = by - r; yy <= by + r; yy++) for (let xx = bx - r; xx <= bx + r; xx++) {
            if (yy < 0 || xx < 0 || yy >= rows || xx >= cols) continue;
            buckets[yy * cols + xx].forEach(i => {
              const d = (seeds[i][0] - x) ** 2 + (seeds[i][1] - y) ** 2;
              if (d < bd) { bd = d; best = i; }
            });
          }
          if (r >= 3) break;
        }
        owner[y * w + x] = best;
      }
      const small = document.createElement('canvas');
      small.width = w;
      small.height = h;
      const sctx = small.getContext('2d');
      const id = sctx.createImageData(w, h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = y * w + x, o = owner[i];
        const edge = (x + 1 < w && owner[i + 1] !== o) || (y + 1 < h && owner[i + w] !== o);
        const v = edge ? 55 : seeds[o][2] + (rnd() - 0.5) * 10;
        id.data[i * 4] = v; id.data[i * 4 + 1] = v * 0.98; id.data[i * 4 + 2] = v * 0.94; id.data[i * 4 + 3] = 255;
      }
      sctx.putImageData(id, 0, 0);
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(small, 0, 0, W, H);
      // 어두운 입자 (석출물 · 기공 흉내)
      for (let k = 0; k < 90; k++) {
        ctx.beginPath();
        ctx.arc(rnd() * W, rnd() * H, 2 + rnd() * 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgb(28,26,24)';
        ctx.fill();
      }
      // 스케일 바: 200 px = 100 μm
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(W - 270, H - 78, 250, 60);
      ctx.fillStyle = '#fff';
      ctx.fillRect(W - 245, H - 34, 200, 8);
      ctx.font = 'bold 18px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('100 μm', W - 145, H - 46);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      const imgId = genId('img');
      await putImageBlob(imgId, blob, 'synthetic.png');
      go('micro');
      const rec = createImageRecord('micro', {
        name: '[예시] 합성 미세조직 — 결정립도·상분율',
        fields: { sample: 'SAMPLE-01', material: '가상 시료', condition: '합성 이미지 (실제 조직 아님)', etchant: '-', equipment: '합성 ×200 상당', section: '횡단면' },
        observation: '- 기능 확인용 합성 이미지임 (실제 시험 결과 아님)\n- 우측 하단 스케일 바(100 μm)로 보정해 둔 상태임',
        images: [{ id: imgId, name: '합성 조직', w: W, h: H, calib: { pxPerUnit: 2, unit: 'μm', pts: [[W - 245, H - 30], [W - 45, H - 30]] } }]
      });
      ui.img.micro = imgId;
      ui.tool = 'testline';
      render();
      showToast('합성 예시를 만들었습니다. 시험선을 긋고 교차점을 찍으면 결정립도가 계산됩니다. (가상 이미지)');
      return rec;
    }

    async function decodeTextFile(file) {
      const buf = await file.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.includes('�')) {
        try { text = new TextDecoder('euc-kr').decode(buf); } catch (e) {}
      }
      return text;
    }

    async function readResultFile(file) {
      const ext = fileExt(file.name);
      const base = file.name.replace(/\.[^.]+$/, '');
      if (['csv', 'tsv', 'txt'].includes(ext)) {
        return { title: base, method: 'CSV', sheets: [{ name: 'CSV', rows: parseDelimited(await decodeTextFile(file)) }] };
      }
      if (['xlsx', 'xlsm', 'xls', 'ods'].includes(ext)) {
        const XLSX = await loadXlsx();
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
        const sheets = wb.SheetNames.map(n => ({
          name: n,
          rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '', blankrows: false })
            .map(r => r.map(c => String(c == null ? '' : c).replace(/\s*\n\s*/g, ' ').trim()))
        })).filter(sh => sh.rows.some(r => r.some(c => c)));
        if (!sheets.length) throw new Error('엑셀 파일에 데이터가 없습니다.');
        return { title: base, method: '엑셀', sheets };
      }
      if (ext === 'pdf' || /^image\//.test(file.type) || ['png', 'jpg', 'jpeg', 'webp'].includes(ext)) {
        return await aiExtractTable(file, base, ext);
      }
      if (ext === 'hwp' || ext === 'hwpx') throw new Error('한글(HWP) 파일은 직접 읽을 수 없습니다. PDF나 엑셀로 저장해 올려 주세요.');
      if (ext === 'doc' || ext === 'docx') throw new Error('워드 파일은 PDF로 저장해 올려 주세요.');
      throw new Error('지원하지 않는 형식입니다. 엑셀·CSV·PDF·이미지 파일을 올려 주세요.');
    }

    async function aiExtractTable(file, base, ext) {
      if (!getAiKey()) throw new Error('PDF·이미지 성적서는 AI로 읽습니다. 설정에서 Gemini API 키를 먼저 저장해 주세요. (엑셀·CSV는 키 없이 바로 읽음)');
      if (file.size > 18 * 1048576) throw new Error('파일이 18 MB를 넘습니다. 결과 표가 있는 쪽만 PDF로 저장해 올려 주세요.');
      const mime = ext === 'pdf' ? 'application/pdf' : (file.type || 'image/png');
      const prompt = `첨부한 문서는 금속 소재 시험성적서 또는 시험 결과표입니다. 시험 결과 표를 찾아 아래 JSON 형식으로만 답하세요.
{"title": "문서 제목", "testType": "tensile|hardness|impact|fatigue|custom", "material": "소재명", "standard": "시험 규격", "testDate": "YYYY-MM-DD 또는 빈 문자열", "columns": ["시편", "조건", "항복강도(MPa)"], "rows": [["S-1", "T6", "312.5"]], "notes": "평균·규격값·특이사항 요약"}
규칙:
- 시편(시료) 하나가 한 행이 되도록 함. 평균·표준편차·규격값 행은 rows에 넣지 말고 notes에 적음
- 단위는 열 이름 뒤 괄호로 적고, 값에는 숫자만 넣음 (예: "항복강도(MPa)" 열에 "312.5")
- 열처리·채취 위치처럼 시편을 묶는 정보가 있으면 "조건" 열로 넣음
- 읽을 수 없는 칸은 빈 문자열로 두고, 추측해서 채우지 않음
- 결과 표가 여러 개면 가장 주된 기계적 시험 결과 표 하나만 추출함`;
      const out = await callGeminiContents([{ role: 'user', parts: [{ text: prompt }, await blobPart(file, mime)] }], { json: true });
      let data;
      try {
        data = JSON.parse(stripFence(out.text));
      } catch (e) {
        throw new Error('AI 응답을 표로 해석하지 못했습니다. 다시 시도하거나 엑셀로 올려 주세요.');
      }
      const cols = Array.isArray(data.columns) ? data.columns.map(c => String(c == null ? '' : c).trim()) : [];
      const rows = Array.isArray(data.rows) ? data.rows.map(r => (Array.isArray(r) ? r : []).map(c => String(c == null ? '' : c).trim())) : [];
      if (!cols.length || !rows.length) throw new Error('문서에서 시험 결과 표를 찾지 못했습니다.');
      return {
        title: String(data.title || base),
        method: `AI 추출 · ${out.model}`,
        ai: true,
        sheets: [{ name: 'AI 추출', rows: [cols, ...rows] }],
        meta: {
          testType: MAT_TEST_TYPES[data.testType] ? data.testType : '',
          material: String(data.material || ''),
          standard: String(data.standard || ''),
          testDate: /^\d{4}-\d{2}-\d{2}$/.test(String(data.testDate || '')) ? data.testDate : '',
          notes: String(data.notes || '')
        }
      };
    }

    const UNIT_RE = /^[A-Za-zμµ%°℃㎫㎛/²³·.]+$/;
    function splitUnit(c) {
      const m = String(c == null ? '' : c).trim().match(/^([-+]?(?:\d[\d,]*\.?\d*|\.\d+)(?:[eE][-+]?\d+)?)\s*([A-Za-zμµ%°℃㎫㎛/²³·]+)?$/);
      return m ? { num: m[1], unit: m[2] || '' } : { num: String(c == null ? '' : c).trim(), unit: '' };
    }

    function isNumCell(c) {
      return !!c && !isNaN(matNum(splitUnit(c).num));
    }

    function looksUnitRow(row) {
      const ne = (row || []).filter(c => c && c !== '-' && c !== '–');
      return ne.length >= 1 && ne.every(c => UNIT_RE.test(c.replace(/[\[\]()\s]/g, '')) && c.replace(/[\[\]()\s]/g, '').length <= 8);
    }

    function guessHeaderRow(rows) {
      let best = 0, bestScore = -1;
      for (let i = 0; i < Math.min(rows.length - 1, 40); i++) {
        const r = rows[i];
        const text = r.filter(c => c && !isNumCell(c)).length;
        if (text < 2) continue;
        let j = i + 1;
        if (rows[j] && looksUnitRow(rows[j])) j++;
        const nums = (rows[j] || []).filter(c => isNumCell(c)).length;
        if (nums < 1) continue;
        const score = text * 2 + nums;
        if (score > bestScore) {
          bestScore = score;
          best = i;
        }
      }
      return best;
    }

    function bestSheet(sheets) {
      let bi = 0, bn = -1;
      sheets.forEach((sh, i) => {
        const n = sh.rows.reduce((s, r) => s + r.filter(isNumCell).length, 0);
        if (n > bn) { bn = n; bi = i; }
      });
      return bi;
    }

    const SUMMARY_ROW = /^(평균|average|avg\.?|mean|표준\s*편차|std\.?|s\.?d\.?|최대|최소|max\.?|min\.?|규격|spec\.?|기준|합계|비고|판정)/i;

    function tableFromSheet(rowsIn, hdr) {
      const rows = rowsIn.map(r => r.slice());
      const head = (rows[hdr] || []).slice();
      let start = hdr + 1;
      if (rows[start] && looksUnitRow(rows[start])) {
        rows[start].forEach((u, i) => {
          const uu = String(u).replace(/[\[\]()]/g, '').trim();
          if (uu && uu !== '-' && uu !== '–') head[i] = `${head[i] || `열${i + 1}`}(${uu})`;
        });
        start++;
      }
      const body = [];
      for (let i = start; i < rows.length; i++) {
        const r = rows[i];
        if (!r.some(c => c)) {
          if (body.length) break;
          continue;
        }
        body.push(r);
      }
      const kept = body.filter(r => !SUMMARY_ROW.test(String(r.find(c => c) || '')));
      const width = Math.max(head.length, ...kept.map(r => r.length), 0);
      const keepIdx = [];
      for (let i = 0; i < width; i++) if (head[i] || kept.some(r => r[i])) keepIdx.push(i);
      const columns = keepIdx.map(i => head[i] || `열${i + 1}`);
      const out = kept.map(r => keepIdx.map(i => r[i] || ''));
      // "312 MPa"처럼 값에 붙은 단위는 머리글로 옮김
      columns.forEach((c, ci) => {
        const units = new Set();
        let numeric = 0;
        out.forEach(r => {
          const s = splitUnit(r[ci]);
          if (!isNaN(matNum(s.num)) && s.num) {
            numeric++;
            if (s.unit) units.add(s.unit);
          }
        });
        if (units.size === 1 && numeric) {
          const u = [...units][0];
          out.forEach(r => {
            const s = splitUnit(r[ci]);
            if (s.unit === u) r[ci] = s.num;
          });
          if (!matUnit(c)) columns[ci] = `${c}(${u})`;
        }
      });
      return { columns: matUniqueHeaders(columns), rows: out, removed: body.length - kept.length };
    }

    function guessTestType(columns, title) {
      const t = (columns.join(' ') + ' ' + (title || '')).toLowerCase();
      if (/피로|fatigue|cycle|사이클|수명/.test(t)) return 'fatigue';
      if (/인장|항복|tensile|yield|연신|uts/.test(t)) return 'tensile';
      if (/경도|hardness|hrb|hrc|hv|hb\b|브리넬|비커스|로크웰/.test(t)) return 'hardness';
      if (/충격|흡수\s*에너지|charpy|impact|샤르피/.test(t)) return 'impact';
      return 'custom';
    }

    function impTable() {
      const p = ui.imp && ui.imp.parsed;
      if (!p) return null;
      const sh = p.sheets[ui.imp.sheet] || p.sheets[0];
      return tableFromSheet(sh.rows, ui.imp.hdr);
    }

    function pickResultFile(target) {
      impTarget = target;
      document.getElementById('resultFileInput').click();
    }

    function dropResultFile(e, target) {
      e.preventDefault();
      e.currentTarget.classList.remove('over');
      const files = [...(e.dataTransfer && e.dataTransfer.files || [])];
      if (files.length) processResultFiles(files, target);
    }

    async function handleResultFiles(e) {
      const files = [...e.target.files];
      e.target.value = '';
      if (files.length) processResultFiles(files, impTarget);
    }

    async function processResultFiles(files, target) {
      if (files.length === 1) {
        const f = files[0];
        ui.imp = { target, fileName: f.name, busy: true, error: '', parsed: null, sheet: 0, hdr: 0, name: '', testType: 'custom' };
        render();
        try {
          const parsed = await readResultFile(f);
          const sheet = bestSheet(parsed.sheets);
          const hdr = guessHeaderRow(parsed.sheets[sheet].rows);
          ui.imp = { ...ui.imp, busy: false, parsed, sheet, hdr, name: parsed.title };
          const t = impTable();
          ui.imp.testType = (parsed.meta && parsed.meta.testType) || guessTestType(t.columns, parsed.title);
        } catch (err) {
          ui.imp = { ...ui.imp, busy: false, error: err.message || String(err) };
        }
        render();
        return;
      }
      // 여러 파일: 자동 인식으로 한 번에 넣기
      showToast(`파일 ${files.length}개를 읽는 중...`);
      let ok = 0;
      const fails = [];
      for (const f of files) {
        try {
          const parsed = await readResultFile(f);
          const sheet = bestSheet(parsed.sheets);
          const t = tableFromSheet(parsed.sheets[sheet].rows, guessHeaderRow(parsed.sheets[sheet].rows));
          if (!t.rows.length) throw new Error('데이터 행 없음');
          saveImportedTable(parsed, t, parsed.title, (parsed.meta && parsed.meta.testType) || guessTestType(t.columns, parsed.title), target, true);
          ok++;
        } catch (err) {
          fails.push(`${f.name}: ${err.message || err}`);
        }
      }
      render();
      showToast(`${ok}개 파일을 표로 넣었습니다.${fails.length ? ` 실패 ${fails.length}개 — ${fails[0]}` : ''}`);
    }

    function saveImportedTable(parsed, t, name, testType, target, silent) {
      const meta = parsed.meta || {};
      const memo = [`원본 파일: ${ui.imp && ui.imp.fileName ? ui.imp.fileName : parsed.title} (${parsed.method})`, meta.notes ? `성적서 비고: ${meta.notes}` : ''].filter(Boolean).join('\n');
      if (target === 'tests' && activeMaterial() && !silent) {
        const m = activeMaterial();
        m.columns = t.columns;
        m.rows = t.rows;
        if (!m.alloy && meta.material) m.alloy = meta.material;
        if (meta.standard && (!m.standard || m.standard === (MAT_TEST_TYPES[m.testType] || {}).std)) m.standard = meta.standard;
        if (!m.testDate && meta.testDate) m.testDate = meta.testDate;
        m.testType = testType;
        if (!m.standard) m.standard = (MAT_TEST_TYPES[testType] || {}).std || '';
        if (m.name === '새 시험 데이터') m.name = name;
        m.memo = (m.memo ? m.memo + '\n' : '') + memo;
        m.source = { fileName: ui.imp ? ui.imp.fileName : '', method: parsed.method };
        Object.keys(m.specs).forEach(k => { if (!t.columns.includes(k)) delete m.specs[k]; });
        m.groupCol = matGuessGroupCol(m);
        matGuessFatigue(m);
        touchMaterial(m);
        saveData();
        return m;
      }
      const m = normalizeMaterialSet({
        name: name || parsed.title, testType,
        alloy: meta.material || '', standard: meta.standard || (MAT_TEST_TYPES[testType] || {}).std || '', testDate: meta.testDate || '',
        columns: t.columns, rows: t.rows, memo,
        source: { fileName: ui.imp ? ui.imp.fileName : parsed.title, method: parsed.method }
      });
      m.groupCol = matGuessGroupCol(m);
      matGuessFatigue(m);
      DB.tests.unshift(m);
      if (target === 'report') {
        let r = activeReport();
        if (!r) r = createReport();
        if (!r.include.tests.includes(m.id)) r.include.tests.push(m.id);
        touch(r);
      } else {
        active.tests = m.id;
      }
      saveData();
      return m;
    }

    function confirmImport() {
      const imp = ui.imp;
      const t = impTable();
      if (!imp || !t) return;
      if (!t.rows.length) {
        showToast('데이터 행이 없습니다. 머리글 행 위치를 확인해 주세요.');
        return;
      }
      const doIt = () => {
        const m = saveImportedTable(imp.parsed, t, imp.name.trim() || imp.parsed.title, imp.testType, imp.target);
        ui.imp = null;
        if (imp.target === 'tests') matTab = 'data';
        render();
        showToast(imp.target === 'report'
          ? `'${m.name}' 표(${m.rows.length}행)를 보고서에 넣었습니다. 목표 규격은 시험 데이터 메뉴에서 넣을 수 있습니다.`
          : `'${m.name}' ${m.rows.length}행을 불러왔습니다. 통계·판정 탭에서 목표값을 넣으세요.`);
      };
      const cur = activeMaterial();
      if (imp.target === 'tests' && cur && cur.rows.length) {
        askConfirm(`현재 데이터 ${cur.rows.length}행을 '${imp.fileName}' 내용으로 바꿉니다. 계속하시겠습니까?`, doIt, { okLabel: '바꾸기' });
      } else doIt();
    }

    function setImp(field, value) {
      if (!ui.imp) return;
      if (field === 'sheet') {
        ui.imp.sheet = Number(value) || 0;
        ui.imp.hdr = guessHeaderRow(ui.imp.parsed.sheets[ui.imp.sheet].rows);
      } else if (field === 'hdr') {
        const max = ui.imp.parsed.sheets[ui.imp.sheet].rows.length - 1;
        ui.imp.hdr = Math.max(0, Math.min(max, Number(value) || 0));
      } else ui.imp[field] = value;
      render();
    }

    function closeImp() {
      ui.imp = null;
      render();
    }

    function dropZoneHtml(target, compact) {
      return `
        <div class="drop ${compact ? 'compact' : ''}" onclick="pickResultFile('${target}')"
             ondragover="event.preventDefault(); this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropResultFile(event, '${target}')">
          <i class="fa-solid fa-file-arrow-up"></i>
          <div><b>시험성적서 파일 넣기</b><span>엑셀·CSV는 바로 읽고, PDF·사진은 AI가 표로 읽음 · 끌어다 놓기 가능</span></div>
        </div>`;
    }

    function importPreviewHtml(target) {
      const imp = ui.imp;
      if (!imp || imp.target !== target) return '';
      const head = `<div class="panel-head"><h2><i class="fa-solid fa-table-list"></i> 파일 읽기 <span class="mono">${escapeHtml(imp.fileName)}</span></h2><button class="icon-btn" onclick="closeImp()" title="닫기"><i class="fa-solid fa-xmark"></i></button></div>`;
      if (imp.busy) {
        return `<section class="panel imp no-print">${head}<div class="panel-body"><div class="thinking"><span></span><span></span><span></span></div>
          <p class="hint" style="text-align:center;">${/\.(pdf|png|jpe?g|webp)$/i.test(imp.fileName) ? 'AI가 성적서에서 결과 표를 찾는 중입니다… (10~30초)' : '파일을 읽는 중입니다…'}</p></div></section>`;
      }
      if (imp.error) {
        return `<section class="panel imp no-print">${head}<div class="panel-body">
          <div class="judge fail" style="white-space:normal; padding:8px 10px; display:flex;"><i class="fa-solid fa-circle-exclamation"></i> ${escapeHtml(imp.error)}</div>
          <div class="row" style="margin-top:10px;"><button class="btn sm" onclick="pickResultFile('${target}')"><i class="fa-solid fa-rotate"></i> 다른 파일 선택</button>
          ${/API 키/.test(imp.error) ? `<button class="btn sm" onclick="go('settings')"><i class="fa-solid fa-gear"></i> AI 설정</button>` : ''}</div>
        </div></section>`;
      }
      const p = imp.parsed;
      const sh = p.sheets[imp.sheet];
      const t = impTable();
      const nums = new Set(matNumericCols({ columns: t.columns, rows: t.rows }));
      const typeOpts = Object.keys(MAT_TEST_TYPES).map(k => `<option value="${k}" ${k === imp.testType ? 'selected' : ''}>${MAT_TEST_TYPES[k].label}</option>`).join('');
      const meta = p.meta || {};
      const LIM = 12;
      return `
        <section class="panel imp no-print">
          ${head}
